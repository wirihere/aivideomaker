<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bin Sparkle — LinkedIn (clean service)</title>

<link rel="stylesheet" href="design/cards.css">
<link rel="stylesheet" href="design/templates/warm-community.css">
<link rel="stylesheet" href="videos/binsparkle/tokens.css">
<link rel="stylesheet" href="design/modules/all.css">
<script src="design/vendor/gsap.min.js"></script>
<script src="design/modules/all.js"></script>

<style>
  body { margin: 0; background: #000; font-family: var(--brand-ui); }
  .comp { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--leaf-deep); }

  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Restrained, professional scrims (less heavy than the playful deck) */
  .scrim-top { position: absolute; inset: 0 0 auto 0; height: 380px; z-index: 4;
               background: linear-gradient(180deg, rgba(13,34,24,0.60) 0%, rgba(13,34,24,0.18) 65%, transparent 100%); }
  .scrim-bottom { position: absolute; inset: auto 0 0 0; height: 980px; z-index: 4;
                  background: linear-gradient(0deg, rgba(13,34,24,0.94) 0%, rgba(13,34,24,0.80) 34%, rgba(13,34,24,0.24) 76%, transparent 100%); }

  /* Brand chip — top safe zone */
  .brand-chip { position: absolute; top: 268px; left: 0; right: 0; margin: 0 auto; width: fit-content;
                z-index: 12; display: flex; align-items: center; gap: 14px;
                background: rgba(13,34,24,0.62); padding: 14px 30px 14px 20px; border-radius: 999px;
                backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .brand-chip .bin-mark { width: 50px; height: 50px; }
  .brand-chip .wm { font-family: var(--brand-display); font-weight: 800; font-size: 44px; color: #fff; letter-spacing: -0.01em; margin: 0; }
  .brand-chip .wm i { font-style: normal; color: var(--sunny); }

  /* Professional category tag, top-right safe zone */
  .category { position: absolute; top: 282px; right: 64px; z-index: 13;
              font-family: var(--brand-ui); font-weight: 700; font-size: 24px; color: #fff;
              letter-spacing: 0.24em; text-transform: uppercase;
              background: rgba(13,34,24,0.5); padding: 9px 20px; border-radius: 999px; }

  /* Headline block — lower safe band, professional restraint */
  .headline { position: absolute; left: 72px; right: 72px; top: 1120px; z-index: 10; }
  .kicker { font-family: var(--brand-ui); font-weight: 800; font-size: 28px; letter-spacing: 0.34em;
            text-transform: uppercase; color: var(--sunny); margin: 0 0 22px; }
  h1 { font-family: var(--brand-display); font-weight: 800; color: #fff; font-size: 116px; line-height: 0.93;
       letter-spacing: -0.018em; margin: 0; text-shadow: 0 4px 26px rgba(0,0,0,0.5); }
  h1 em { font-style: normal; color: var(--sunny); }
  .sub { font-family: var(--brand-ui); font-weight: 600; font-size: 40px; color: rgba(255,255,255,0.9);
         margin: 30px 0 0; letter-spacing: 0.01em; line-height: 1.25; }

  /* URL pill — sits in the safe band */
  .cta-pill { position: absolute; left: 50%; transform: translateX(-50%); top: 1560px; z-index: 13;
              font-family: var(--brand-ui); font-weight: 700; font-size: 44px; color: var(--ink);
              background: var(--sunny); padding: 22px 58px; border-radius: 999px;
              box-shadow: 0 12px 30px rgba(0,0,0,0.30); white-space: nowrap; letter-spacing: 0.01em; }
  .cta-pill i { font-style: normal; color: var(--leaf-deep); }

  /* Footer line — Hamilton + the model, small caps, safe zone */
  .footer { position: absolute; left: 0; right: 0; top: 1706px; z-index: 11; text-align: center;
            font-family: var(--brand-ui); font-weight: 700; font-size: 24px; color: rgba(255,255,255,0.72);
            letter-spacing: 0.26em; text-transform: uppercase; }
</style>
</head>
<body>

<div id="linkedin-clean" class="comp" data-composition-id="linkedin-clean"
     data-width="1080" data-height="1920" data-start="0" data-duration="2">

  <img class="bg" src="videos/binsparkle/assets/04_scrub.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <div class="brand-chip">
    <svg class="bin-mark" viewBox="0 0 64 64"><g><rect x="6" y="20" width="52" height="38" rx="5" fill="#2f7a4d"/><rect x="6" y="12" width="52" height="9" rx="4" fill="#2f7a4d"/><path d="M48 3 L58 13 L52 13 L52 22 L44 22 L44 13 L38 13 Z" fill="#f4b942"/></g></svg>
    <p class="wm">bin<i>sparkle</i></p>
  </div>
  <div class="category">Wheelie-bin cleaning</div>

  <div class="headline">
    <p class="kicker">Booked online · Done by locals</p>
    <h1>A cleaner bin,<br><em>without the chore.</em></h1>
    <p class="sub">Washed, scrubbed, and deodorised — at your place.</p>
  </div>

  <div class="cta-pill">book a clean · <i>binsparkle.nz</i></div>
  <div class="footer">Hamilton NZ · Self-employed local contractors</div>

</div>

<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["linkedin-clean"] = tl;
</script>
</body>
</html>
