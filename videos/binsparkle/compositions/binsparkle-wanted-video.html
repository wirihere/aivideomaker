<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bin Sparkle — Wanted</title>

<link rel="stylesheet" href="design/cards.css">
<link rel="stylesheet" href="design/templates/warm-community.css">
<link rel="stylesheet" href="videos/binsparkle/tokens.css">
<link rel="stylesheet" href="design/modules/all.css">
<script src="design/vendor/gsap.min.js"></script>
<script src="design/modules/all.js"></script>

<style>
  body { margin: 0; background: #000; font-family: var(--brand-ui); }
  .comp {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 92% 88% at 50% 42%, #faf6ee 52%, #efe6cf 84%, #e3d6b6 100%);
    box-shadow: inset 0 0 220px rgba(120, 92, 40, 0.28);
  }
  .comp::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.05;
    background-image: radial-gradient(#5a4326 1px, transparent 1.4px);
    background-size: 7px 7px;
  }

  .frame {
    position: absolute; inset: 46px; z-index: 2; pointer-events: none;
    border: 7px solid var(--ink);
    box-shadow: 0 0 0 3px var(--cream), 0 0 0 7px var(--ink);
  }

  .wordmark { position: absolute; top: 64px; left: 0; right: 0; z-index: 10;
              display: flex; align-items: center; justify-content: center; gap: 12px; }
  .wordmark svg { width: 40px; height: 40px; }
  .wordmark span { font-family: var(--brand-display); font-weight: 800; font-size: 32px;
                   color: var(--ink); letter-spacing: -0.01em; }
  .wordmark span i { font-style: normal; color: var(--leaf); }

  .wanted { position: absolute; top: 226px; left: 0; right: 0; z-index: 6; text-align: center;
            font-family: var(--brand-display); font-weight: 800; font-size: 150px;
            line-height: 0.86; letter-spacing: 0.01em; color: var(--ink); margin: 0;
            text-shadow: 2px 3px 0 rgba(13,34,24,0.10); }
  .subhead { position: absolute; top: 378px; left: 0; right: 0; z-index: 6; text-align: center;
             font-family: var(--brand-display); font-weight: 500; font-style: italic;
             font-size: 46px; color: var(--leaf-deep); margin: 0; }
  .subhead b { font-style: normal; font-weight: 800; color: var(--ink); }

  .mug-wrap { position: absolute; top: 452px; left: 50%; margin-left: -380px;
              width: 760px; height: 580px; z-index: 5; }
  .mug-label { text-align: center; font-family: var(--brand-ui); font-weight: 700;
               letter-spacing: 0.32em; font-size: 22px; color: var(--ink); opacity: 0.7;
               text-transform: uppercase; margin-bottom: 10px; }
  .mug-frame { position: relative; width: 100%; height: 540px; background: #cfd2bf;
               border: 9px solid var(--ink); box-shadow: 0 14px 36px rgba(0,0,0,0.18);
               overflow: hidden; }
  .mug-frame::before, .mug-frame::after {
    content: ""; position: absolute; left: 0; right: 0; height: 2px; background: rgba(13,34,24,0.22);
  }
  .mug-frame::before { top: 33%; }
  .mug-frame::after  { top: 66%; }
  .mug { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #clean-mug { opacity: 0; }

  .case-stamp { position: absolute; top: 918px; left: 52%; z-index: 9;
                transform: rotate(-13deg); border: 6px double var(--coral); border-radius: 10px;
                padding: 12px 30px; font-family: var(--brand-display); font-weight: 800;
                font-size: 64px; color: var(--coral); letter-spacing: 0.04em;
                text-transform: uppercase; background: rgba(250,246,238,0.12); opacity: 0;
                text-shadow: 1px 1px 0 rgba(194,90,53,0.25); }

  /* charges — short lines that fit at a readable size (no overflow) */
  .charges { position: absolute; top: 1090px; left: 0; right: 0; z-index: 6; text-align: center; }
  .charges-head { font-family: var(--brand-ui); font-weight: 700; letter-spacing: 0.34em;
                  font-size: 28px; color: var(--ink); opacity: 0.72; text-transform: uppercase;
                  margin: 0 0 24px; }
  .charge { font-family: var(--brand-display); font-weight: 600; font-size: 60px;
            line-height: 1.26; color: var(--ink); margin: 0; padding: 0 70px;
            max-width: 940px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  .charge::before { content: "•"; color: var(--coral); margin-right: 18px; }

  .reward { position: absolute; top: 1100px; left: 90px; right: 90px; z-index: 7;
            background: var(--sunny); border: 5px solid var(--ink); padding: 20px;
            text-align: center; box-shadow: 0 10px 26px rgba(0,0,0,0.16); }
  .reward .k { font-family: var(--brand-ui); font-weight: 800; letter-spacing: 0.3em;
               font-size: 26px; color: var(--ink); text-transform: uppercase; }
  .reward .v { font-family: var(--brand-display); font-weight: 800; font-size: 40px;
               color: var(--ink); margin-top: 6px; line-height: 1.05; }
  .reward .v i { font-style: normal; color: var(--leaf-deep); }

  .cta-line { position: absolute; left: 0; right: 0; top: 1110px; z-index: 8; text-align: center;
              font-family: var(--brand-display); font-weight: 800; font-size: 76px; line-height: 1.0;
              color: var(--ink); margin: 0; }
  .cta-line em { font-style: normal; color: var(--leaf); }
  .cta-pill { position: absolute; left: 50%; transform: translateX(-50%); top: 1230px; z-index: 9;
              font-family: var(--brand-ui); font-weight: 700; font-size: 44px; color: var(--cream);
              background: var(--leaf-deep); padding: 20px 54px; border-radius: 999px;
              box-shadow: 0 8px 26px rgba(0,0,0,0.28); white-space: nowrap; letter-spacing: 0.01em; }

  .poster-foot { position: absolute; top: 1418px; left: 0; right: 0; z-index: 6; text-align: center;
                 font-family: var(--brand-ui); font-weight: 700; font-size: 32px;
                 letter-spacing: 0.28em; color: var(--leaf-deep); opacity: 0.6;
                 text-transform: uppercase; }
  .poster-foot::before { content: ""; display: block; width: 300px; height: 2px;
                         background: var(--leaf-deep); opacity: 0.4; margin: 0 auto 16px; }
</style>
</head>
<body>

<div id="wanted-video" class="comp" data-composition-id="wanted-video"
     data-width="1080" data-height="1920" data-start="0" data-duration="18">

  <div class="frame"></div>

  <div class="wordmark">
    <svg viewBox="0 0 64 64"><g><rect x="6" y="20" width="52" height="38" rx="5" fill="#2f7a4d"/><rect x="6" y="12" width="52" height="9" rx="4" fill="#2f7a4d"/><path d="M48 3 L58 13 L52 13 L52 22 L44 22 L44 13 L38 13 Z" fill="#f4b942"/></g></svg>
    <span>bin<i>sparkle</i></span>
  </div>

  <p class="wanted" id="wanted">WANTED</p>
  <p class="subhead" id="subhead">Dead or — <b>let's be honest —</b> cleaned.</p>

  <div class="mug-wrap" id="mug-wrap">
    <div class="mug-label">Mugshot · Hamilton, NZ</div>
    <div class="mug-frame">
      <img class="mug" id="dirty-mug" src="videos/binsparkle/assets/char2-front-disgusted-dirty.png" alt="">
      <img class="mug" id="clean-mug" src="videos/binsparkle/assets/char2-front-happy.png" alt="">
    </div>
  </div>

  <div class="case-stamp" id="case-stamp">Case closed</div>

  <div class="charges" id="charges">
    <p class="charges-head" id="charges-head">Charges</p>
    <p class="charge">Lid open since the rugby.</p>
    <p class="charge">Maggot ecosystem inside.</p>
    <p class="charge">Traumatised the postie.</p>
  </div>

  <div class="reward" id="reward">
    <div class="k">Reward</div>
    <div class="v">One BinSparkle clean. <i>Name cleared.</i></div>
  </div>

  <p class="cta-line" id="cta-line">clear its <em>name.</em></p>
  <div class="cta-pill" id="cta-pill">binsparkle.nz</div>

  <div class="poster-foot" id="poster-foot">book online · binsparkle.nz · Aotearoa NZ</div>

  <audio id="sfx-slam"    class="clip" src="assets/sfx/impact.wav" data-start="0.10" data-duration="0.60" data-track-index="9"  data-volume="0.7"></audio>
  <audio id="sfx-charges" class="clip" src="assets/sfx/tick.wav"   data-start="4.50" data-duration="0.45" data-track-index="10" data-volume="0.6"></audio>
  <audio id="sfx-reveal"  class="clip" src="assets/sfx/whoosh.mp3" data-start="10.00" data-duration="1.00" data-track-index="11" data-volume="0.55"></audio>
  <audio id="sfx-stamp"   class="clip" src="assets/sfx/impact.wav" data-start="10.65" data-duration="0.55" data-track-index="12" data-volume="0.7"></audio>
  <audio id="sfx-cta"     class="clip" src="assets/sfx/ding.wav"   data-start="14.40" data-duration="0.60" data-track-index="13" data-volume="0.6"></audio>

</div>

<script>
  gsap.set("#wanted",      { opacity: 0, scale: 1.4 });
  gsap.set("#subhead",     { opacity: 0, y: 16 });
  gsap.set("#mug-wrap",    { opacity: 0, scale: 0.92 });
  gsap.set("#clean-mug",   { opacity: 0 });
  gsap.set("#charges-head",{ opacity: 0 });
  gsap.set(".charge",      { opacity: 0, y: 22, scale: 0.92 });
  gsap.set("#case-stamp",  { opacity: 0, scale: 1.6 });
  gsap.set("#reward",      { opacity: 0, y: 30 });
  gsap.set("#cta-line",    { opacity: 0, y: 24 });
  gsap.set("#cta-pill",    { opacity: 0, scale: 0.85 });
  gsap.set("#poster-foot", { opacity: 0 });

  const tl = gsap.timeline({ paused: true });

  // Beat 1 (0-4.5s): poster arrives
  tl.to("#wanted",   { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.2)
    .to("#mug-wrap", { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.4)
    .to("#subhead",  { opacity: 1, y: 0, duration: 0.5 }, 0.9)
    .to("#poster-foot", { opacity: 0.6, duration: 0.6 }, 1.2);

  // Beat 2 (4.5-10s): charges stamp in; slow push-in on the mugshot (micro-motion)
  tl.to("#charges-head", { opacity: 1, duration: 0.3 }, 4.5)
    .to(".charge", { opacity: 1, y: 0, scale: 1, duration: 0.32, stagger: 0.42, ease: "back.out(2)" }, 4.6)
    .to("#mug-wrap", { scale: 1.05, duration: 4.2, ease: "power1.inOut" }, 5.6);

  // Beat 3 (10-14s): reveal — dirty→clean, CASE CLOSED stamp, charges dismissed, reward
  tl.to("#dirty-mug", { opacity: 0, duration: 0.65 }, 10.0)
    .to("#clean-mug", { opacity: 1, duration: 0.65 }, 10.0)
    .to("#case-stamp", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 10.7)
    .to(["#charges-head", ".charge"], { opacity: 0, duration: 0.4 }, 10.9)
    .to("#reward", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.3);
  tl.set("#dirty-mug", { opacity: 0 }, 10.65);

  // Beat 4 (14-18s): end card — subhead + reward clear, clean hero holds, CTA in the safe band
  tl.to(["#subhead", "#reward"], { opacity: 0, duration: 0.4 }, 14.0)
    .to("#cta-line", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 14.4)
    .to("#cta-pill", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 15.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["wanted-video"] = tl;
</script>
</body>
</html>
