<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bin Sparkle — Full Care (we do bin day for you)</title>

<link rel="stylesheet" href="design/cards.css">
<link rel="stylesheet" href="design/templates/warm-community.css">
<link rel="stylesheet" href="videos/binsparkle/tokens.css">
<link rel="stylesheet" href="design/modules/all.css">
<script src="design/vendor/gsap.min.js"></script>
<script src="design/modules/all.js"></script>

<!-- Brand gradients, defined once and referenced by every copy of the mark.
     Taken verbatim from binsparkle-mark.svg so the video and the site cannot
     drift apart. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="bsTile" x1="0" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#3f9463"/><stop offset="1" stop-color="#1d5634"/>
  </linearGradient>
  <linearGradient id="bsSun" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#fdd479"/><stop offset="1" stop-color="#f4b942"/>
  </linearGradient>
</defs></svg>

<style>
  body { margin: 0; background: #0f2b1d; font-family: var(--card-font-ui); }
  .comp { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #0f2b1d; }

  /* ── Photo beats ── */
  .scene { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .ph { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; will-change: transform; }
  .scene::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(9,26,18,0.58) 0%, rgba(9,26,18,0) 26%),
      linear-gradient(to top,    rgba(9,26,18,0.84) 0%, rgba(9,26,18,0.36) 26%, rgba(9,26,18,0) 48%); }
  .cap { position: absolute; left: 72px; right: 72px; bottom: 190px; z-index: 3; }
  .cap .k { font-size: 26px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
            color: #f4b942; margin: 0 0 18px; }
  .cap .h { font-family: var(--card-font-display); font-weight: 800; font-size: 104px; line-height: 0.98;
            letter-spacing: -0.035em; color: #fff; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,0.5); }
  .cap .h em { font-style: normal; color: #f4b942; }

  /* Corner lockup — the real mark, not a stand-in glyph. */
  .wordmark { position: absolute; top: 52px; left: 68px; z-index: 60; display: flex; align-items: center; gap: 16px; }
  .wordmark svg { width: 62px; height: 62px; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45)); }
  .wordmark span { font-family: var(--card-font-display); font-weight: 800; font-size: 38px;
    color: #fff; letter-spacing: -0.015em; text-shadow: 0 2px 14px rgba(0,0,0,0.5); }
  .wordmark span i { font-style: normal; color: #f4b942; }

  /* ── Intro / outro brand cards ── */
  .brandcard { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 45% at 50% 38%, rgba(63,148,99,0.42) 0%, rgba(15,43,29,0) 70%),
      linear-gradient(160deg, #1d5634 0%, #0f2b1d 60%, #0b2117 100%); }
  .bigmark { width: 470px; height: 470px; }
  .brandtype { font-family: var(--card-font-display); font-weight: 800; font-size: 116px;
    letter-spacing: -0.04em; color: #faf6ee; margin: 34px 0 0; }
  .brandtype i { font-style: normal; color: #f4b942; }
  .tagline { font-size: 38px; font-weight: 600; color: #bfdcc9; margin-top: 14px; letter-spacing: 0.01em; }
  .oPrice { font-family: var(--card-font-display); font-weight: 800; font-size: 150px; color: #f4b942;
    line-height: 1; margin: 26px 0 0; letter-spacing: -0.03em; }
  .oPriceSub { font-size: 36px; font-weight: 600; color: #cfe4d6; margin-top: 4px; }
  .oUrl { font-size: 46px; font-weight: 700; color: #0f2b1d; margin-top: 46px;
    padding: 22px 52px; border-radius: 999px; background: #f4b942; }

  /* Loose sparkles that drift over the brand cards. */
  .field { position: absolute; inset: 0; pointer-events: none; }
  .field i { position: absolute; display: block; width: 26px; height: 26px; opacity: 0; }
  .field i svg { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- Full Care cold-open: no intro brand card. Beat 1 is the Caples question
     hook; an intro logo card would weaken it. The corner wordmark carries
     brand presence from beat 1 onward. Outro brand card lands the CTA over
     the music-only tail (VO ends ~22.4s, mix is 30s). -->
<div class="comp" id="comp"
     data-composition-id="binsparkle-fullcare"
     data-width="1080" data-height="1920"
     data-start="0" data-duration="30.0" data-track-index="0">

  <!-- ══ BEAT 1: 0.00 → 4.40 — cold-open hook ══ -->
  <div id="s1" class="scene clip" data-start="0.00" data-duration="4.40" data-track-index="1">
    <img id="s1-ph" class="ph" src="videos/binsparkle/assets/01_dirty.png" alt="">
    <div class="cap"><h1 id="s1-h" class="h">Kerb. Pyjamas. Wheelie bin. <em>Again?</em></h1></div>
  </div>

  <!-- ══ BEAT 2: 4.40 → 8.80 — the "what if" ══ -->
  <div id="s2" class="scene clip" data-start="4.40" data-duration="4.40" data-track-index="1">
    <img id="s2-ph" class="ph" src="videos/binsparkle/assets/02_smell.png" alt="">
    <div class="cap"><h1 id="s2-h" class="h">Someone else <em>could do this.</em></h1></div>
  </div>

  <!-- ══ BEAT 3: 8.80 → 14.60 — the reveal ══ -->
  <div id="s3" class="scene clip" data-start="8.80" data-duration="5.80" data-track-index="1">
    <img id="s3-ph" class="ph" src="videos/binsparkle/assets/07_end.png" alt="">
    <div class="cap"><p id="s3-k" class="k">Bin Sparkle Full Care</p><h1 id="s3-h" class="h">Bins out, bins back in. <em>Not by you.</em></h1></div>
  </div>

  <!-- ══ BEAT 4: 14.60 → 17.60 — the monthly wash + testimonial ══ -->
  <div id="s4" class="scene clip" data-start="14.60" data-duration="3.00" data-track-index="1">
    <img id="s4-ph" class="ph" src="videos/binsparkle/assets/05_fresh.png" alt="">
    <div class="cap"><p id="s4-k" class="k">"Smells like nothing now — magic!" — Sarah</p><h1 id="s4-h" class="h">A proper wash, <em>every month.</em></h1></div>
  </div>

  <!-- ══ BEAT 5: 17.60 → 22.20 — CTA setup ══ -->
  <div id="s5" class="scene clip" data-start="17.60" data-duration="4.60" data-track-index="1">
    <img id="s5-ph" class="ph" src="videos/binsparkle/assets/06_photos.png" alt="">
    <div class="cap"><h1 id="s5-h" class="h">One simple <em>monthly plan.</em></h1></div>
  </div>

  <!-- Corner lockup rides the photo beats only; the outro brand card carries its own. -->
  <div class="wordmark clip" id="wm" data-start="0.50" data-duration="21.50" data-track-index="2">
    <svg viewBox="0 0 64 64">
      <rect width="64" height="64" rx="19" fill="url(#bsTile)"/>
      <path d="M0 19 A19 19 0 0 1 19 0 H45 A19 19 0 0 1 64 19 V27 C48 34 16 34 0 27 Z" fill="#ffffff" opacity="0.07"/>
      <g transform="rotate(-8 29.5 34)">
        <rect x="24.3" y="13.0" width="10.4" height="5.8" rx="2.9" fill="#ffffff" opacity="0.5"/>
        <rect x="13.6" y="17.4" width="32.8" height="6.3" rx="3.15" fill="#ffffff"/>
        <path d="M16.5 25.6 H42.5 a1.7 1.7 0 0 1 1.69 1.87 L42.24 45.3 a4.2 4.2 0 0 1 -4.18 3.8 H20.94 A4.2 4.2 0 0 1 16.76 45.3 L14.81 27.47 A1.7 1.7 0 0 1 16.5 25.6 Z" fill="#ffffff"/>
      </g>
      <path id="wm-sp" d="M50.40,6.20C50.95,11.08 52.92,13.04 57.80,13.60C52.92,14.15 50.95,16.12 50.40,21.00C49.84,16.12 47.88,14.15 43.00,13.60C47.88,13.04 49.84,11.08 50.40,6.20Z" fill="url(#bsSun)"/>
      <path d="M56.40,20.80C56.67,23.18 57.62,24.13 60.00,24.40C57.62,24.67 56.67,25.62 56.40,28.00C56.13,25.62 55.18,24.67 52.80,24.40C55.18,24.13 56.13,23.18 56.40,20.80Z" fill="#f4b942"/>
    </svg>
    <span>Bin Sparkle<i>.</i></span>
  </div>

  <!-- ══ OUTRO 22.20 → 30.00 — brand card over music-only tail ══ -->
  <div id="outro" class="brandcard clip" data-start="22.20" data-duration="7.80" data-track-index="1">
    <div class="field" id="o-field">
      <i style="left:12%;top:16%"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 7.2L21 12l-7.2 1.8L12 21l-1.8-7.2L3 12l7.2-1.8z" fill="#f4b942"/></svg></i>
      <i style="left:84%;top:22%"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 7.2L21 12l-7.2 1.8L12 21l-1.8-7.2L3 12l7.2-1.8z" fill="#fdd479"/></svg></i>
      <i style="left:18%;top:78%"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 7.2L21 12l-7.2 1.8L12 21l-1.8-7.2L3 12l7.2-1.8z" fill="#fdd479"/></svg></i>
      <i style="left:82%;top:82%"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 7.2L21 12l-7.2 1.8L12 21l-1.8-7.2L3 12l7.2-1.8z" fill="#f4b942"/></svg></i>
    </div>

    <svg class="bigmark" id="o-mark" viewBox="0 0 64 64" style="width:300px;height:300px">
      <rect id="o-tile" width="64" height="64" rx="19" fill="url(#bsTile)"/>
      <path d="M0 19 A19 19 0 0 1 19 0 H45 A19 19 0 0 1 64 19 V27 C48 34 16 34 0 27 Z" fill="#ffffff" opacity="0.07"/>
      <g id="o-bin" transform="rotate(-8 29.5 34)">
        <rect x="24.3" y="13.0" width="10.4" height="5.8" rx="2.9" fill="#ffffff" opacity="0.5"/>
        <rect id="o-lid" x="13.6" y="17.4" width="32.8" height="6.3" rx="3.15" fill="#ffffff"/>
        <path d="M16.5 25.6 H42.5 a1.7 1.7 0 0 1 1.69 1.87 L42.24 45.3 a4.2 4.2 0 0 1 -4.18 3.8 H20.94 A4.2 4.2 0 0 1 16.76 45.3 L14.81 27.47 A1.7 1.7 0 0 1 16.5 25.6 Z" fill="#ffffff"/>
        <path d="M23.1 30.2 L22.1 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
        <path d="M29.5 30.2 L29.5 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
        <path d="M35.9 30.2 L36.9 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
      </g>
      <path id="o-sp1" d="M50.40,6.20C50.95,11.08 52.92,13.04 57.80,13.60C52.92,14.15 50.95,16.12 50.40,21.00C49.84,16.12 47.88,14.15 43.00,13.60C47.88,13.04 49.84,11.08 50.40,6.20Z" fill="url(#bsSun)"/>
      <path id="o-sp2" d="M56.40,20.80C56.67,23.18 57.62,24.13 60.00,24.40C57.62,24.67 56.67,25.62 56.40,28.00C56.13,25.62 55.18,24.67 52.80,24.40C55.18,24.13 56.13,23.18 56.40,20.80Z" fill="#f4b942"/>
      <path id="o-sp3" d="M43.60,6.00C43.78,7.58 44.42,8.22 46.00,8.40C44.42,8.58 43.78,9.22 43.60,10.80C43.42,9.22 42.78,8.58 41.20,8.40C42.78,8.22 43.42,7.58 43.60,6.00Z" fill="#f4b942" opacity="0.9"/>
    </svg>

    <h1 class="brandtype" id="o-type" style="font-size:96px">Bin Sparkle<i>.</i></h1>
    <div class="oPrice" id="o-price">$55</div>
    <div class="oPriceSub" id="o-psub">per month · Full Care</div>
    <div class="oUrl" id="o-url">binsparkle.nz</div>
  </div>

  <audio id="vo" class="clip" src="videos/binsparkle/voiceover/binsparkle-fullcare-mixed.mp3"
         data-start="0" data-duration="30.0" data-track-index="9"
         data-volume="1.0" data-audio="true" preload="auto"></audio>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["binsparkle-fullcare"] = tl;

  // ── PHOTO BEATS — Ken-Burns push-ins ──────────────────────────
  // Each shot scales slightly across its full duration for cinematic motion.
  const SHOTS = [
    ["#s1-ph",  0.00, 4.40, 1.00, 1.07],
    ["#s2-ph",  4.40, 4.40, 1.07, 1.00],
    ["#s3-ph",  8.80, 5.80, 1.00, 1.08],
    ["#s4-ph", 14.60, 3.00, 1.06, 1.00],
    ["#s5-ph", 17.60, 4.60, 1.00, 1.07],
  ];
  SHOTS.forEach(([sel, at, dur, from, to]) => {
    tl.fromTo(sel, { scale: from }, { scale: to, duration: dur, ease: "none" }, at);
  });

  function rise(sel, at){ tl.fromTo(sel, { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at); }

  // Caption reveals — each text lands ~0.2s into its beat.
  textFx.cascade(tl, "#s1-h", { at: 0.20, duration: 0.50, stagger: 0.045, ease: "power3.out" });
  textFx.cascade(tl, "#s2-h", { at: 4.60, duration: 0.50, stagger: 0.045, ease: "power3.out" });
  rise("#s3-k", 9.00); textFx.cascade(tl, "#s3-h", { at: 9.30, duration: 0.55, stagger: 0.045, ease: "power3.out" });
  rise("#s4-k", 14.80); textFx.cascade(tl, "#s4-h", { at: 15.10, duration: 0.48, stagger: 0.045, ease: "power3.out" });
  textFx.cascade(tl, "#s5-h", { at: 17.80, duration: 0.50, stagger: 0.045, ease: "power3.out" });

  // corner wordmark fades in early and rides the photo beats
  tl.fromTo("#wm", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.50);
  tl.to("#wm-sp", { scale: 1.2, transformOrigin: "50% 50%", duration: 0.55, yoyo: true, repeat: 18, ease: "sine.inOut" }, 1.50);

  // ── OUTRO: the mark returns and the sparkles burst ────────────
  tl.fromTo("#o-mark", { scale: 0.45, opacity: 0, rotation: -10 },
                       { scale: 1, opacity: 1, rotation: 0, duration: 0.62, ease: "back.out(1.8)" }, 22.30);
  tl.fromTo("#o-bin", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "elastic.out(1, 0.65)" }, 22.50);
  tl.fromTo("#o-lid", { rotation: 0, svgOrigin: "15.5 20.5" }, { rotation: -50, duration: 0.22, ease: "power2.out" }, 22.80);
  tl.to("#o-lid", { rotation: 0, duration: 0.38, ease: "bounce.out" }, 23.02);

  [["#o-sp1", 22.80], ["#o-sp3", 22.92], ["#o-sp2", 23.02]].forEach(([sel, at]) => {
    tl.fromTo(sel, { scale: 0, rotation: -140, transformOrigin: "50% 50%", opacity: 0 },
                   { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2.6)" }, at);
  });
  tl.to("#o-sp1", { scale: 1.2, duration: 0.4, yoyo: true, repeat: 5, transformOrigin: "50% 50%", ease: "sine.inOut" }, 23.50);

  textFx.cascade(tl, "#o-type", { at: 23.04, duration: 0.5, stagger: 0.045, ease: "power3.out" });
  rise("#o-price", 23.42);
  rise("#o-psub", 23.70);
  rise("#o-url",  24.00);

  tl.fromTo("#o-field i", { scale: 0.2, opacity: 0 },
    { scale: 1, opacity: 0.9, duration: 0.6, stagger: 0.08, ease: "back.out(2.2)" }, 22.85);
  tl.to("#o-field i", { y: -22, rotation: 20, duration: 3.2, stagger: 0.07, ease: "sine.inOut" }, 23.50);

  if (window === window.top) { setTimeout(() => tl.play(0), 250); }
</script>
</body>
</html>
