<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:4200px;height:700px;overflow:hidden}
  .cover{
    position:relative;width:4200px;height:700px;overflow:hidden;
    background:linear-gradient(118deg,#faf6ee 0%,#efe7d4 100%);
    font-family:"Inter",system-ui,sans-serif;color:#1f5b38;
  }
  /* depth layers */
  .watermark{position:absolute;right:-260px;top:50px;width:620px;height:620px;opacity:.022}
  .accent{position:absolute;left:2120px;top:-160px;width:10px;height:1020px;background:linear-gradient(#f4b942,#e7a522);transform:rotate(14deg);border-radius:8px;opacity:.85}
  .vignette{position:absolute;inset:0;background:radial-gradient(120% 130% at 18% 50%,transparent 55%,rgba(31,91,56,.035) 100%);pointer-events:none}

  .left{position:absolute;left:400px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:60px}
  .mark{width:212px;height:212px;flex:none;filter:drop-shadow(0 18px 36px rgba(31,91,56,.22))}
  .left .text{display:flex;flex-direction:column;gap:18px}
  .brand{font-family:"Bricolage Grotesque","General Sans",sans-serif;font-weight:800;font-size:150px;letter-spacing:-4px;color:#1f5b38;line-height:.92}
  .brand .dot{color:#f4b942}
  .tagline{font-size:41px;font-weight:600;color:rgba(31,91,56,.68);letter-spacing:.2px}

  .right{position:absolute;left:2200px;right:400px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:38px;align-items:flex-start}
  .headline{font-family:"Bricolage Grotesque","General Sans",sans-serif;font-weight:800;font-size:128px;letter-spacing:-3px;color:#1f5b38;line-height:.95}
  .headline .pop{color:#a8741a;text-shadow:0 2px 0 rgba(255,255,255,.5)}
  .subhead{font-size:42px;font-weight:500;color:rgba(31,91,56,.72);line-height:1.25;max-width:1700px}
  .cta{align-self:flex-start;margin-top:8px;background:linear-gradient(180deg,#2f7a4d,#1b5232);color:#faf6ee;padding:36px 92px;border-radius:999px;font-weight:700;font-size:58px;letter-spacing:.3px;box-shadow:0 18px 38px rgba(31,91,56,.3),inset 0 2px 0 rgba(255,255,255,.18);display:flex;align-items:center;gap:18px}
  .proof{margin-top:-6px;font-size:34px;font-weight:500;color:rgba(31,91,56,.6)}

  .band{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(90deg,#f4b942,#e7a522)}
  .spark{position:absolute;fill:#f4b942}
  .s1{left:1780px;top:96px;width:64px;height:64px;opacity:.9}
  .s2{left:1640px;bottom:120px;width:38px;height:38px;opacity:.7}
</style>
</head>
<body>
<div class="cover">
  <svg class="watermark" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="wmTile" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#3f9463"/><stop offset="1" stop-color="#1d5634"/></linearGradient>
    </defs>
    <rect width="64" height="64" rx="19" fill="url(#wmTile)"/>
    <g transform="rotate(-8 29.5 34)">
      <rect x="13.6" y="17.4" width="32.8" height="6.3" rx="3.15" fill="#ffffff"/>
      <path d="M16.5 25.6 H42.5 a1.7 1.7 0 0 1 1.69 1.87 L42.24 45.3 a4.2 4.2 0 0 1 -4.18 3.8 H20.94 A4.2 4.2 0 0 1 16.76 45.3 L14.81 27.47 A1.7 1.7 0 0 1 16.5 25.6 Z" fill="#ffffff"/>
    </g>
  </svg>
  <div class="accent"></div>
  <div class="vignette"></div>

  <svg class="spark s1" viewBox="0 0 10 10"><path d="M5 0L6.2 3.8L10 5L6.2 6.2L5 10L3.8 6.2L0 5L3.8 3.8Z"/></svg>
  <svg class="spark s2" viewBox="0 0 10 10"><path d="M5 0L6.2 3.8L10 5L6.2 6.2L5 10L3.8 6.2L0 5L3.8 3.8Z"/></svg>

  <div class="left">
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Bin Sparkle">
      <defs>
        <linearGradient id="bsTile" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#3f9463"/><stop offset="1" stop-color="#1d5634"/></linearGradient>
        <linearGradient id="bsSun" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#fdd479"/><stop offset="1" stop-color="#f4b942"/></linearGradient>
      </defs>
      <rect width="64" height="64" rx="19" fill="url(#bsTile)"/>
      <path d="M0 19 A19 19 0 0 1 19 0 H45 A19 19 0 0 1 64 19 V27 C48 34 16 34 0 27 Z" fill="#ffffff" opacity="0.07"/>
      <g transform="rotate(-8 29.5 34)">
        <rect x="24.3" y="13.0" width="10.4" height="5.8" rx="2.9" fill="#ffffff" opacity="0.5"/>
        <rect x="13.6" y="17.4" width="32.8" height="6.3" rx="3.15" fill="#ffffff"/>
        <path d="M16.5 25.6 H42.5 a1.7 1.7 0 0 1 1.69 1.87 L42.24 45.3 a4.2 4.2 0 0 1 -4.18 3.8 H20.94 A4.2 4.2 0 0 1 16.76 45.3 L14.81 27.47 A1.7 1.7 0 0 1 16.5 25.6 Z" fill="#ffffff"/>
        <path d="M23.1 30.2 L22.1 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
        <path d="M29.5 30.2 L29.5 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
        <path d="M35.9 30.2 L36.9 44.4" stroke="#2f7a4d" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
      </g>
      <path d="M50.40,6.20C50.95,11.08 52.92,13.04 57.80,13.60C52.92,14.15 50.95,16.12 50.40,21.00C49.84,16.12 47.88,14.15 43.00,13.60C47.88,13.04 49.84,11.08 50.40,6.20Z" fill="url(#bsSun)"/>
      <path d="M56.40,20.80C56.67,23.18 57.62,24.13 60.00,24.40C57.62,24.67 56.67,25.62 56.40,28.00C56.13,25.62 55.18,24.67 52.80,24.40C55.18,24.13 56.13,23.18 56.40,20.80Z" fill="#f4b942"/>
      <path d="M43.60,6.00C43.78,7.58 44.42,8.22 46.00,8.40C44.42,8.58 43.78,9.22 43.60,10.80C43.42,9.22 42.78,8.58 41.20,8.40C42.78,8.22 43.42,7.58 43.60,6.00Z" fill="#f4b942" opacity="0.9"/>
    </svg>
    <div class="text">
      <div class="brand">Bin Sparkle<span class="dot">.</span></div>
      <div class="tagline">NZ's friendliest bin clean</div>
    </div>
  </div>

  <div class="right">
    <div class="headline">Sparkling bins.<br><span class="pop">Zero effort.</span></div>
    <div class="subhead">Weekly wheelie-bin cleaning for homes &amp; businesses.</div>
    <div class="cta">Book at binsparkle.nz</div>
    <div class="proof">Hamilton now &middot; Rolling out NZ-wide</div>
  </div>

  <div class="band"></div>
</div>
</body>
</html>
