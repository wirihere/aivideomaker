<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chat conversation — bubbles slide in alternately, typing dots appear, last reply pops.
  Total: 4.0s. Holds.
  Viewport: 480 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Bubble 1 (left) -->
  <g transform="translate(40 30)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 30" to="40 30" begin="0.0s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <path d="M 8 8 L 8 56 Q 8 70 22 70 L 200 70 Q 214 70 214 56 L 214 22 Q 214 8 200 8 L 22 8 Q 8 8 8 22 Z M 14 56 L 8 70 L 26 60 Z"
          fill="#e2e8f0"/>
    <text x="22" y="36" font-family="Inter, system-ui, sans-serif"
          font-size="14" fill="#0f172a">hey, you free tonight?</text>
    <text x="22" y="58" font-family="Inter, system-ui, sans-serif"
          font-size="11" fill="#64748b">8:42 PM</text>
  </g>

  <!-- Bubble 2 (right, indigo) -->
  <g transform="translate(220 110)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="240 110" to="220 110" begin="0.9s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <path d="M 22 8 L 22 56 Q 22 70 36 70 L 214 70 Q 228 70 228 56 L 228 22 Q 228 8 214 8 L 36 8 Q 22 8 22 22 Z M 222 56 L 228 70 L 210 60 Z"
          fill="#4f46e5"/>
    <text x="36" y="36" font-family="Inter, system-ui, sans-serif"
          font-size="14" fill="#ffffff">yeah! what's the plan?</text>
    <text x="36" y="58" font-family="Inter, system-ui, sans-serif"
          font-size="11" fill="#c7d2fe">8:43 PM</text>
  </g>

  <!-- Typing indicator (left) -->
  <g transform="translate(40 200)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1"
             begin="1.7s" dur="1.0s" fill="freeze"/>
    <rect width="80" height="42" rx="20" fill="#e2e8f0"/>
    <g fill="#64748b">
      <circle cx="22" cy="21" r="4">
        <animate attributeName="cy" values="21;14;21" dur="0.6s" begin="1.7s" repeatCount="3"/>
      </circle>
      <circle cx="40" cy="21" r="4">
        <animate attributeName="cy" values="21;14;21" dur="0.6s" begin="1.8s" repeatCount="3"/>
      </circle>
      <circle cx="58" cy="21" r="4">
        <animate attributeName="cy" values="21;14;21" dur="0.6s" begin="1.9s" repeatCount="3"/>
      </circle>
    </g>
  </g>

  <!-- Final reply (left) -->
  <g transform="translate(40 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 220" to="40 200" begin="2.7s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <path d="M 8 8 L 8 96 Q 8 110 22 110 L 280 110 Q 294 110 294 96 L 294 22 Q 294 8 280 8 L 22 8 Q 8 8 8 22 Z M 14 96 L 8 110 L 26 100 Z"
          fill="#e2e8f0"/>
    <text x="22" y="36" font-family="Inter, system-ui, sans-serif"
          font-size="14" fill="#0f172a">pizza + that movie I told you</text>
    <text x="22" y="60" font-family="Inter, system-ui, sans-serif"
          font-size="14" fill="#0f172a">about. 8pm at mine?</text>
    <text x="22" y="92" font-family="Inter, system-ui, sans-serif"
          font-size="11" fill="#64748b">8:44 PM</text>
  </g>
</svg>
