<?xml version="1.0" encoding="UTF-8"?>
<!--
  Email send — envelope appears, paper-plane shoots off in an arc, vapor trail fades, "SENT" badge appears.
  Total: 2.6s. Holds.
  Viewport: 480 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Envelope -->
  <g transform="translate(120 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="120 220" to="120 200" begin="0s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M -50 -30 L 0 10 L 50 -30" fill="none" stroke="#0f172a" stroke-width="2.5"
          stroke-linejoin="round"/>
    <!-- Flap opens -->
    <path d="M -50 -30 L 0 10 L 50 -30 L 50 -30 L -50 -30 Z" fill="#4f46e5" opacity="0">
      <animate attributeName="opacity" from="0" to="0.3" begin="0.5s" dur="0.2s" fill="freeze"/>
    </path>
  </g>

  <!-- Paper plane (flies along arc) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.2s" fill="freeze"/>
    <g transform="translate(120 200)">
      <path d="M -16 0 L 16 -10 L -8 6 L -10 0 L -16 0 Z" fill="#06b6d4" stroke="#0f172a" stroke-width="2"/>
      <animateMotion path="M 0 0 Q 100 -160 240 -120" begin="0.7s" dur="1.3s" fill="freeze"
                     rotate="auto" calcMode="spline" keySplines="0.4 0 0.4 1"/>
    </g>
  </g>

  <!-- Vapor trail (segments fade in along the arc) -->
  <g fill="#94a3b8">
    <circle cx="160" cy="180" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" begin="1.0s" dur="0.6s" fill="freeze"/>
    </circle>
    <circle cx="200" cy="140" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" begin="1.2s" dur="0.6s" fill="freeze"/>
    </circle>
    <circle cx="260" cy="100" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" begin="1.4s" dur="0.6s" fill="freeze"/>
    </circle>
    <circle cx="320" cy="80"  r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" begin="1.6s" dur="0.6s" fill="freeze"/>
    </circle>
  </g>

  <!-- SENT badge -->
  <g transform="translate(380 90)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.5" to="1" begin="2.1s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <rect x="-44" y="-18" width="88" height="36" rx="18" fill="#10b981"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800"
          fill="#ffffff" text-anchor="middle" dy="6" letter-spacing="2">SENT</text>
  </g>
</svg>
