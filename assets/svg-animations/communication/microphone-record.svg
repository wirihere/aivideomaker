<?xml version="1.0" encoding="UTF-8"?>
<!--
  Microphone recording — mic appears, REC dot pulses, audio waveform animates beside it.
  Total: ~loop after 0.6s entrance.
  Viewport: 480 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <!-- Mic -->
  <g transform="translate(120 120)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.8" to="1" begin="0s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <rect x="-22" y="-60" width="44" height="80" rx="22" fill="#0f172a"/>
    <rect x="-22" y="-60" width="44" height="80" rx="22" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M -34 0 Q -34 30 0 30 Q 34 30 34 0" fill="none" stroke="#0f172a" stroke-width="5"
          stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="50" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- REC indicator -->
  <g transform="translate(120 30)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
    <circle r="6" fill="#dc2626">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="5" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="800" fill="#dc2626" letter-spacing="3">REC</text>
  </g>

  <!-- Waveform bars -->
  <g transform="translate(220 120)" fill="#fbbf24">
    <rect x="0"   y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;60;24" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-30;-12" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="14"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;80;24" dur="0.7s" begin="0.05s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-40;-12" dur="0.7s" begin="0.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="28"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;100;24" dur="0.7s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-50;-12" dur="0.7s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="42"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;70;24" dur="0.7s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-35;-12" dur="0.7s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="56"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;90;24" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-45;-12" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="70"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;50;24" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-25;-12" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="84"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;110;24" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-55;-12" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="98"  y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;80;24" dur="0.7s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-40;-12" dur="0.7s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;60;24" dur="0.7s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-30;-12" dur="0.7s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="126" y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;90;24" dur="0.7s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-45;-12" dur="0.7s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="-12" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;40;24" dur="0.7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-20;-12" dur="0.7s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Timer -->
  <g transform="translate(420 30)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
    <text font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700"
          fill="#0f172a" text-anchor="end">00:18</text>
  </g>
</svg>
