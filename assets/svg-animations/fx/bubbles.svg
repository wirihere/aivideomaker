<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bubbles — translucent bubbles rise from bottom and pop near the top. Loops.
  Viewport: 320 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <radialGradient id="bubble-grad" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#0e7490" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Water tint -->
  <rect width="320" height="480" fill="#0e7490" opacity="0.15"/>

  <g>
    <circle cx="60"  cy="500" r="20" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="60;80;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="500" r="14" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="140;120;140" dur="5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="500" r="24" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="7s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220;240;220" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="500" r="10" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;260;280" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40"  cy="500" r="16" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="5.4s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="40;60;40" dur="5.4s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="500" r="18" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="6.2s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;200;180" dur="6.2s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="500" r="12" fill="url(#bubble-grad)" stroke="#0891b2" stroke-width="1">
      <animate attributeName="cy" from="500" to="-40" dur="4.2s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="100;90;100" dur="4.2s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
