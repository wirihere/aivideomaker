<?xml version="1.0" encoding="UTF-8"?>
<!--
  Smoke rise — overlapping puffs rise and dissipate. Loops.
  Viewport: 240 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480">
  <g fill="#94a3b8">
    <circle cx="120" cy="450" r="14">
      <animate attributeName="cy" from="450" to="60"  dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="14"  to="48"  dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="450" r="12">
      <animate attributeName="cy" from="450" to="80"  dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" from="100" to="80"  dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="12"  to="44"  dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="450" r="10">
      <animate attributeName="cy" from="450" to="100" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" from="140" to="160" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="10"  to="40"  dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="450" r="9">
      <animate attributeName="cy" from="450" to="40"  dur="4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="9"   to="38"  dur="4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="450" r="8">
      <animate attributeName="cy" from="450" to="120" dur="4s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" from="110" to="90"  dur="4s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="8"   to="32"  dur="4s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="450" r="8">
      <animate attributeName="cy" from="450" to="60"  dur="4s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="cx" from="130" to="150" dur="4s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="r"  from="8"   to="34"  dur="4s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="3.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
