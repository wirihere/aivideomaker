<?xml version="1.0" encoding="UTF-8"?>
<!--
  Glitch — RGB-split blocks shift on a square then settle. Loops.
  Viewport: 320 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <g transform="translate(160 160)">
    <!-- Cyan offset -->
    <rect x="-100" y="-100" width="200" height="200" fill="#06b6d4" opacity="0.85">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-12 4;6 -2;0 0;-8 0;0 0"
        keyTimes="0;0.1;0.2;0.5;0.6;1"
        dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Magenta offset -->
    <rect x="-100" y="-100" width="200" height="200" fill="#ec4899" opacity="0.85">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;10 -3;-6 4;0 0;8 -1;0 0"
        keyTimes="0;0.1;0.2;0.5;0.6;1"
        dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="mix-blend-mode" values="screen;screen" dur="2.4s"/>
    </rect>
    <!-- Black core -->
    <rect x="-100" y="-100" width="200" height="200" fill="#0f172a" opacity="0.55"/>
    <text y="10" font-family="'Courier New', monospace" font-size="44"
          font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">404</text>

    <!-- Scan slices that flicker through -->
    <g>
      <rect x="-100" y="-30" width="200" height="6" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="0.3s" begin="0.6s;2.0s" fill="freeze"/>
        <animate attributeName="y" values="-80;-30;20" dur="0.3s" begin="0.6s;2.0s" fill="freeze"/>
      </rect>
      <rect x="-100" y="40" width="200" height="3" fill="#06b6d4" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="0.4s" begin="1.0s" fill="freeze"/>
        <animate attributeName="y" values="-100;40;100" dur="0.4s" begin="1.0s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
