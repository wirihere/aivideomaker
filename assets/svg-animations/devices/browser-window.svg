<?xml version="1.0" encoding="UTF-8"?>
<!--
  Browser window — frame appears, URL types in, page content cascades.
  Total: 3.4s. Holds.
  Viewport: 720 × 460.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <!-- Window -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 12" to="0 0" begin="0s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <rect x="40" y="30" width="640" height="400" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="40" y="30" width="640" height="42" rx="12" fill="#f1f5f9"/>
    <rect x="40" y="60" width="640" height="12" fill="#f1f5f9"/>

    <!-- Traffic lights -->
    <circle cx="62" cy="51" r="6" fill="#ef4444"/>
    <circle cx="82" cy="51" r="6" fill="#fbbf24"/>
    <circle cx="102" cy="51" r="6" fill="#22c55e"/>

    <!-- URL bar -->
    <rect x="140" y="40" width="500" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="56" font-family="'Courier New', monospace" font-size="13" fill="#0f172a">
      <animate attributeName="textContent"
               values="| ;h;ht;htt;http;https;https:;https:/;https://;https://w;https://wh;https://why;https://why.;https://why.is;https://why.is.;https://why.is.it;https://why.is.it.;https://why.is.it.so;https://why.is.it.so.;https://why.is.it.so.cool"
               begin="0.6s" dur="2.2s" fill="freeze"/>
      |
    </text>
  </g>

  <!-- Page content -->
  <g transform="translate(80 100)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>

    <rect x="0"   y="0"   width="200" height="22" rx="3" fill="#0f172a"/>
    <rect x="0"   y="40"  width="320" height="14" rx="3" fill="#cbd5e1"/>
    <rect x="0"   y="62"  width="280" height="14" rx="3" fill="#cbd5e1"/>

    <rect x="0"   y="110" width="170" height="120" rx="6" fill="#eef2ff"/>
    <rect x="190" y="110" width="170" height="120" rx="6" fill="#ecfeff"/>
    <rect x="380" y="110" width="170" height="120" rx="6" fill="#fef3c7"/>

    <rect x="0"   y="250" width="220" height="36" rx="18" fill="#4f46e5"/>
    <text x="110" y="274" font-family="Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">START FREE TRIAL</text>
  </g>
</svg>
