<?xml version="1.0" encoding="UTF-8"?>
<!--
  Consent Mate brand animation — paper + tick
  Sibling to claim-mate-paper-tick.svg. Identical timing and structure,
  different content on the paper and different accent colour.

  Paper shows a Resource Consent application header instead of an ACC letter.
  No DECLINED stamp — this is the "approved" path. The green tick draws
  across the form like a signature, marking it ready.

  Story in 4 beats:
    1. Paper slides up (0.0 – 0.55s)
    2. Council letterhead + body lines fade in (0.45 – 1.3s)
    3. Green tick draws across the form (2.0 – 2.7s)
    4. consent/mate wordmark fades in (2.9 – 3.3s)

  Colours:
    paper #eef1f5  ·  ink #0d1826  ·  accent (consent) #2f5d3a
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">

  <defs>
    <pattern id="grid-c" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c8d0da" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas wash -->
  <rect width="480" height="480" fill="#eef1f5"/>
  <rect width="480" height="480" fill="url(#grid-c)"/>

  <!-- Paper -->
  <g transform="translate(0 480)">
    <animateTransform attributeName="transform" type="translate"
      from="0 480" to="0 0" begin="0s" dur="0.55s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <rect x="70" y="60" width="340" height="340" fill="#ffffff" stroke="#0d1826" stroke-width="1.4"/>

    <!-- Corner crop ticks -->
    <g stroke="#0d1826" stroke-width="1.5" fill="none">
      <path d="M 70 75 L 70 60 L 85 60"/>
      <path d="M 395 60 L 410 60 L 410 75"/>
      <path d="M 70 385 L 70 400 L 85 400"/>
      <path d="M 395 400 L 410 400 L 410 385"/>
    </g>

    <!-- Council letterhead -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.35s" fill="freeze"/>
      <text x="90" y="100" font-family="Consolas, 'JetBrains Mono', monospace"
            font-size="13" font-weight="700" fill="#0d1826" letter-spacing="1.5">
        RESOURCE CONSENT
      </text>
      <text x="90" y="118" font-family="Consolas, 'JetBrains Mono', monospace"
            font-size="13" font-weight="700" fill="#0d1826" letter-spacing="1.5">
        APPLICATION · RMA s.88
      </text>
      <line x1="90" y1="130" x2="390" y2="130" stroke="#0d1826" stroke-width="1"/>
      <text x="90" y="150" font-family="Consolas, 'JetBrains Mono', monospace"
            font-size="10" fill="#4b5a6d" letter-spacing="1">
        APPLICANT · 18 MARCH 2026
      </text>
    </g>

    <!-- Mock form field labels — left column -->
    <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="10"
       fill="#4b5a6d" letter-spacing="1">
      <text x="90" y="185" opacity="0">
        SITE ADDRESS
        <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.18s" fill="freeze"/>
      </text>
      <text x="90" y="218" opacity="0">
        PROPOSED WORKS
        <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.18s" fill="freeze"/>
      </text>
      <text x="90" y="251" opacity="0">
        ZONE · RESIDENTIAL
        <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.18s" fill="freeze"/>
      </text>
      <text x="90" y="284" opacity="0">
        ENV. EFFECTS REPORT
        <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.18s" fill="freeze"/>
      </text>
    </g>

    <!-- Mock body lines — right column value placeholders -->
    <g stroke="#0d1826" stroke-width="1.4" opacity="0.18">
      <line x1="220" y1="180" x2="390" y2="180" opacity="0">
        <animate attributeName="opacity" from="0" to="0.18" begin="0.9s" dur="0.18s" fill="freeze"/>
      </line>
      <line x1="220" y1="213" x2="390" y2="213" opacity="0">
        <animate attributeName="opacity" from="0" to="0.18" begin="1.0s" dur="0.18s" fill="freeze"/>
      </line>
      <line x1="220" y1="246" x2="360" y2="246" opacity="0">
        <animate attributeName="opacity" from="0" to="0.18" begin="1.1s" dur="0.18s" fill="freeze"/>
      </line>
      <line x1="220" y1="279" x2="390" y2="279" opacity="0">
        <animate attributeName="opacity" from="0" to="0.18" begin="1.2s" dur="0.18s" fill="freeze"/>
      </line>
    </g>

    <!-- Status row (pending → tick) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.3s" fill="freeze"/>
      <line x1="90" y1="320" x2="390" y2="320" stroke="#0d1826" stroke-width="1" opacity="0.3"/>
      <text x="90" y="345" font-family="Consolas, 'JetBrains Mono', monospace"
            font-size="12" font-weight="700" fill="#0d1826" letter-spacing="1.5">
        STATUS
      </text>
      <text x="390" y="345" font-family="Consolas, 'JetBrains Mono', monospace"
            font-size="12" font-weight="700" fill="#2f5d3a" letter-spacing="1.5"
            text-anchor="end">
        READY TO LODGE
      </text>
    </g>

    <!-- Green tick — draws across the form like a signature -->
    <path d="M 160 280 Q 200 320 230 360 Q 295 240 355 210"
          fill="none" stroke="#2f5d3a" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0"
               begin="2.0s" dur="0.7s" fill="freeze"
               calcMode="spline" keySplines="0.4 0.1 0.3 1"/>
    </path>

    <!-- Small green reinforcement badge at tick's peak -->
    <g opacity="0" transform="translate(355 210)">
      <animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.2s" fill="freeze"/>
      <circle cx="0" cy="0" r="14" fill="#2f5d3a"/>
      <path d="M -5 0 L -1 4 L 6 -5" fill="none" stroke="#ffffff"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(240 440)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="240 455" to="240 440" begin="2.95s" dur="0.35s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <text x="0" y="0" font-family="Consolas, 'JetBrains Mono', monospace"
          font-size="18" font-weight="700" fill="#0d1826" letter-spacing="-0.3"
          text-anchor="middle">
      CONSENT<tspan fill="#2f5d3a">/</tspan>MATE
    </text>
  </g>
</svg>
