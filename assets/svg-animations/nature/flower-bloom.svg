<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flower bloom — stem rises, leaves unfurl, six petals open from center, then sway.
  Total: 3.6s. Holds with sway.
  Viewport: 320 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <!-- Stem -->
  <path d="M 160 460 L 160 220" fill="none" stroke="#16a34a" stroke-width="6"
        stroke-dasharray="240" stroke-dashoffset="240">
    <animate attributeName="stroke-dashoffset" from="240" to="0" begin="0s" dur="0.8s" fill="freeze"/>
  </path>

  <!-- Leaves -->
  <g transform="translate(160 360)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <ellipse cx="-30" cy="-10" rx="34" ry="14" fill="#22c55e" transform="rotate(-30 -30 -10)"/>
    <ellipse cx="30"  cy="-30" rx="34" ry="14" fill="#22c55e" transform="rotate(30 30 -30)"/>
  </g>

  <!-- Flower head — pivot at center -->
  <g transform="translate(160 200)">
    <!-- Petals -->
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0;1.1;1" keyTimes="0;0.7;1" begin="1.2s" dur="0.8s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1; 0.4 0 0.6 1"/>
      <g fill="#fbbf24" stroke="#92400e" stroke-width="2">
        <ellipse cx="0" cy="-40" rx="20" ry="32"/>
        <ellipse cx="0" cy="-40" rx="20" ry="32" transform="rotate(60)"/>
        <ellipse cx="0" cy="-40" rx="20" ry="32" transform="rotate(120)"/>
        <ellipse cx="0" cy="-40" rx="20" ry="32" transform="rotate(180)"/>
        <ellipse cx="0" cy="-40" rx="20" ry="32" transform="rotate(240)"/>
        <ellipse cx="0" cy="-40" rx="20" ry="32" transform="rotate(300)"/>
      </g>
      <!-- Center -->
      <circle r="20" fill="#92400e"/>
      <circle r="20" fill="none" stroke="#451a03" stroke-width="2"/>
      <g fill="#451a03">
        <circle cx="-8" cy="-4" r="2"/>
        <circle cx="8"  cy="-4" r="2"/>
        <circle cx="0"  cy="6"  r="2"/>
        <circle cx="-6" cy="8"  r="1.5"/>
        <circle cx="6"  cy="8"  r="1.5"/>
      </g>
    </g>

    <!-- Sway after bloom -->
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;3;-3;0" keyTimes="0;0.33;0.66;1"
      begin="2.1s" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
