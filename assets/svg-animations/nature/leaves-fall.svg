<?xml version="1.0" encoding="UTF-8"?>
<!--
  Autumn leaves — six leaves drift down with rotation and sway. Loops.
  Viewport: 400 × 500.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <symbol id="leaf" viewBox="-12 -16 24 32">
      <path d="M 0 -16 Q 12 -8 12 0 Q 12 14 0 16 Q -12 14 -12 0 Q -12 -8 0 -16 Z"
            fill="currentColor" stroke="#7c2d12" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="0" y1="-12" x2="0" y2="14" stroke="#7c2d12" stroke-width="1"/>
    </symbol>
  </defs>

  <!-- Leaf 1 -->
  <g color="#dc2626">
    <use href="#leaf" x="60" y="-30" width="36" height="48">
      <animate attributeName="y" values="-30;490" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="60;90;50;60" dur="6s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Leaf 2 -->
  <g color="#f97316">
    <use href="#leaf" x="160" y="-50" width="40" height="52">
      <animate attributeName="y" values="-50;490" dur="7s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="160;130;180;160" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Leaf 3 -->
  <g color="#fbbf24">
    <use href="#leaf" x="260" y="-20" width="32" height="42">
      <animate attributeName="y" values="-20;490" dur="5.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="260;290;240;260" dur="5.5s" begin="1.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Leaf 4 -->
  <g color="#a16207">
    <use href="#leaf" x="320" y="-60" width="34" height="44">
      <animate attributeName="y" values="-60;490" dur="6.4s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="x" values="320;290;340;320" dur="6.4s" begin="2.0s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Leaf 5 -->
  <g color="#dc2626">
    <use href="#leaf" x="20" y="-80" width="28" height="36">
      <animate attributeName="y" values="-80;490" dur="5s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="20;50;10;20" dur="5s" begin="2.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Leaf 6 -->
  <g color="#f97316">
    <use href="#leaf" x="220" y="-100" width="38" height="50">
      <animate attributeName="y" values="-100;490" dur="6.8s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="220;250;200;220" dur="6.8s" begin="3.2s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
