<?xml version="1.0" encoding="UTF-8"?>
<!--
  Square loader — 4 squares pulse in a cycle around a center. Loops.
  Viewport: 160 × 160.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <g transform="translate(80 80)">
    <rect x="-50" y="-50" width="30" height="30" rx="6" fill="#4f46e5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0s"   repeatCount="indefinite"/>
    </rect>
    <rect x="20"  y="-50" width="30" height="30" rx="6" fill="#4f46e5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="20"  y="20"  width="30" height="30" rx="6" fill="#4f46e5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-50" y="20"  width="30" height="30" rx="6" fill="#4f46e5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
