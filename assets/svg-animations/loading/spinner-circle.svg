<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spinner — classic rotating arc
  Loops indefinitely. Drop-in for "loading" moments.
  Viewport: 120 × 120. Color via currentColor (set fill/stroke on parent).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g transform="translate(60 60)">
    <circle r="48" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <path d="M 48 0 A 48 48 0 0 1 -24 41.57" fill="none"
          stroke="#4f46e5" stroke-width="8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
