<?xml version="1.0" encoding="UTF-8"?>
<!--
  Skeleton placeholder with shimmer sweep. Loops.
  Viewport: 480 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#e2e8f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rows">
      <rect x="20"  y="20"  width="80"  height="80" rx="40"/>
      <rect x="120" y="30"  width="320" height="18" rx="9"/>
      <rect x="120" y="60"  width="240" height="18" rx="9"/>
      <rect x="120" y="90"  width="180" height="14" rx="7"/>
      <rect x="20"  y="130" width="440" height="14" rx="7"/>
      <rect x="20"  y="155" width="380" height="14" rx="7"/>
      <rect x="20"  y="180" width="200" height="14" rx="7"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rows)">
    <rect width="480" height="200" fill="#e2e8f0"/>
    <rect x="-200" y="0" width="200" height="200" fill="url(#shimmer)">
      <animate attributeName="x" from="-200" to="480" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
