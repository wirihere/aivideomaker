<?xml version="1.0" encoding="UTF-8"?>
<!--
  Add to cart — product box flies from left, lands in cart, cart badge increments,
  quick confetti burst above.
  Total: 2.4s. Holds.
  Viewport: 480 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Cart -->
  <g transform="translate(360 220)">
    <!-- Basket -->
    <path d="M -50 -30 L 60 -30 L 50 30 L -40 30 Z"
          fill="none" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Handle -->
    <path d="M -70 -60 L -50 -60 L -50 -30" fill="none" stroke="#0f172a" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wheels -->
    <circle cx="-30" cy="50" r="10" fill="#0f172a"/>
    <circle cx="40"  cy="50" r="10" fill="#0f172a"/>
    <!-- Badge with count -->
    <g transform="translate(58 -50)">
      <circle r="0" fill="#dc2626">
        <animate attributeName="r" from="0" to="18" begin="1.6s" dur="0.3s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800"
            fill="#ffffff" text-anchor="middle" dy="6" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.2s" fill="freeze"/>
        <animate attributeName="textContent" values="0;1" begin="1.9s" dur="0.1s" fill="freeze"/>
        0
      </text>
    </g>
  </g>

  <!-- Product box flies in -->
  <g transform="translate(-60 160)">
    <animateMotion path="M 0 0 Q 200 -120 360 60" begin="0s" dur="1.3s" fill="freeze"
                   keyTimes="0;1" keySplines="0.4 0 0.4 1" calcMode="spline"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      from="0" to="-360" begin="0s" dur="1.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;0.3 0.3" keyTimes="0;0.8;1"
      begin="0s" dur="1.3s" fill="freeze"/>
    <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#4f46e5" stroke="#0f172a" stroke-width="3"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800"
          fill="#ffffff" text-anchor="middle" dy="5">NEW</text>
  </g>

  <!-- Confetti burst above cart on arrival -->
  <g transform="translate(360 160)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="1.3s" dur="0.8s" fill="freeze"/>
    <g>
      <rect x="-4" y="-2" width="8" height="4" fill="#fbbf24">
        <animate attributeName="y" values="-2;-60" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
      <rect x="20" y="-2" width="8" height="4" fill="#ec4899">
        <animate attributeName="y" values="-2;-40" begin="1.3s" dur="0.8s" fill="freeze"/>
        <animate attributeName="x" values="20;40" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
      <rect x="-20" y="-2" width="8" height="4" fill="#06b6d4">
        <animate attributeName="y" values="-2;-40" begin="1.3s" dur="0.8s" fill="freeze"/>
        <animate attributeName="x" values="-20;-40" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
      <rect x="40" y="-2" width="8" height="4" fill="#22c55e">
        <animate attributeName="y" values="-2;-30" begin="1.3s" dur="0.8s" fill="freeze"/>
        <animate attributeName="x" values="40;70" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
      <rect x="-40" y="-2" width="8" height="4" fill="#a855f7">
        <animate attributeName="y" values="-2;-30" begin="1.3s" dur="0.8s" fill="freeze"/>
        <animate attributeName="x" values="-40;-70" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
