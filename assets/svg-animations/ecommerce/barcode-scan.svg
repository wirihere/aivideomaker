<?xml version="1.0" encoding="UTF-8"?>
<!--
  Barcode scan — red scanner line sweeps across a product barcode,
  tick appears and price label pops.
  Total: 2.8s. Holds.
  Viewport: 480 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <rect width="480" height="320" fill="#0f172a"/>

  <!-- Barcode container -->
  <g transform="translate(240 160)">
    <rect x="-180" y="-70" width="360" height="140" rx="10" fill="#ffffff"/>

    <!-- Bars -->
    <g fill="#0f172a">
      <rect x="-160" y="-50" width="4"  height="80"/>
      <rect x="-152" y="-50" width="2"  height="80"/>
      <rect x="-146" y="-50" width="6"  height="80"/>
      <rect x="-136" y="-50" width="3"  height="80"/>
      <rect x="-128" y="-50" width="8"  height="80"/>
      <rect x="-116" y="-50" width="2"  height="80"/>
      <rect x="-108" y="-50" width="5"  height="80"/>
      <rect x="-100" y="-50" width="2"  height="80"/>
      <rect x="-94"  y="-50" width="4"  height="80"/>
      <rect x="-86"  y="-50" width="7"  height="80"/>
      <rect x="-74"  y="-50" width="2"  height="80"/>
      <rect x="-66"  y="-50" width="5"  height="80"/>
      <rect x="-56"  y="-50" width="3"  height="80"/>
      <rect x="-48"  y="-50" width="6"  height="80"/>
      <rect x="-36"  y="-50" width="2"  height="80"/>
      <rect x="-28"  y="-50" width="4"  height="80"/>
      <rect x="-18"  y="-50" width="8"  height="80"/>
      <rect x="-4"   y="-50" width="3"  height="80"/>
      <rect x="4"    y="-50" width="5"  height="80"/>
      <rect x="14"   y="-50" width="2"  height="80"/>
      <rect x="22"   y="-50" width="7"  height="80"/>
      <rect x="34"   y="-50" width="3"  height="80"/>
      <rect x="42"   y="-50" width="5"  height="80"/>
      <rect x="52"   y="-50" width="2"  height="80"/>
      <rect x="58"   y="-50" width="8"  height="80"/>
      <rect x="72"   y="-50" width="4"  height="80"/>
      <rect x="82"   y="-50" width="2"  height="80"/>
      <rect x="90"   y="-50" width="6"  height="80"/>
      <rect x="102"  y="-50" width="3"  height="80"/>
      <rect x="110"  y="-50" width="7"  height="80"/>
      <rect x="122"  y="-50" width="2"  height="80"/>
      <rect x="130"  y="-50" width="5"  height="80"/>
      <rect x="140"  y="-50" width="8"  height="80"/>
      <rect x="154"  y="-50" width="3"  height="80"/>
    </g>
    <!-- Numbers -->
    <text y="62" font-family="'Courier New', monospace" font-size="14" font-weight="700"
          fill="#0f172a" text-anchor="middle" letter-spacing="4">4 890421 820314</text>
  </g>

  <!-- Scanner line -->
  <rect x="60" y="50" width="2" height="0" fill="#dc2626" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.15s" fill="freeze"/>
    <animate attributeName="height" from="0" to="220" begin="0.2s" dur="0.2s" fill="freeze"/>
  </rect>
  <!-- Scanner glow moving -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="60 0" to="420 0" begin="0.35s" dur="1.8s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <rect x="0" y="50" width="2" height="220" fill="#dc2626"/>
    <rect x="-14" y="50" width="32" height="220" fill="#dc2626" opacity="0.25"/>
  </g>

  <!-- Success tick -->
  <g transform="translate(240 40)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.5" to="1" begin="2.1s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <circle r="20" fill="#22c55e"/>
    <path d="M -10 0 L -2 8 L 10 -8" fill="none" stroke="#ffffff"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Price pop -->
  <g transform="translate(240 280)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0;1.2;1" keyTimes="0;0.6;1" begin="2.3s" dur="0.5s" fill="freeze"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800"
          fill="#fbbf24" text-anchor="middle" letter-spacing="2">$12.99</text>
  </g>
</svg>
