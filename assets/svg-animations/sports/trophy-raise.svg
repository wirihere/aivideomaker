<?xml version="1.0" encoding="UTF-8"?>
<!--
  Trophy raised — golden trophy rises with confetti rain, "WINNER" banner.
  Total: 3.6s. Holds.
  Viewport: 480 × 540.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <linearGradient id="trophy-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="trophy-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0"   stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow halo -->
  <circle cx="240" cy="240" r="0" fill="url(#trophy-glow)">
    <animate attributeName="r" from="0" to="240" begin="0.4s" dur="1.0s" fill="freeze"/>
  </circle>

  <!-- Trophy rises -->
  <g transform="translate(240 600)">
    <animateTransform attributeName="transform" type="translate"
      from="240 600" to="240 240" begin="0.3s" dur="0.7s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <!-- Cup -->
    <path d="M -60 -100
             Q -60 -50 -36 -10
             Q -20 30 0 30
             Q 20 30 36 -10
             Q 60 -50 60 -100
             Z"
          fill="url(#trophy-gold)" stroke="#7c2d12" stroke-width="4" stroke-linejoin="round"/>
    <!-- Handles -->
    <path d="M -60 -90 Q -100 -80 -100 -50 Q -100 -10 -64 -10"
          fill="none" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 -90 Q 100 -80 100 -50 Q 100 -10 64 -10"
          fill="none" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/>
    <!-- Top star -->
    <path d="M 0 -80 L 8 -64 L 24 -64 L 12 -54 L 16 -38 L 0 -48 L -16 -38 L -12 -54 L -24 -64 L -8 -64 Z"
          fill="#7c2d12"/>
    <!-- Stem -->
    <rect x="-12" y="30" width="24" height="50" fill="url(#trophy-gold)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Base -->
    <rect x="-60" y="80" width="120" height="20" rx="2" fill="url(#trophy-gold)" stroke="#7c2d12" stroke-width="3"/>
    <rect x="-70" y="100" width="140" height="14" rx="2" fill="#92400e" stroke="#7c2d12" stroke-width="3"/>

    <!-- Settle bounce -->
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1;1.06;1" keyTimes="0;0.6;0.75;1" begin="0.3s" dur="1s" fill="freeze"/>
  </g>

  <!-- Confetti rain (after trophy lands) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
    <g>
      <rect x="60"  y="-20" width="8" height="14" fill="#ec4899">
        <animate attributeName="y" values="-20;540" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
        <animate attributeName="x" values="60;80;60" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="140" y="-40" width="8" height="14" fill="#06b6d4">
        <animate attributeName="y" values="-40;540" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="240" y="-50" width="8" height="14" fill="#22c55e">
        <animate attributeName="y" values="-50;540" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="340" y="-30" width="8" height="14" fill="#fbbf24">
        <animate attributeName="y" values="-30;540" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="420" y="-50" width="8" height="14" fill="#a855f7">
        <animate attributeName="y" values="-50;540" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="20"  y="-60" width="8" height="14" fill="#ef4444">
        <animate attributeName="y" values="-60;540" dur="2.8s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="100" y="-30" width="8" height="14" fill="#f97316">
        <animate attributeName="y" values="-30;540" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="-50" width="8" height="14" fill="#06b6d4">
        <animate attributeName="y" values="-50;540" dur="2.6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="300" y="-20" width="8" height="14" fill="#ec4899">
        <animate attributeName="y" values="-20;540" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="400" y="-50" width="8" height="14" fill="#22c55e">
        <animate attributeName="y" values="-50;540" dur="2.4s" begin="1.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- WINNER banner -->
  <g transform="translate(240 460)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.5" to="1" begin="1.4s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <path d="M -120 -20 L 120 -20 L 140 0 L 120 20 L -120 20 L -140 0 Z"
          fill="#dc2626" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900"
          fill="#ffffff" text-anchor="middle" dy="8" letter-spacing="6">WINNER</text>
  </g>
</svg>
