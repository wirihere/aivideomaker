<?xml version="1.0" encoding="UTF-8"?>
<!--
  Medal podium — three podium blocks rise (silver, gold, bronze) with stagger,
  medals drop on top, gold sparkles, "1ST PLACE" badge appears.
  Total: 3.6s. Holds.
  Viewport: 600 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <!-- Floor -->
  <line x1="20" y1="440" x2="580" y2="440" stroke="#0f172a" stroke-width="3"/>

  <!-- Podium blocks (rise from below) -->
  <g>
    <!-- Silver (left, 2nd) -->
    <g transform="translate(150 440)">
      <animateTransform attributeName="transform" type="translate"
        from="150 540" to="150 440" begin="0.4s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      <rect x="-80" y="-100" width="160" height="100" fill="#cbd5e1" stroke="#0f172a" stroke-width="3"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="900"
            fill="#0f172a" text-anchor="middle" dy="-50">2</text>
    </g>
    <!-- Gold (center, 1st, taller) -->
    <g transform="translate(300 440)">
      <animateTransform attributeName="transform" type="translate"
        from="300 600" to="300 440" begin="0.7s" dur="0.6s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      <rect x="-80" y="-160" width="160" height="160" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900"
            fill="#0f172a" text-anchor="middle" dy="-90">1</text>
    </g>
    <!-- Bronze (right, 3rd, shortest) -->
    <g transform="translate(450 440)">
      <animateTransform attributeName="transform" type="translate"
        from="450 520" to="450 440" begin="0.55s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      <rect x="-80" y="-80" width="160" height="80" fill="#d97706" stroke="#0f172a" stroke-width="3"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="900"
            fill="#0f172a" text-anchor="middle" dy="-40">3</text>
    </g>
  </g>

  <!-- Medals drop -->
  <g>
    <!-- Silver medal -->
    <g transform="translate(150 -40)">
      <animateTransform attributeName="transform" type="translate"
        from="150 -40" to="150 240" begin="1.4s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <circle r="32" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
            fill="#475569" text-anchor="middle" dy="6">★</text>
      <path d="M -8 -36 L 8 -36 L 0 -54 Z" fill="#1e3a8a"/>
    </g>
    <!-- Gold medal -->
    <g transform="translate(300 -60)">
      <animateTransform attributeName="transform" type="translate"
        from="300 -60" to="300 220" begin="1.7s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <circle r="40" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
      <circle r="32" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800"
            fill="#92400e" text-anchor="middle" dy="8">★</text>
      <path d="M -8 -44 L 8 -44 L 0 -64 Z" fill="#dc2626"/>
    </g>
    <!-- Bronze medal -->
    <g transform="translate(450 -40)">
      <animateTransform attributeName="transform" type="translate"
        from="450 -40" to="450 280" begin="1.55s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <circle r="28" fill="#fed7aa" stroke="#7c2d12" stroke-width="3"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800"
            fill="#7c2d12" text-anchor="middle" dy="6">★</text>
      <path d="M -8 -32 L 8 -32 L 0 -50 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- Sparkle on gold -->
  <g transform="translate(300 220)" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" begin="2.4s" dur="1.4s" fill="freeze"/>
    <circle r="3"/>
    <circle cx="-30" cy="-20" r="2"/>
    <circle cx="32"  cy="-15" r="2.5"/>
    <circle cx="20"  cy="20"  r="2"/>
  </g>

  <!-- 1ST PLACE badge -->
  <g transform="translate(300 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0.5;1.2;1" keyTimes="0;0.6;1" begin="2.8s" dur="0.5s" fill="freeze"/>
    <rect x="-86" y="-22" width="172" height="44" rx="22" fill="#0f172a"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900"
          fill="#fbbf24" text-anchor="middle" dy="6" letter-spacing="3">1ST PLACE</text>
  </g>
</svg>
