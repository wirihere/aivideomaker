<?xml version="1.0" encoding="UTF-8"?>
<!--
  Toast notification — slides in from the right, settles, then progress bar drains.
  Total: 4.0s. Holds.
  Viewport: 480 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <g transform="translate(480 50)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="480 50" to="40 50" begin="0s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <!-- Card -->
    <rect x="0" y="0" width="420" height="100" rx="12" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#10b981"/>

    <!-- Check icon -->
    <g transform="translate(40 50)">
      <circle r="18" fill="#10b981"/>
      <path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#ffffff"
            stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text -->
    <text x="76" y="40" font-family="Inter, system-ui, sans-serif"
          font-size="16" font-weight="700" fill="#0f172a">Saved successfully</text>
    <text x="76" y="64" font-family="Inter, system-ui, sans-serif"
          font-size="13" fill="#64748b">Your changes are live</text>

    <!-- Close X -->
    <g transform="translate(390 24)" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="6" y1="-6" x2="-6" y2="6"/>
    </g>

    <!-- Progress bar drain (auto-dismiss visual) -->
    <rect x="0" y="96" width="420" height="4" rx="2" fill="#10b981" opacity="0.3">
      <animate attributeName="width" from="420" to="0"
               begin="0.8s" dur="3.0s" fill="freeze"/>
    </rect>
  </g>
</svg>
