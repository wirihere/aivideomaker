<?xml version="1.0" encoding="UTF-8"?>
<!--
  Notification badge — pops in with overshoot, then a small pulse.
  Total: 1.4s. Holds.
  Viewport: 120 × 120.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g transform="translate(60 60)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        from="0" to="1" begin="0s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.78 0.64 1"/>
      <circle r="42" fill="#ef4444"/>
      <text y="14" font-family="Inter, system-ui, sans-serif"
            font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">9</text>
    </g>
    <!-- Pulse rings on arrival -->
    <circle r="42" fill="none" stroke="#ef4444" stroke-width="3" opacity="0">
      <animate attributeName="r" from="42" to="64" begin="0.6s" dur="0.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.6;0" begin="0.6s" dur="0.7s" fill="freeze"/>
    </circle>
  </g>
</svg>
