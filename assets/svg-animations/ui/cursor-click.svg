<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cursor click — arrow cursor moves to button, presses, ripple expands.
  Total: 2.0s. Holds.
  Viewport: 480 × 280.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <!-- Button -->
  <g transform="translate(240 140)">
    <rect x="-90" y="-28" width="180" height="56" rx="28" fill="#4f46e5">
      <animate attributeName="fill" values="#4f46e5;#3730a3;#4f46e5" keyTimes="0;0.5;1" begin="1.0s" dur="0.4s" fill="freeze"/>
    </rect>
    <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700"
          fill="#ffffff" text-anchor="middle" dy="6">CLICK ME</text>
    <!-- Ripple -->
    <circle r="0" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.6">
      <animate attributeName="r" from="0" to="120" begin="1.05s" dur="0.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0.6;0" begin="1.05s" dur="0.7s" fill="freeze"/>
    </circle>
  </g>

  <!-- Cursor -->
  <g transform="translate(60 60)">
    <animateTransform attributeName="transform" type="translate"
      from="60 60" to="248 144" begin="0s" dur="0.9s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <!-- Click squish -->
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1;0.85;1" keyTimes="0;0.5;0.6;0.7" begin="0.95s" dur="0.4s" fill="freeze"/>

    <path d="M 0 0 L 0 22 L 6 17 L 11 26 L 14 24 L 9 15 L 16 14 Z"
          fill="#0f172a" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
