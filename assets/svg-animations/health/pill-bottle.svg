<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pill bottle — bottle tilts, cap pops off, three pills tumble out, dosage label appears.
  Total: 3.4s. Holds.
  Viewport: 400 × 400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Bottle -->
  <g transform="translate(160 200)">
    <animateTransform attributeName="transform" type="rotate"
      values="0;0;-40;-40;0"
      keyTimes="0;0.2;0.4;0.75;1"
      begin="0s" dur="3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="160 200;160 200;200 200;200 200;160 200"
      keyTimes="0;0.2;0.4;0.75;1"
      begin="0s" dur="3s" fill="freeze"/>

    <rect x="-50" y="-60" width="100" height="140" rx="6" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="-50" y="-20" width="100" height="70" fill="#ffffff"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d"
          text-anchor="middle" dy="8">Rx</text>
    <text y="28" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#7f1d1d"
          text-anchor="middle" letter-spacing="2">500 MG</text>
  </g>

  <!-- Cap (pops off) -->
  <g transform="translate(160 140)">
    <animateTransform attributeName="transform" type="translate"
      values="160 140;160 140;130 80;130 80;160 140"
      keyTimes="0;0.2;0.4;0.75;1"
      begin="0s" dur="3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;0;-20;30;0" keyTimes="0;0.2;0.4;0.75;1" begin="0s" dur="3s" fill="freeze"/>
    <rect x="-56" y="-12" width="112" height="24" rx="4" fill="#7f1d1d"/>
  </g>

  <!-- Pills tumble out -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.2s" fill="freeze"/>
      <ellipse cx="260" cy="160" rx="18" ry="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <line x1="260" y1="160" x2="260" y2="160" stroke="#0f172a" stroke-width="2"/>
      <path d="M 242 160 L 278 160" stroke="#0f172a" stroke-width="1.5"/>
      <ellipse cx="260" cy="160" rx="18" ry="10" fill="#4f46e5" clip-path="inset(0 50% 0 0)"/>
      <animateMotion path="M 0 0 Q 30 -30 60 80 Q 40 140 -20 160" begin="1.3s" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="540" begin="1.3s" dur="1.2s" fill="freeze"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.2s" fill="freeze"/>
      <ellipse cx="260" cy="160" rx="16" ry="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <path d="M 244 160 L 276 160" stroke="#0f172a" stroke-width="1.5"/>
      <ellipse cx="260" cy="160" rx="16" ry="9" fill="#06b6d4" clip-path="inset(0 0 0 50%)"/>
      <animateMotion path="M 0 0 Q 10 -20 20 90 Q -20 120 -60 160" begin="1.5s" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="-720" begin="1.5s" dur="1.2s" fill="freeze"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.2s" fill="freeze"/>
      <ellipse cx="260" cy="160" rx="14" ry="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <path d="M 246 160 L 274 160" stroke="#0f172a" stroke-width="1.5"/>
      <ellipse cx="260" cy="160" rx="14" ry="8" fill="#ec4899" clip-path="inset(0 50% 0 0)"/>
      <animateMotion path="M 0 0 Q -20 -40 -40 70 Q -30 120 20 160" begin="1.7s" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="360" begin="1.7s" dur="1.2s" fill="freeze"/>
    </g>
  </g>

  <!-- Dosage card -->
  <g transform="translate(200 360)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="200 380" to="200 360" begin="2.8s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#0f172a"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700"
          fill="#ffffff" text-anchor="middle" dy="5" letter-spacing="2">2 · DAILY WITH FOOD</text>
  </g>
</svg>
