<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sun with rays — sun rises from below, then rays radiate and breathe.
  Total: ~loops after 1.2s entrance.
  Viewport: 320 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <g transform="translate(160 320)">
    <animateTransform attributeName="transform" type="translate"
      from="160 320" to="160 160" begin="0s" dur="1.0s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <!-- Rotating rays -->
    <g stroke="#fbbf24" stroke-width="8" stroke-linecap="round">
      <g>
        <line x1="0" y1="-100" x2="0" y2="-130"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(30)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(60)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(90)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(120)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(150)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(180)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(210)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(240)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(270)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(300)"/>
        <line x1="0" y1="-100" x2="0" y2="-130" transform="rotate(330)"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" begin="1.0s" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Sun disc -->
    <circle r="70" fill="#facc15">
      <animate attributeName="r" values="70;74;70" begin="1.0s" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>
</svg>
