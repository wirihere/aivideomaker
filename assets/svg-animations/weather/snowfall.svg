<?xml version="1.0" encoding="UTF-8"?>
<!--
  Snowfall — 18 snowflakes of varying sizes drift down at different speeds,
  with gentle horizontal sway. Loops indefinitely.
  Viewport: 400 × 500.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <symbol id="flake" viewBox="-10 -10 20 20">
      <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="-8" x2="0" y2="8"/>
        <line x1="-8" y1="0" x2="8" y2="0"/>
        <line x1="-6" y1="-6" x2="6" y2="6"/>
        <line x1="6" y1="-6" x2="-6" y2="6"/>
      </g>
    </symbol>
  </defs>

  <!-- Night sky backdrop -->
  <rect width="400" height="500" fill="#0f172a"/>

  <!-- Flakes: each has cy cycling + cx swaying -->
  <g>
    <use href="#flake" x="50"  y="-10" width="16" height="16">
      <animate attributeName="y"  values="-10;490" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="50;60;50" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="120" y="-20" width="10" height="10">
      <animate attributeName="y"  values="-20;490" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="120;110;120" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="200" y="-30" width="20" height="20">
      <animate attributeName="y"  values="-30;490" dur="8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="200;210;200" dur="8s" begin="1s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="260" y="-10" width="14" height="14">
      <animate attributeName="y"  values="-10;490" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="260;250;260" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="330" y="-20" width="12" height="12">
      <animate attributeName="y"  values="-20;490" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="330;340;330" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="80"  y="-40" width="18" height="18">
      <animate attributeName="y"  values="-40;490" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="80;70;80" dur="9s" begin="2s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="160" y="-50" width="11" height="11">
      <animate attributeName="y"  values="-50;490" dur="6s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="160;168;160" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="300" y="-60" width="15" height="15">
      <animate attributeName="y"  values="-60;490" dur="7.5s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="300;294;300" dur="7.5s" begin="1.8s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="220" y="-30" width="9" height="9">
      <animate attributeName="y"  values="-30;490" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="220;228;220" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="20"  y="-30" width="13" height="13">
      <animate attributeName="y"  values="-30;490" dur="6.8s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="20;28;20" dur="6.8s" begin="2.5s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="370" y="-30" width="14" height="14">
      <animate attributeName="y"  values="-30;490" dur="6.3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="370;362;370" dur="6.3s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="140" y="-20" width="17" height="17">
      <animate attributeName="y"  values="-20;490" dur="7.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="x"  values="140;132;140" dur="7.6s" begin="3s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
