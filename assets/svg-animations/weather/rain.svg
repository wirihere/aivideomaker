<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rain — cloud above, 10 drops falling in staggered loops.
  Loops indefinitely.
  Viewport: 400 × 400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Cloud -->
  <g fill="#94a3b8">
    <circle cx="140" cy="100" r="28"/>
    <circle cx="180" cy="80" r="36"/>
    <circle cx="226" cy="96" r="30"/>
    <rect x="140" y="100" width="92" height="30" rx="15"/>
  </g>

  <!-- Drops (animated via cy cycling and opacity) -->
  <g fill="#3b82f6">
    <g><ellipse cx="150" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="170" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="190" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="210" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.1s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.1s" begin="0.1s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="230" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="160" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="200" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.0s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.0s" begin="0.8s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><ellipse cx="220" cy="150" rx="3" ry="8">
      <animate attributeName="cy" values="150;340" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
    </ellipse></g>
  </g>
</svg>
