<?xml version="1.0" encoding="UTF-8"?>
<!--
  Subscribe + bell — YouTube-style CTA: subscribe button slams in, fills red,
  bell rings, "thanks!" badge pops.
  Total: 4.0s. Holds.
  Viewport: 720 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <!-- Subscribe button -->
  <g transform="translate(360 180)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.4;1.2;0.95;1" keyTimes="0;0.5;0.75;1" begin="0s" dur="0.6s" fill="freeze"/>
      <rect x="-180" y="-44" width="360" height="88" rx="44" fill="#0f172a">
        <animate attributeName="fill" from="#0f172a" to="#dc2626" begin="1.0s" dur="0.4s" fill="freeze"/>
      </rect>
      <text font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="900"
            fill="#ffffff" text-anchor="middle" dy="12" letter-spacing="3">SUBSCRIBE</text>
    </g>
  </g>

  <!-- Cursor flies in to click -->
  <g transform="translate(640 80)">
    <animateTransform attributeName="transform" type="translate"
      from="640 80" to="380 200" begin="0.7s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1;0.85;1" keyTimes="0;0.5;0.6;0.7" begin="1.05s" dur="0.4s" fill="freeze"/>
    <path d="M 0 0 L 0 30 L 8 22 L 14 36 L 18 34 L 12 20 L 22 18 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Click ripple on button -->
  <circle cx="380" cy="200" r="0" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7">
    <animate attributeName="r" from="0" to="160" begin="1.2s" dur="0.7s" fill="freeze"/>
    <animate attributeName="opacity" values="0.7;0" begin="1.2s" dur="0.7s" fill="freeze"/>
  </circle>

  <!-- Bell appears next to button (right side) -->
  <g transform="translate(620 180)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0.5;1.2;1" keyTimes="0;0.6;1" begin="2.0s" dur="0.5s" fill="freeze"/>

    <!-- Bell with swing pivot at top -->
    <g transform-origin="0 -28">
      <animateTransform attributeName="transform" type="rotate"
        values="0;-22;22;-15;15;-8;8;0"
        keyTimes="0;0.14;0.28;0.42;0.57;0.71;0.85;1"
        begin="2.6s" dur="1.0s" fill="freeze"/>
      <path d="M -22 16 Q -22 -18 0 -28 Q 22 -18 22 16 L 28 22 L -28 22 Z"
            fill="#fbbf24" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
      <circle cy="-28" r="4" fill="#0f172a"/>
      <ellipse cy="28" rx="6" ry="3" fill="#0f172a"/>
    </g>
  </g>

  <!-- Thanks bubble -->
  <g transform="translate(360 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="360 100" to="360 80" begin="3.4s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <path d="M -90 -22 Q -90 -42 -70 -42 L 70 -42 Q 90 -42 90 -22 L 90 22 Q 90 42 70 42 L 14 42 L 0 60 L -10 42 L -70 42 Q -90 42 -90 22 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800"
          fill="#0f172a" text-anchor="middle" dy="6">Thanks! 🎉</text>
  </g>
</svg>
