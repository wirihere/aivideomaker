<?xml version="1.0" encoding="UTF-8"?>
<!--
  Testimonial card — quote marks, body text reveals line by line, 5-star rating
  fills, name + title + avatar slides in.
  Total: 4.6s. Holds.
  Viewport: 1280 × 720.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <symbol id="star" viewBox="-30 -30 60 60">
      <path d="M 0 -28 L 8 -8 L 28 -8 L 12 4 L 18 26 L 0 14 L -18 26 L -12 4 L -28 -8 L -8 -8 Z"/>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Card -->
  <g transform="translate(140 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="140 100" to="140 80" begin="0s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <rect width="1000" height="560" rx="20" fill="url(#card-bg)"/>

    <!-- Big quote mark -->
    <text x="80" y="180" font-family="Georgia, serif" font-size="160"
          font-weight="700" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.6;1.1;1" keyTimes="0;0.6;1" begin="0.6s" dur="0.6s" fill="freeze"/>
      “
    </text>

    <!-- Quote body -->
    <g font-family="Inter, system-ui, sans-serif" fill="#f8fafc">
      <text x="180" y="180" font-size="32" font-weight="600" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate"
          from="0 12" to="0 0" begin="1.1s" dur="0.5s" fill="freeze"
          calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
        It changed how my whole team
      </text>
      <text x="180" y="232" font-size="32" font-weight="600" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate"
          from="0 12" to="0 0" begin="1.4s" dur="0.5s" fill="freeze"
          calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
        thinks about the problem.
      </text>
      <text x="180" y="284" font-size="32" font-weight="600" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate"
          from="0 12" to="0 0" begin="1.7s" dur="0.5s" fill="freeze"
          calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
        We're shipping again.
      </text>
    </g>

    <!-- Stars -->
    <g transform="translate(180 360)" fill="#fbbf24">
      <use href="#star" x="0"   y="0" width="38" height="38" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.4;1.2;1" keyTimes="0;0.6;1" begin="2.2s" dur="0.4s" fill="freeze"/>
      </use>
      <use href="#star" x="46"  y="0" width="38" height="38" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.4;1.2;1" keyTimes="0;0.6;1" begin="2.3s" dur="0.4s" fill="freeze"/>
      </use>
      <use href="#star" x="92"  y="0" width="38" height="38" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.4;1.2;1" keyTimes="0;0.6;1" begin="2.4s" dur="0.4s" fill="freeze"/>
      </use>
      <use href="#star" x="138" y="0" width="38" height="38" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.4;1.2;1" keyTimes="0;0.6;1" begin="2.5s" dur="0.4s" fill="freeze"/>
      </use>
      <use href="#star" x="184" y="0" width="38" height="38" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.4;1.4;1.1;1.2;1" keyTimes="0;0.4;0.6;0.8;1" begin="2.6s" dur="0.7s" fill="freeze"/>
      </use>
    </g>

    <!-- Author block -->
    <g transform="translate(180 460)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="180 480" to="180 460" begin="3.0s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

      <circle cx="32" cy="32" r="32" fill="url(#avatar-grad)"/>
      <text x="32" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
            fill="#ffffff" text-anchor="middle">M</text>

      <text x="80" y="28" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
            fill="#ffffff">Maya Lim</text>
      <text x="80" y="50" font-family="Inter, system-ui, sans-serif" font-size="14"
            fill="#94a3b8">Director of Engineering · Mercury</text>
    </g>

    <!-- Logo bottom-right of card -->
    <g transform="translate(880 480)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700"
            fill="#475569" letter-spacing="3" text-anchor="end">MERCURY</text>
      <line x1="-100" y1="14" x2="0" y2="14" stroke="#475569" stroke-width="2"/>
    </g>
  </g>
</svg>
