<?xml version="1.0" encoding="UTF-8"?>
<!--
  Map zoom + pin — world map fades, then a Mercator-grid view zooms toward
  a target pin that drops in over a city, info card slides up.
  Total: 5.0s. Holds.
  Viewport: 1280 × 720.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="zoom-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#ocean)"/>

  <!-- Lat/long grid (zooms toward pin) -->
  <g>
    <animateTransform attributeName="transform" type="scale"
      from="1" to="3.4" begin="0s" dur="3.0s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      from="0 0" to="-1500 -800" begin="0s" dur="3.0s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>

    <g stroke="#1e3a8a" stroke-width="1" opacity="0.6">
      <!-- Latitudes -->
      <line x1="0"    y1="80"  x2="1280" y2="80"/>
      <line x1="0"    y1="160" x2="1280" y2="160"/>
      <line x1="0"    y1="240" x2="1280" y2="240"/>
      <line x1="0"    y1="320" x2="1280" y2="320"/>
      <line x1="0"    y1="400" x2="1280" y2="400"/>
      <line x1="0"    y1="480" x2="1280" y2="480"/>
      <line x1="0"    y1="560" x2="1280" y2="560"/>
      <line x1="0"    y1="640" x2="1280" y2="640"/>
      <!-- Longitudes -->
      <line x1="80"   y1="0" x2="80"   y2="720"/>
      <line x1="160"  y1="0" x2="160"  y2="720"/>
      <line x1="240"  y1="0" x2="240"  y2="720"/>
      <line x1="320"  y1="0" x2="320"  y2="720"/>
      <line x1="400"  y1="0" x2="400"  y2="720"/>
      <line x1="480"  y1="0" x2="480"  y2="720"/>
      <line x1="560"  y1="0" x2="560"  y2="720"/>
      <line x1="640"  y1="0" x2="640"  y2="720"/>
      <line x1="720"  y1="0" x2="720"  y2="720"/>
      <line x1="800"  y1="0" x2="800"  y2="720"/>
      <line x1="880"  y1="0" x2="880"  y2="720"/>
      <line x1="960"  y1="0" x2="960"  y2="720"/>
      <line x1="1040" y1="0" x2="1040" y2="720"/>
      <line x1="1120" y1="0" x2="1120" y2="720"/>
      <line x1="1200" y1="0" x2="1200" y2="720"/>
    </g>

    <!-- Continent silhouettes -->
    <g fill="#0d3a4d" opacity="0.85">
      <!-- N America -->
      <path d="M 100 200 Q 130 160 200 180 Q 280 200 320 280 Q 280 320 240 320 Q 180 340 140 320 Q 100 280 100 200 Z"/>
      <!-- S America -->
      <path d="M 280 380 Q 320 380 340 440 Q 320 520 280 540 Q 240 520 240 460 Q 240 400 280 380 Z"/>
      <!-- Europe -->
      <path d="M 580 200 Q 620 180 660 200 Q 680 240 660 260 Q 620 270 580 240 Q 560 220 580 200 Z"/>
      <!-- Africa -->
      <path d="M 600 280 Q 660 280 700 340 Q 720 420 680 480 Q 620 500 600 440 Q 580 360 600 280 Z"/>
      <!-- Asia -->
      <path d="M 700 200 Q 800 180 940 200 Q 1000 220 1020 280 Q 980 340 900 340 Q 800 320 720 300 Q 680 260 700 200 Z"/>
      <!-- Australia -->
      <path d="M 980 460 Q 1040 460 1080 480 Q 1080 520 1040 530 Q 980 530 960 510 Q 960 480 980 460 Z"/>
    </g>

    <!-- Target city dot -->
    <circle cx="640" cy="280" r="4" fill="#f59e0b"/>
  </g>

  <!-- Glow ring at target -->
  <circle cx="640" cy="360" r="0" fill="url(#zoom-glow)">
    <animate attributeName="r" from="0" to="240" begin="3.0s" dur="0.6s" fill="freeze"/>
  </circle>

  <!-- Pin drop on target -->
  <g transform="translate(640 -100)">
    <animateTransform attributeName="transform" type="translate"
      from="640 -100" to="640 280" begin="3.2s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1.2 0.8;0.85 1.15;1 1"
      keyTimes="0;0.55;0.7;1"
      begin="3.2s" dur="0.85s" fill="freeze"/>

    <path d="M 0 80
             C -50 50, -50 -10, 0 -50
             C 50 -10, 50 50, 0 80 Z"
          fill="#ef4444" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="-15" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="0" y="-10" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="900"
          fill="#0f172a" text-anchor="middle">★</text>
  </g>

  <!-- Radar pulse from pin base -->
  <g transform="translate(640 360)" fill="none" stroke="#ef4444" stroke-width="3">
    <ellipse rx="0" ry="0">
      <animate attributeName="rx" from="0" to="80" begin="3.9s" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" from="0" to="20" begin="3.9s" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" begin="3.9s" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Info card slides up from bottom -->
  <g transform="translate(640 720)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="640 720" to="640 540" begin="4.0s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <rect x="-200" y="0" width="400" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="-180" y="36" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700"
          fill="#64748b" letter-spacing="2">DESTINATION</text>
    <text x="-180" y="70" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800"
          fill="#0f172a">Tbilisi, Georgia</text>
    <text x="-180" y="98" font-family="Inter, system-ui, sans-serif" font-size="13"
          fill="#64748b">41.7151° N · 44.8271° E</text>
    <g transform="translate(140 60)">
      <circle r="22" fill="#ef4444"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
            fill="#ffffff" text-anchor="middle" dy="7">→</text>
    </g>
  </g>
</svg>
