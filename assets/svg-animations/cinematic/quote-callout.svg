<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cinematic quote callout — large opening quote draws, body fades in line by line,
  byline + accent rule, gold sparkle on the quote mark.
  Total: 4.0s. Holds.
  Viewport: 1280 × 720.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bg-grad" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0"   stop-color="#1e293b"/>
      <stop offset="1"   stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Top frame line draws -->
  <line x1="640" y1="120" x2="640" y2="120" stroke="url(#gold)" stroke-width="3">
    <animate attributeName="x1" from="640" to="160" begin="0s" dur="0.6s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" from="640" to="1120" begin="0s" dur="0.6s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>
  <!-- Bottom frame line -->
  <line x1="640" y1="600" x2="640" y2="600" stroke="url(#gold)" stroke-width="3">
    <animate attributeName="x1" from="640" to="160" begin="0.1s" dur="0.6s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" from="640" to="1120" begin="0.1s" dur="0.6s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Big opening quote mark drawn with stroke-dashoffset -->
  <text x="200" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="220"
        font-weight="700" fill="url(#gold)" stroke="#92400e" stroke-width="2">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale"
      values="0;1.2;1" keyTimes="0;0.6;1" begin="0.8s" dur="0.7s" fill="freeze"/>
    “
  </text>

  <!-- Sparkle on quote -->
  <g transform="translate(290 220)" fill="#fde68a" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="1.4s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0.4;1.2;0" keyTimes="0;0.5;1" begin="1.4s" dur="0.6s" fill="freeze"/>
    <path d="M 0 -16 C 2 -4 4 -2 16 0 C 4 2 2 4 0 16 C -2 4 -4 2 -16 0 C -4 -2 -2 -4 0 -16 Z"/>
  </g>

  <!-- Quote body, line by line -->
  <g font-family="Georgia, serif" fill="#f8fafc" font-style="italic">
    <text x="320" y="290" font-size="44" font-weight="500" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 14" to="0 0" begin="1.5s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      The future is already here —
    </text>
    <text x="320" y="354" font-size="44" font-weight="500" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 14" to="0 0" begin="1.85s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      it's just not very evenly
    </text>
    <text x="320" y="418" font-size="44" font-weight="500" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 14" to="0 0" begin="2.2s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      distributed.
    </text>
  </g>

  <!-- Byline -->
  <g transform="translate(320 510)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gold)" stroke-width="2"/>
    <text x="78" y="6" font-family="Inter, system-ui, sans-serif" font-size="18"
          font-weight="700" fill="#fbbf24" letter-spacing="3">WILLIAM GIBSON</text>
  </g>
</svg>
