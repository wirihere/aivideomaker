<?xml version="1.0" encoding="UTF-8"?>
<!--
  Neon sign OPEN — tubes draw, then flicker, glow pulses, arrow points.
  Total: 4.0s. Holds with looping flicker.
  Viewport: 720 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Brick wall background -->
  <rect width="720" height="480" fill="#1c1917"/>
  <g stroke="#292524" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80"  x2="720" y2="80"/>
    <line x1="0" y1="160" x2="720" y2="160"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="320" x2="720" y2="320"/>
    <line x1="0" y1="400" x2="720" y2="400"/>
    <line x1="80"  y1="0" x2="80"  y2="80"/>
    <line x1="240" y1="0" x2="240" y2="80"/>
    <line x1="400" y1="0" x2="400" y2="80"/>
    <line x1="560" y1="0" x2="560" y2="80"/>
    <line x1="160" y1="80" x2="160" y2="160"/>
    <line x1="320" y1="80" x2="320" y2="160"/>
    <line x1="480" y1="80" x2="480" y2="160"/>
    <line x1="640" y1="80" x2="640" y2="160"/>
  </g>

  <!-- Neon OPEN text (duplicate layers for glow effect) -->
  <g>
    <!-- Glow layer (thick, blurred) -->
    <g filter="url(#glow-pink)" stroke="#ec4899" stroke-width="14" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0.3;0.9;0.9" keyTimes="0;0.3;0.55;0.6;0.7;1"
               begin="0s" dur="2.5s" fill="freeze"/>
      <!-- O -->
      <ellipse cx="220" cy="220" rx="50" ry="60"/>
      <!-- P -->
      <path d="M 300 260 L 300 160 L 350 160 A 30 30 0 0 1 350 220 L 300 220"/>
      <!-- E -->
      <path d="M 420 160 L 380 160 L 380 260 L 420 260 M 380 210 L 410 210"/>
      <!-- N -->
      <path d="M 440 260 L 440 160 L 490 260 L 490 160"/>
    </g>

    <!-- Crisp inner stroke -->
    <g stroke="#fbcfe8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0.4;1;1" keyTimes="0;0.3;0.55;0.6;0.7;1"
               begin="0s" dur="2.5s" fill="freeze"/>
      <ellipse cx="220" cy="220" rx="50" ry="60"/>
      <path d="M 300 260 L 300 160 L 350 160 A 30 30 0 0 1 350 220 L 300 220"/>
      <path d="M 420 160 L 380 160 L 380 260 L 420 260 M 380 210 L 410 210"/>
      <path d="M 440 260 L 440 160 L 490 260 L 490 160"/>
    </g>
  </g>

  <!-- Arrow (cyan) below — flashes in -->
  <g transform="translate(350 340)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.05;0.4;0.7;1"
             begin="2.0s" dur="2.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.4;1" keyTimes="0;0.5;1"
             begin="2.6s" dur="0.3s" fill="freeze"/>

    <g filter="url(#glow-cyan)" stroke="#06b6d4" stroke-width="12" fill="none" stroke-linecap="round">
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <path d="M 40 -32 L 80 0 L 40 32"/>
    </g>
    <g stroke="#a5f3fc" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <path d="M 40 -32 L 80 0 L 40 32"/>
    </g>
  </g>

  <!-- Continuous faint flicker on OPEN after final -->
  <g stroke="#fbcfe8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;1;0.9;1;0.85;1" keyTimes="0;0.1;0.4;0.5;0.7;1"
             begin="2.5s" dur="2s" repeatCount="indefinite"/>
    <ellipse cx="220" cy="220" rx="50" ry="60"/>
    <path d="M 300 260 L 300 160 L 350 160 A 30 30 0 0 1 350 220 L 300 220"/>
    <path d="M 420 160 L 380 160 L 380 260 L 420 260 M 380 210 L 410 210"/>
    <path d="M 440 260 L 440 160 L 490 260 L 490 160"/>
  </g>
</svg>
