<?xml version="1.0" encoding="UTF-8"?>
<!--
  City skyline at twilight — sky gradient, sun sets behind buildings, building windows
  light up in waves, plane flies past, moon rises with stars twinkling in.
  Total: 6.0s. Holds.
  Viewport: 960 × 540.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0c1845"/>
      <stop offset="0.5" stop-color="#7e22ce"/>
      <stop offset="0.85" stop-color="#f97316"/>
      <stop offset="1"   stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#020617"/>
      <stop offset="0.7" stop-color="#1e1b4b"/>
      <stop offset="1"   stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Day sky (fades out) -->
  <rect width="960" height="540" fill="url(#sky-grad)"/>
  <!-- Night sky (fades in) -->
  <rect width="960" height="540" fill="url(#sky-night)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="2.5s" fill="freeze"/>
  </rect>

  <!-- Sun setting -->
  <circle cx="700" cy="200" r="60" fill="#fbbf24">
    <animate attributeName="cy" from="200" to="500" begin="0s" dur="3s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="r"  from="60"  to="80"  begin="0s" dur="3s" fill="freeze"/>
    <animate attributeName="fill" from="#fbbf24" to="#ea580c" begin="0s" dur="3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.4s" dur="0.8s" fill="freeze"/>
  </circle>

  <!-- Stars (appear after sunset) -->
  <g fill="#ffffff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="1s" fill="freeze"/>
    <circle cx="80"  cy="60"  r="1.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="120" r="1"  ><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="40"  r="1.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="100" r="1"  ><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="80"  r="1.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="40"  r="1"  ><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="80"  r="1.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60"  r="1"  ><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon rises -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.8s" fill="freeze"/>
    <circle cx="180" cy="600" r="40" fill="#fef3c7">
      <animate attributeName="cy" from="600" to="120" begin="3.0s" dur="2s" fill="freeze"
               calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </circle>
    <circle cx="160" cy="600" r="6" fill="#cbd5e1" opacity="0.5">
      <animate attributeName="cy" from="600" to="120" begin="3.0s" dur="2s" fill="freeze"
               calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </circle>
  </g>

  <!-- Plane flies past -->
  <g transform="translate(-60 200)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1"
             begin="3.5s" dur="2.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-60 200" to="1020 160" begin="3.5s" dur="2.0s" fill="freeze"/>
    <path d="M 0 0 L 30 -3 L 36 0 L 30 3 Z" fill="#cbd5e1"/>
    <line x1="20" y1="-1" x2="36" y2="-12" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="20" y1="1"  x2="36" y2="12"  stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Blinking light -->
    <circle cx="34" cy="0" r="1.5" fill="#dc2626">
      <animate attributeName="opacity" values="0;1;0" dur="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Buildings -->
  <g>
    <!-- Back row (silhouette) -->
    <path d="M 0 540
             L 0 360 L 60 360 L 60 320 L 100 320 L 100 380
             L 140 380 L 140 280 L 200 280 L 200 340
             L 260 340 L 260 250 L 320 250 L 320 350
             L 380 350 L 380 220 L 440 220 L 440 320
             L 500 320 L 500 280 L 560 280 L 560 350
             L 620 350 L 620 240 L 680 240 L 680 320
             L 740 320 L 740 280 L 800 280 L 800 360
             L 860 360 L 860 320 L 920 320 L 920 380 L 960 380 L 960 540 Z"
          fill="#1e293b"/>

    <!-- Foreground buildings (taller, with windows) -->
    <g>
      <!-- Building A -->
      <rect x="80"  y="380" width="80" height="160" fill="#0f172a"/>
      <!-- Windows -->
      <g fill="#fbbf24">
        <rect x="92"  y="400" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="112" y="400" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="132" y="400" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.2s" fill="freeze"/></rect>
        <rect x="92"  y="430" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.2s" fill="freeze"/></rect>
        <rect x="112" y="430" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.2s" fill="freeze"/></rect>
        <rect x="132" y="430" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.2s" fill="freeze"/></rect>
        <rect x="92"  y="460" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="132" y="460" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="92"  y="490" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="112" y="490" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="132" y="490" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/></rect>
      </g>

      <!-- Building B (skyscraper) -->
      <rect x="200" y="200" width="100" height="340" fill="#0f172a"/>
      <g fill="#fde68a">
        <rect x="216" y="220" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="232" y="220" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.2s" fill="freeze"/></rect>
        <rect x="248" y="220" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="264" y="220" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.2s" fill="freeze"/></rect>
        <rect x="280" y="220" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.2s" fill="freeze"/></rect>

        <rect x="216" y="240" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.2s" fill="freeze"/></rect>
        <rect x="248" y="240" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.2s" fill="freeze"/></rect>
        <rect x="280" y="240" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.2s" fill="freeze"/></rect>

        <rect x="216" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.2s" fill="freeze"/></rect>
        <rect x="232" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.85s" dur="0.2s" fill="freeze"/></rect>
        <rect x="280" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.2s" fill="freeze"/></rect>

        <rect x="216" y="320" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.2s" fill="freeze"/></rect>
        <rect x="248" y="320" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="232" y="380" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="280" y="380" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></rect>
        <rect x="216" y="440" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="264" y="500" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/></rect>
      </g>
      <!-- Antenna red blinker -->
      <line x1="250" y1="200" x2="250" y2="170" stroke="#0f172a" stroke-width="2"/>
      <circle cx="250" cy="170" r="3" fill="#dc2626">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </circle>

      <!-- Building C -->
      <rect x="340" y="320" width="80" height="220" fill="#0f172a"/>
      <g fill="#fbbf24">
        <rect x="354" y="338" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="372" y="338" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="392" y="338" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></rect>
        <rect x="354" y="368" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="392" y="368" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="354" y="408" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="372" y="408" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.2s" fill="freeze"/></rect>
        <rect x="372" y="468" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.2s" fill="freeze"/></rect>
        <rect x="354" y="500" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.2s" fill="freeze"/></rect>
      </g>

      <!-- Building D (taller) -->
      <rect x="460" y="240" width="60" height="300" fill="#0f172a"/>
      <g fill="#fde68a">
        <rect x="472" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="488" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.2s" fill="freeze"/></rect>
        <rect x="504" y="260" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="472" y="280" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.2s" fill="freeze"/></rect>
        <rect x="504" y="280" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></rect>
        <rect x="488" y="320" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.2s" fill="freeze"/></rect>
        <rect x="472" y="360" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="488" y="420" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="504" y="500" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/></rect>
      </g>

      <!-- Building E -->
      <rect x="560" y="350" width="100" height="190" fill="#0f172a"/>
      <g fill="#fbbf24">
        <rect x="576" y="370" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="596" y="370" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.2s" fill="freeze"/></rect>
        <rect x="616" y="370" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.2s" fill="freeze"/></rect>
        <rect x="636" y="370" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.2s" fill="freeze"/></rect>
        <rect x="576" y="400" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.2s" fill="freeze"/></rect>
        <rect x="616" y="400" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="596" y="430" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="636" y="500" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.2s" fill="freeze"/></rect>
      </g>

      <!-- Building F -->
      <rect x="700" y="290" width="80" height="250" fill="#0f172a"/>
      <g fill="#fde68a">
        <rect x="712" y="310" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="730" y="310" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="750" y="310" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></rect>
        <rect x="768" y="310" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="730" y="340" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="750" y="370" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="712" y="430" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.2s" fill="freeze"/></rect>
        <rect x="768" y="490" width="6" height="8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.2s" fill="freeze"/></rect>
      </g>

      <!-- Building G -->
      <rect x="820" y="380" width="100" height="160" fill="#0f172a"/>
      <g fill="#fbbf24">
        <rect x="836" y="396" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.2s" fill="freeze"/></rect>
        <rect x="856" y="396" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.2s" fill="freeze"/></rect>
        <rect x="876" y="396" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.2s" fill="freeze"/></rect>
        <rect x="896" y="396" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.2s" fill="freeze"/></rect>
        <rect x="876" y="430" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.2s" fill="freeze"/></rect>
        <rect x="836" y="470" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.2s" fill="freeze"/></rect>
        <rect x="896" y="510" width="8" height="10" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.2s" fill="freeze"/></rect>
      </g>
    </g>
  </g>
</svg>
