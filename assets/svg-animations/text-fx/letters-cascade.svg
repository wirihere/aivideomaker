<?xml version="1.0" encoding="UTF-8"?>
<!--
  Letter cascade — each letter of "AMAZING" pops up with overshoot, staggered.
  Total: 1.4s. Holds.
  Viewport: 720 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <g font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="900" fill="#0f172a"
     text-anchor="middle">
    <text x="80"  y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.0s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>A</text>
    <text x="170" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.08s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.08s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>M</text>
    <text x="270" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.16s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.16s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>A</text>
    <text x="370" y="140" opacity="0" fill="#ec4899">
      <animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.24s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>Z</text>
    <text x="450" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.32s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.32s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>I</text>
    <text x="530" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.40s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>N</text>
    <text x="640" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.48s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 60" to="0 0" begin="0.48s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>G</text>
  </g>

  <!-- Underline draws at the end -->
  <line x1="360" y1="170" x2="360" y2="170" stroke="#ec4899" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x1" from="360" to="60"  begin="0.85s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" from="360" to="660" begin="0.85s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>
</svg>
