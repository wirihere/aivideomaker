<?xml version="1.0" encoding="UTF-8"?>
<!--
  Underline — hand-drawn pen stroke draws below a word, slight wobble.
  Total: 0.8s. Holds.
  Viewport: 480 × 140.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <text x="240" y="70" font-family="Inter, system-ui, sans-serif"
        font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">
    important
  </text>
  <path d="M 80 100 Q 160 110 240 98 T 400 104"
        fill="none" stroke="#fbbf24" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="340" stroke-dashoffset="340">
    <animate attributeName="stroke-dashoffset" from="340" to="0"
             begin="0.2s" dur="0.8s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>
</svg>
