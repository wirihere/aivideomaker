<?xml version="1.0" encoding="UTF-8"?>
<!--
  Circle around a word — hand-drawn scribble ellipse drawn around a label.
  Total: 1.0s. Holds.
  Viewport: 480 × 220.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <text x="240" y="125" font-family="Inter, system-ui, sans-serif"
        font-size="46" font-weight="800" fill="#0f172a" text-anchor="middle">
    this one
  </text>
  <!-- Doubled scribble ring: 1st pass + slightly offset 2nd pass for handmade feel -->
  <path d="M 240 60
           C 160 58, 80 100, 108 140
           C 140 180, 320 186, 380 150
           C 410 130, 400 90, 340 74
           C 300 64, 260 66, 232 72
           C 210 76, 200 80, 200 84"
        fill="none" stroke="#ef4444" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" from="720" to="0"
             begin="0.2s" dur="1.0s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>
</svg>
