<?xml version="1.0" encoding="UTF-8"?>
<!--
  Iris close — opposite of open. Circular hole shrinks to center, screen goes black.
  Use at the END of a video.
  Total: 1.2s.
  Viewport: 1920 × 1080.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <mask id="hole">
      <rect width="1920" height="1080" fill="#ffffff"/>
      <circle cx="960" cy="540" r="1200" fill="#000000">
        <animate attributeName="r" from="1200" to="0"
                 begin="0s" dur="1.2s" fill="freeze"
                 calcMode="spline" keySplines="0.7 0 0.4 1"/>
      </circle>
    </mask>
  </defs>
  <rect width="1920" height="1080" fill="#0f172a" mask="url(#hole)"/>
</svg>
