<?xml version="1.0" encoding="UTF-8"?>
<!--
  Route — A → B route line draws across a stylized map (grid + roads),
  car icon travels along it.
  Total: 4.0s. Holds.
  Viewport: 600 × 400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Map background grid -->
  <rect width="600" height="400" fill="#f1f5f9"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0"   y1="80"  x2="600" y2="80"/>
    <line x1="0"   y1="160" x2="600" y2="160"/>
    <line x1="0"   y1="240" x2="600" y2="240"/>
    <line x1="0"   y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0"   x2="100" y2="400"/>
    <line x1="200" y1="0"   x2="200" y2="400"/>
    <line x1="300" y1="0"   x2="300" y2="400"/>
    <line x1="400" y1="0"   x2="400" y2="400"/>
    <line x1="500" y1="0"   x2="500" y2="400"/>
  </g>

  <!-- Faint roads (orthogonal) -->
  <g stroke="#cbd5e1" stroke-width="6" fill="none">
    <path d="M 0 200 L 600 200"/>
    <path d="M 240 0 L 240 400"/>
    <path d="M 60 0 L 60 200 L 360 200 L 360 400"/>
  </g>

  <!-- Route -->
  <path id="route" d="M 80 320 L 80 200 L 240 200 L 240 80 L 480 80"
        fill="none" stroke="#4f46e5" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" from="600" to="0"
             begin="0.4s" dur="2.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>

  <!-- Start pin -->
  <g transform="translate(80 320)">
    <circle r="14" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <text dy="5" font-family="Inter, system-ui, sans-serif" font-size="13"
          font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  </g>
  <!-- End pin -->
  <g transform="translate(480 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.4" to="1" begin="2.7s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <circle r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text dy="5" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- Car traveling along route -->
  <g>
    <rect x="-12" y="-7" width="24" height="14" rx="3" fill="#0f172a"/>
    <rect x="-8" y="-5" width="6" height="3" fill="#fbbf24"/>
    <rect x="2" y="-5" width="6" height="3" fill="#fbbf24"/>
    <animateMotion dur="2.4s" begin="0.4s" fill="freeze" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </g>

  <!-- ETA badge -->
  <g transform="translate(380 50)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
    <rect width="120" height="28" rx="14" fill="#0f172a"/>
    <text x="60" y="19" font-family="Inter, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ETA 12 MIN</text>
  </g>
</svg>
