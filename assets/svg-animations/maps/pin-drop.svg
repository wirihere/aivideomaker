<?xml version="1.0" encoding="UTF-8"?>
<!--
  Map pin — drops in from above with squash, then radar pulse from base.
  Total: 2.4s. Holds.
  Viewport: 240 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- Ground line -->
  <ellipse cx="120" cy="280" rx="50" ry="6" fill="#0f172a" opacity="0">
    <animate attributeName="opacity" from="0" to="0.15" begin="0.55s" dur="0.2s" fill="freeze"/>
  </ellipse>

  <!-- Pin drops -->
  <g transform="translate(120 -80)">
    <animateTransform attributeName="transform" type="translate"
      from="120 -80" to="120 200" begin="0s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1.2 0.8;0.85 1.15;1 1"
      keyTimes="0;0.55;0.7;1"
      begin="0s" dur="0.85s" fill="freeze"/>

    <path d="M 0 80
             C -50 50, -50 -10, 0 -50
             C 50 -10, 50 50, 0 80 Z"
          fill="#ef4444" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="-15" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Radar pulse out from base after landing -->
  <g transform="translate(120 280)" fill="none" stroke="#ef4444" stroke-width="3">
    <ellipse rx="30" ry="6">
      <animate attributeName="rx" from="30" to="80" begin="0.7s" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" begin="0.7s" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="30" ry="6">
      <animate attributeName="rx" from="30" to="80" begin="1.3s" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" begin="1.3s" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
