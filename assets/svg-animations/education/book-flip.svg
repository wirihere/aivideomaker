<?xml version="1.0" encoding="UTF-8"?>
<!--
  Book — closed book opens, then pages flip rapidly through, mortarboard caps fly out.
  Total: 4.0s. Holds.
  Viewport: 480 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Closed book -->
  <g transform="translate(240 200)">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.18;0.22" begin="0s" dur="0.7s" fill="freeze"/>
      <rect x="-90" y="-110" width="180" height="220" rx="6" fill="#7f1d1d" stroke="#0f172a" stroke-width="3"/>
      <rect x="-86" y="-106" width="172" height="212" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text font-family="Georgia, serif" font-size="20" font-weight="800" fill="#fef3c7"
            text-anchor="middle" dy="-30" letter-spacing="2">THE</text>
      <text font-family="Georgia, serif" font-size="32" font-weight="800" fill="#fef3c7"
            text-anchor="middle" dy="10" letter-spacing="2">BOOK</text>
    </g>

    <!-- Open book -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.2s" fill="freeze"/>
      <!-- Left page -->
      <rect x="-180" y="-110" width="180" height="220" fill="#fef3c7" stroke="#7f1d1d" stroke-width="3"/>
      <!-- Right page -->
      <rect x="0"    y="-110" width="180" height="220" fill="#fef3c7" stroke="#7f1d1d" stroke-width="3"/>
      <!-- Spine -->
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#7f1d1d" stroke-width="4"/>

      <!-- Text lines on left page -->
      <g stroke="#7f1d1d" stroke-width="1.5" opacity="0.4">
        <line x1="-160" y1="-80" x2="-30" y2="-80"/>
        <line x1="-160" y1="-60" x2="-30" y2="-60"/>
        <line x1="-160" y1="-40" x2="-50" y2="-40"/>
        <line x1="-160" y1="-20" x2="-30" y2="-20"/>
        <line x1="-160" y1="0"   x2="-50" y2="0"/>
        <line x1="-160" y1="20"  x2="-30" y2="20"/>
        <line x1="-160" y1="40"  x2="-40" y2="40"/>
        <line x1="-160" y1="60"  x2="-30" y2="60"/>
        <line x1="-160" y1="80"  x2="-50" y2="80"/>
      </g>
      <!-- Text lines on right page -->
      <g stroke="#7f1d1d" stroke-width="1.5" opacity="0.4">
        <line x1="20"  y1="-80" x2="160" y2="-80"/>
        <line x1="20"  y1="-60" x2="150" y2="-60"/>
        <line x1="20"  y1="-40" x2="160" y2="-40"/>
        <line x1="20"  y1="-20" x2="140" y2="-20"/>
        <line x1="20"  y1="0"   x2="160" y2="0"/>
        <line x1="20"  y1="20"  x2="150" y2="20"/>
        <line x1="20"  y1="40"  x2="160" y2="40"/>
        <line x1="20"  y1="60"  x2="130" y2="60"/>
        <line x1="20"  y1="80"  x2="160" y2="80"/>
      </g>
    </g>

    <!-- Flipping pages (animateTransform on a curl) -->
    <g transform-origin="0 0">
      <path d="M 0 -110 L 180 -110 L 180 110 L 0 110 Z" fill="#fef3c7" stroke="#7f1d1d" stroke-width="2">
        <animateTransform attributeName="transform" type="scale"
          values="1 1;0.05 1;1 1;0.05 1;1 1;0.05 1;1 1"
          keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"
          begin="1.0s" dur="2.0s" fill="freeze"/>
      </path>
      <g stroke="#7f1d1d" stroke-width="1.5" opacity="0.4">
        <line x1="20" y1="-80" x2="160" y2="-80"/>
        <line x1="20" y1="-50" x2="160" y2="-50"/>
        <line x1="20" y1="-20" x2="160" y2="-20"/>
        <line x1="20" y1="10"  x2="160" y2="10"/>
      </g>
    </g>
  </g>

  <!-- Mortarboard caps fly out at the end -->
  <g fill="#0f172a" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" begin="3.0s" dur="1.0s" fill="freeze"/>
    <g>
      <animateMotion path="M 240 200 Q 100 100 50 -50" begin="3.0s" dur="1.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="-540" begin="3.0s" dur="1.0s" fill="freeze"/>
      <polygon points="-22,-4 0,-12 22,-4 0,4"/>
      <rect x="-12" y="-2" width="24" height="14"/>
      <line x1="22" y1="-4" x2="36" y2="14" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="36" cy="14" r="3" fill="#fbbf24"/>
    </g>
    <g>
      <animateMotion path="M 240 200 Q 380 100 430 -50" begin="3.1s" dur="1.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="540" begin="3.1s" dur="1.0s" fill="freeze"/>
      <polygon points="-22,-4 0,-12 22,-4 0,4"/>
      <rect x="-12" y="-2" width="24" height="14"/>
      <line x1="-22" y1="-4" x2="-36" y2="14" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="-36" cy="14" r="3" fill="#fbbf24"/>
    </g>
  </g>
</svg>
