<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lightbulb idea — bulb appears, dim, then flicks ON with rays bursting out, "AHA!" pops.
  Total: 2.0s. Holds.
  Viewport: 320 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <!-- Halo -->
  <circle cx="160" cy="160" r="0" fill="#fef3c7" opacity="0.7">
    <animate attributeName="r"       from="0" to="120" begin="0.9s" dur="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.7;0" begin="0.9s" dur="0.6s" fill="freeze"/>
  </circle>

  <!-- Rays -->
  <g transform="translate(160 160)" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" begin="0.95s" dur="0.5s" fill="freeze"/>
    <line x1="0" y1="-90" x2="0" y2="-130"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(45)"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(-45)"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(90)"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(-90)"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(135)"/>
    <line x1="0" y1="-90" x2="0" y2="-130" transform="rotate(-135)"/>
  </g>

  <!-- Bulb (off, then on) -->
  <g transform="translate(160 180)">
    <!-- Glass -->
    <path d="M -50 0
             C -50 -54, 50 -54, 50 0
             C 50 30, 30 36, 30 60
             L -30 60
             C -30 36, -50 30, -50 0 Z"
          fill="#cbd5e1" stroke="#0f172a" stroke-width="3" stroke-linejoin="round">
      <animate attributeName="fill" from="#cbd5e1" to="#fbbf24" begin="0.9s" dur="0.2s" fill="freeze"/>
    </path>
    <!-- Filament -->
    <path d="M -16 -10 Q -8 -28 0 -10 Q 8 -28 16 -10"
          fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke" from="#94a3b8" to="#dc2626" begin="0.9s" dur="0.2s" fill="freeze"/>
      <animate attributeName="stroke-width" from="2.5" to="3.5" begin="0.9s" dur="0.2s" fill="freeze"/>
    </path>
    <!-- Base -->
    <rect x="-22" y="60" width="44" height="14" fill="#475569"/>
    <rect x="-22" y="76" width="44" height="6"  fill="#1e293b"/>
    <line x1="-22" y1="86" x2="22" y2="92" stroke="#475569" stroke-width="3"/>
    <line x1="-22" y1="92" x2="22" y2="98" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- AHA! pop -->
  <g transform="translate(160 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0;1.3;1" keyTimes="0;0.6;1" begin="1.4s" dur="0.5s" fill="freeze"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="900"
          fill="#0f172a" text-anchor="middle" dy="14">AHA!</text>
  </g>
</svg>
