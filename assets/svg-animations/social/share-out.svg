<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share — three nodes connected by lines, content packet flies along edges.
  Loops once per cycle. Total 2.4s.
  Viewport: 240 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <g fill="none" stroke="#4f46e5" stroke-width="3">
    <line x1="80"  y1="120" x2="172" y2="60" stroke-dasharray="4 4"/>
    <line x1="80"  y1="120" x2="172" y2="180" stroke-dasharray="4 4"/>
  </g>

  <!-- Source node -->
  <g transform="translate(80 120)">
    <circle r="22" fill="#4f46e5"/>
    <path d="M -8 0 L -2 6 L 8 -6" fill="none" stroke="#ffffff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Target nodes -->
  <g transform="translate(172 60)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.4" to="1" begin="1.1s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <circle r="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  </g>
  <g transform="translate(172 180)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.4" to="1" begin="1.6s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <circle r="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  </g>

  <!-- Packet 1 (top) -->
  <circle r="6" fill="#06b6d4" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1"
             begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M 80 120 L 172 60" begin="0.4s" dur="0.8s" fill="freeze"/>
  </circle>

  <!-- Packet 2 (bottom) -->
  <circle r="6" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1"
             begin="0.9s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M 80 120 L 172 180" begin="0.9s" dur="0.8s" fill="freeze"/>
  </circle>
</svg>
