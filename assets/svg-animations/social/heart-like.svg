<?xml version="1.0" encoding="UTF-8"?>
<!--
  Heart like — outline draws, then fills with a punchy scale, then particle burst.
  Total: 1.8s. Holds.
  Viewport: 240 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <g transform="translate(120 130)">

    <!-- Outline draws first -->
    <path d="M 0 50
             C -50 10, -80 -20, -50 -50
             C -25 -75, 0 -50, 0 -20
             C 0 -50, 25 -75, 50 -50
             C 80 -20, 50 10, 0 50 Z"
          fill="none" stroke="#ec4899" stroke-width="6" stroke-linejoin="round"
          stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" from="320" to="0"
               begin="0s" dur="0.7s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>

    <!-- Filled heart pops in -->
    <path d="M 0 50
             C -50 10, -80 -20, -50 -50
             C -25 -75, 0 -50, 0 -20
             C 0 -50, 25 -75, 50 -50
             C 80 -20, 50 10, 0 50 Z"
          fill="#ec4899" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.5;1.3;1" keyTimes="0;0.5;1"
        begin="0.7s" dur="0.5s" fill="freeze"/>
    </path>

    <!-- Spark burst -->
    <g fill="#ec4899" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="1.05s" dur="0.6s" fill="freeze"/>
      <circle cx="0"  cy="-90" r="4">
        <animate attributeName="cy" from="-70" to="-110" begin="1.05s" dur="0.6s" fill="freeze"/>
      </circle>
      <circle cx="80"  cy="-30" r="4">
        <animate attributeName="cx" from="60"  to="100" begin="1.05s" dur="0.6s" fill="freeze"/>
      </circle>
      <circle cx="-80" cy="-30" r="4">
        <animate attributeName="cx" from="-60" to="-100" begin="1.05s" dur="0.6s" fill="freeze"/>
      </circle>
      <circle cx="60"  cy="-80" r="3">
        <animate attributeName="cx" from="40" to="80" begin="1.05s" dur="0.6s" fill="freeze"/>
        <animate attributeName="cy" from="-60" to="-100" begin="1.05s" dur="0.6s" fill="freeze"/>
      </circle>
      <circle cx="-60" cy="-80" r="3">
        <animate attributeName="cx" from="-40" to="-80" begin="1.05s" dur="0.6s" fill="freeze"/>
        <animate attributeName="cy" from="-60" to="-100" begin="1.05s" dur="0.6s" fill="freeze"/>
      </circle>
    </g>
  </g>
</svg>
