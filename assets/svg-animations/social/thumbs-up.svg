<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thumbs up — pops in with overshoot, plus a couple of motion lines.
  Total: 1.4s. Holds.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0;1.25;0.95;1" keyTimes="0;0.5;0.75;1"
        begin="0s" dur="0.6s" fill="freeze"/>

      <!-- Hand silhouette (palm + fingers folded + thumb up) -->
      <path d="M -25 60
               L -25 -10
               L -10 -10
               Q -10 -50 5 -50
               Q 18 -50 16 -22
               L 16 -10
               L 38 -10
               Q 50 -10 50 0
               Q 56 0 56 8
               Q 60 10 60 18
               Q 62 22 60 28
               Q 60 36 54 40
               Q 56 50 48 56
               Q 46 60 38 60
               Z"
            fill="#fbbf24" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
      <line x1="-10" y1="0" x2="-10" y2="56" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Motion lines whoosh -->
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="0.55s" dur="0.45s" fill="freeze"/>
      <line x1="-50" y1="-65" x2="-30" y2="-50">
        <animate attributeName="x1" from="-40" to="-60" begin="0.55s" dur="0.45s" fill="freeze"/>
        <animate attributeName="y1" from="-55" to="-75" begin="0.55s" dur="0.45s" fill="freeze"/>
      </line>
      <line x1="20" y1="-70" x2="32" y2="-58">
        <animate attributeName="x1" from="14" to="26" begin="0.55s" dur="0.45s" fill="freeze"/>
        <animate attributeName="y1" from="-60" to="-78" begin="0.55s" dur="0.45s" fill="freeze"/>
      </line>
      <line x1="-12" y1="-78" x2="0" y2="-65">
        <animate attributeName="y1" from="-68" to="-88" begin="0.55s" dur="0.45s" fill="freeze"/>
      </line>
    </g>
  </g>
</svg>
