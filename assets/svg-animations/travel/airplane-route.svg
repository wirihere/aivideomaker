<?xml version="1.0" encoding="UTF-8"?>
<!--
  Airplane route — dotted arc draws between two cities, plane flies along it,
  destination card appears on arrival.
  Total: 4.0s. Holds.
  Viewport: 720 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <linearGradient id="sky-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="720" height="320" fill="url(#sky-band)"/>

  <!-- Origin city -->
  <g transform="translate(80 240)">
    <circle r="10" fill="#0f172a"/>
    <circle r="6"  fill="#fbbf24"/>
    <text x="0" y="36" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800"
          fill="#0f172a" text-anchor="middle">AKL</text>
    <text x="0" y="56" font-family="Inter, system-ui, sans-serif" font-size="11"
          fill="#475569" text-anchor="middle">Auckland</text>
  </g>

  <!-- Destination city -->
  <g transform="translate(640 100)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.4" to="1" begin="2.6s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <circle r="10" fill="#0f172a"/>
    <circle r="6"  fill="#dc2626"/>
    <text x="0" y="-20" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800"
          fill="#0f172a" text-anchor="middle">CDG</text>
    <text x="0" y="-36" font-family="Inter, system-ui, sans-serif" font-size="11"
          fill="#475569" text-anchor="middle">Paris</text>
  </g>

  <!-- Flight path -->
  <path id="flight-path" d="M 80 240 Q 360 -40 640 100"
        fill="none" stroke="#0f172a" stroke-width="3" stroke-dasharray="6 8"
        stroke-dashoffset="640">
    <animate attributeName="stroke-dashoffset" from="640" to="0"
             begin="0.4s" dur="2.2s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>

  <!-- Plane traveling -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1"
             begin="0.4s" dur="2.4s" fill="freeze"/>
    <g>
      <path d="M -20 0 L 22 -6 L 28 0 L 22 6 Z" fill="#dc2626" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 8 -2 L 22 -16 M 8 2 L 22 16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <path d="M -12 -2 L -18 -10 M -12 2 L -18 10" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <animateMotion dur="2.4s" begin="0.4s" fill="freeze" rotate="auto">
        <mpath href="#flight-path"/>
      </animateMotion>
    </g>
  </g>

  <!-- Destination card on arrival -->
  <g transform="translate(640 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="640 220" to="640 200" begin="3.0s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <rect x="-100" y="0" width="200" height="80" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="-86" y="22" font-family="Inter, system-ui, sans-serif" font-size="11"
          font-weight="700" fill="#475569" letter-spacing="2">FLIGHT TIME</text>
    <text x="-86" y="50" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
          fill="#0f172a">23h 45m</text>
    <text x="86"  y="22" font-family="Inter, system-ui, sans-serif" font-size="11"
          font-weight="700" fill="#475569" letter-spacing="2" text-anchor="end">DISTANCE</text>
    <text x="86"  y="50" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
          fill="#0f172a" text-anchor="end">18,840 km</text>
  </g>
</svg>
