<?xml version="1.0" encoding="UTF-8"?>
<!--
  Suitcase pack — suitcase opens, items drop in one by one, closes, tag appears.
  Total: 4.2s. Holds.
  Viewport: 480 × 420.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420">
  <defs>
    <clipPath id="suitcase-inside">
      <rect x="100" y="180" width="280" height="140"/>
    </clipPath>
  </defs>

  <!-- Suitcase handle -->
  <g transform="translate(240 140)">
    <path d="M -40 20 L -40 0 Q -40 -20 -20 -20 L 20 -20 Q 40 -20 40 0 L 40 20"
          fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Suitcase body (bottom half, static) -->
  <g>
    <rect x="100" y="220" width="280" height="140" rx="12" fill="#4f46e5" stroke="#0f172a" stroke-width="5"/>
    <rect x="120" y="240" width="240" height="100" fill="#c7d2fe" stroke="#312e81" stroke-width="2"/>
  </g>

  <!-- Lid (top half) — opens up, then closes -->
  <g transform="translate(240 220)">
    <g transform-origin="-140 0">
      <animateTransform attributeName="transform" type="rotate"
        values="0;-100;-100;-100;0"
        keyTimes="0;0.15;0.3;0.85;1"
        begin="0s" dur="4s" fill="freeze"/>

      <rect x="-140" y="-40" width="280" height="40" rx="12" fill="#4f46e5" stroke="#0f172a" stroke-width="5"/>
      <rect x="-120" y="-30" width="240" height="20" fill="#c7d2fe" stroke="#312e81" stroke-width="2"/>
    </g>
  </g>

  <!-- Items drop into bottom half -->
  <g clip-path="url(#suitcase-inside)">
    <!-- Shirt -->
    <g transform="translate(170 100)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="170 100" to="170 280" begin="1.0s" dur="0.4s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
      <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#7f1d1d" stroke-width="2"/>
    </g>

    <!-- Toiletry -->
    <g transform="translate(240 80)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="240 80" to="240 290" begin="1.5s" dur="0.4s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <rect x="-12" y="-20" width="24" height="40" rx="4" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Passport -->
    <g transform="translate(310 80)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="310 80" to="310 290" begin="2.0s" dur="0.4s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <rect x="-16" y="-22" width="32" height="44" rx="2" fill="#0f172a"/>
      <text y="6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800"
            fill="#fbbf24" text-anchor="middle">★</text>
    </g>

    <!-- Pants -->
    <g transform="translate(170 60)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="170 60" to="170 240" begin="2.5s" dur="0.4s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.6 1.1"/>
      <rect x="-34" y="-14" width="68" height="30" rx="3" fill="#1e40af" stroke="#0f172a" stroke-width="2"/>
    </g>
  </g>

  <!-- Luggage tag -->
  <g transform="translate(240 140)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="-20;15;-10;5;0" keyTimes="0;0.25;0.5;0.75;1" begin="3.8s" dur="0.8s" fill="freeze"/>
    <line x1="0" y1="-30" x2="0" y2="-10" stroke="#78350f" stroke-width="2"/>
    <rect x="-20" y="-10" width="40" height="50" rx="2" fill="#fde68a" stroke="#78350f" stroke-width="2"/>
    <circle cx="0" cy="-2" r="2" fill="#78350f"/>
    <text y="20" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="800"
          fill="#78350f" text-anchor="middle">NYC</text>
  </g>

  <!-- Wheels (bottom) -->
  <g>
    <circle cx="130" cy="370" r="10" fill="#0f172a"/>
    <circle cx="350" cy="370" r="10" fill="#0f172a"/>
  </g>
</svg>
