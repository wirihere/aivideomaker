<?xml version="1.0" encoding="UTF-8"?>
<!--
  Contactless card tap — card slides in, three NFC arcs ring out, then a tick confirms.
  Total: 3.6s. Holds.
  Viewport: 480 × 280.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Reader (right side) -->
  <g transform="translate(360 140)">
    <rect x="-46" y="-60" width="92" height="120" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="-32" y="-46" width="64" height="44" rx="6" fill="#0b1220"/>
    <text y="-20" font-family="Inter, system-ui, sans-serif" font-size="9"
          font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PAY</text>
  </g>

  <!-- NFC arcs from reader -->
  <g transform="translate(360 140)" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round">
    <path d="M -60 -20 Q -78 0 -60 20" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="1.6s" dur="0.9s" repeatCount="3"/>
    </path>
    <path d="M -76 -32 Q -100 0 -76 32" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="1.75s" dur="0.9s" repeatCount="3"/>
    </path>
    <path d="M -94 -44 Q -124 0 -94 44" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="1.9s" dur="0.9s" repeatCount="3"/>
    </path>
  </g>

  <!-- Card slides in from left -->
  <g transform="translate(-160 140) rotate(-12)">
    <animateTransform attributeName="transform" type="translate"
      from="-160 140" to="200 140" begin="0s" dur="1.4s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <rect x="-90" y="-56" width="180" height="112" rx="12" fill="url(#card-grad)" stroke="#0b1220" stroke-width="2"/>
    <rect x="-72" y="-30" width="20" height="16" rx="2" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.7">
      <line x1="-66" y1="-26" x2="-66" y2="-18"/>
      <line x1="-60" y1="-26" x2="-60" y2="-18"/>
    </g>
    <text x="-72" y="34" font-family="monospace" font-size="11" fill="#cbd5e1" letter-spacing="2">**** 4 8 2 0</text>
  </g>

  <!-- Confirmation tick -->
  <g transform="translate(240 230)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      from="0.6" to="1" begin="3.0s" dur="0.4s" fill="freeze"
      calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    <rect x="-66" y="-18" width="132" height="36" rx="18" fill="#22c55e"/>
    <path d="M -32 0 L -16 14 L 8 -10" fill="none" stroke="#ffffff"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="6" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="700" fill="#ffffff">PAID</text>
  </g>
</svg>
