<?xml version="1.0" encoding="UTF-8"?>
<!--
  Coin — falls in, then spins on its vertical axis (3D fake via scaleX).
  Total: 3.0s. Loops the spin.
  Viewport: 200 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="coin-shine" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0"   stop-color="#fde68a"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1"   stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="220" rx="50" ry="6" fill="#0f172a" opacity="0">
    <animate attributeName="opacity" from="0" to="0.15" begin="0.4s" dur="0.3s" fill="freeze"/>
    <animate attributeName="rx" values="50;36;50" dur="0.9s" begin="0.7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Coin: drops in, then spins -->
  <g transform="translate(100 -60)">
    <animateTransform attributeName="transform" type="translate"
      from="100 -60" to="100 110" begin="0s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.6 1.2"/>

    <!-- Spin uses scaleX from 1 → 0 → 1 to fake the rotation -->
    <g>
      <circle r="62" fill="url(#coin-shine)" stroke="#92400e" stroke-width="3"/>
      <text y="14" font-family="'Times New Roman', serif" font-size="62" font-weight="700"
            fill="#7c2d12" text-anchor="middle">$</text>
      <animateTransform attributeName="transform" type="scale"
        values="1 1;0.05 1;1 1;0.05 1;1 1"
        keyTimes="0;0.25;0.5;0.75;1"
        begin="0.7s" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
