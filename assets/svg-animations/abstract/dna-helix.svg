<?xml version="1.0" encoding="UTF-8"?>
<!--
  DNA helix — two interweaving sine paths with rungs that pulse.
  Loops indefinitely.
  Viewport: 320 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="strand-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="strand-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <g transform="translate(160 0)">
    <!-- Strands -->
    <path d="M 0 0 Q 80 60 0 120 Q -80 180 0 240 Q 80 300 0 360 Q -80 420 0 480"
          fill="none" stroke="url(#strand-a)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 0 Q -80 60 0 120 Q 80 180 0 240 Q -80 300 0 360 Q 80 420 0 480"
          fill="none" stroke="url(#strand-b)" stroke-width="6" stroke-linecap="round"/>

    <!-- Rungs (each pulses width / opacity) -->
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="-50" y1="30"  x2="50"  y2="30">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="-70" y1="60"  x2="70"  y2="60">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.1s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="90"  x2="50"  y2="90">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="150" x2="50"  y2="150">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="-70" y1="180" x2="70"  y2="180">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="210" x2="50"  y2="210">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="270" x2="50"  y2="270">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-70" y1="300" x2="70"  y2="300">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="330" x2="50"  y2="330">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="390" x2="50"  y2="390">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="-70" y1="420" x2="70"  y2="420">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.0s" repeatCount="indefinite"/>
      </line>
      <line x1="-50" y1="450" x2="50"  y2="450">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Slow rotation around vertical axis (fake via scaleX) -->
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;0.4 1;1 1;0.4 1;1 1"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="4s" repeatCount="indefinite"/>
  </g>
</svg>
