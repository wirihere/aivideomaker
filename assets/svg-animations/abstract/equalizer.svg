<?xml version="1.0" encoding="UTF-8"?>
<!--
  Audio equalizer — 12 vertical bars pulse at varied speeds.
  Loops indefinitely.
  Viewport: 600 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="eq-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#06b6d4"/>
      <stop offset="0.6" stop-color="#a855f7"/>
      <stop offset="1"   stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <g fill="url(#eq-grad)">
    <rect x="20"  y="180" width="32" height="40" rx="6">
      <animate attributeName="height" values="40;160;80;200;60;40" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="180;60;140;20;160;180" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="68"  y="180" width="32" height="80" rx="6">
      <animate attributeName="height" values="80;180;60;140;100;80" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="140;40;160;80;120;140" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="180" width="32" height="120" rx="6">
      <animate attributeName="height" values="120;200;80;160;40;120" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="100;20;140;60;180;100" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="164" y="180" width="32" height="60" rx="6">
      <animate attributeName="height" values="60;180;120;200;80;60" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="160;40;100;20;140;160" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="212" y="180" width="32" height="160" rx="6">
      <animate attributeName="height" values="160;60;200;80;120;160" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="60;160;20;140;100;60" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="180" width="32" height="100" rx="6">
      <animate attributeName="height" values="100;200;40;160;120;100" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="120;20;180;60;100;120" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="308" y="180" width="32" height="140" rx="6">
      <animate attributeName="height" values="140;80;200;60;120;140" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="80;140;20;160;100;80" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="356" y="180" width="32" height="60" rx="6">
      <animate attributeName="height" values="60;180;100;200;80;60" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="160;40;120;20;140;160" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="180" width="32" height="120" rx="6">
      <animate attributeName="height" values="120;40;160;80;200;120" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="100;180;60;140;20;100" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="452" y="180" width="32" height="80" rx="6">
      <animate attributeName="height" values="80;160;40;200;120;80" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="140;60;180;20;100;140" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="180" width="32" height="180" rx="6">
      <animate attributeName="height" values="180;100;160;60;200;180" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="40;120;60;160;20;40" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="548" y="180" width="32" height="60" rx="6">
      <animate attributeName="height" values="60;200;80;140;100;60" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="160;20;140;80;120;160" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
