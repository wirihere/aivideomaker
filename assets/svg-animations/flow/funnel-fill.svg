<?xml version="1.0" encoding="UTF-8"?>
<!--
  Funnel — outline draws, then liquid pours in from above and fills, droplets fall out the bottom.
  Total: 3.6s. Holds.
  Viewport: 360 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="funnel-shape">
      <path d="M 80 60 L 280 60 L 200 180 L 200 280 L 160 280 L 160 180 Z"/>
    </clipPath>
  </defs>

  <!-- Pour line above -->
  <line x1="180" y1="20" x2="180" y2="20" stroke="#06b6d4" stroke-width="6" stroke-linecap="round">
    <animate attributeName="y2" from="20" to="60" begin="0.3s" dur="0.3s" fill="freeze"/>
  </line>

  <!-- Liquid fills funnel via clipped rising rect -->
  <g clip-path="url(#funnel-shape)">
    <rect x="0" y="280" width="360" height="0" fill="#06b6d4">
      <animate attributeName="y" from="280" to="80"  begin="0.6s" dur="2.0s" fill="freeze"/>
      <animate attributeName="height" from="0" to="200" begin="0.6s" dur="2.0s" fill="freeze"/>
    </rect>
  </g>

  <!-- Funnel outline -->
  <path d="M 80 60 L 280 60 L 200 180 L 200 280 L 160 280 L 160 180 Z"
        fill="none" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Droplets out the bottom -->
  <g fill="#06b6d4">
    <circle cx="180" cy="285" r="5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="2.7s" dur="0.6s" repeatCount="3"/>
      <animate attributeName="cy" from="285" to="340" begin="2.7s" dur="0.6s" repeatCount="3"/>
    </circle>
    <circle cx="180" cy="285" r="4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="2.9s" dur="0.6s" repeatCount="3"/>
      <animate attributeName="cy" from="285" to="340" begin="2.9s" dur="0.6s" repeatCount="3"/>
    </circle>
  </g>
</svg>
