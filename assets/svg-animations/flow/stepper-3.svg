<?xml version="1.0" encoding="UTF-8"?>
<!--
  3-step progress — line draws through nodes left to right, each node activates
  with a check. Total 3.6s. Holds.
  Viewport: 600 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <!-- Static base line -->
  <line x1="80" y1="100" x2="520" y2="100" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

  <!-- Active progress line -->
  <line x1="80" y1="100" x2="80" y2="100" stroke="#4f46e5" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" from="80"  to="300" begin="0.6s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x2" from="300" to="520" begin="2.0s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Step 1 -->
  <g transform="translate(80 100)">
    <circle r="28" fill="#4f46e5"/>
    <path d="M -10 0 L -2 8 L 10 -8" fill="none" stroke="#ffffff"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" begin="0.2s" dur="0.4s" fill="freeze"/>
    </path>
    <text y="60" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#0f172a" text-anchor="middle">CART</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(300 100)">
    <circle r="28" fill="#e2e8f0">
      <animate attributeName="fill" from="#e2e8f0" to="#4f46e5" begin="1.2s" dur="0.3s" fill="freeze"/>
    </circle>
    <text font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
          fill="#94a3b8" text-anchor="middle" dy="6">
      <animate attributeName="opacity" values="1;0" begin="1.2s" dur="0.2s" fill="freeze"/>
      2
    </text>
    <path d="M -10 0 L -2 8 L 10 -8" fill="none" stroke="#ffffff"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" begin="1.5s" dur="0.4s" fill="freeze"/>
    </path>
    <text y="60" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#0f172a" text-anchor="middle">SHIPPING</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(520 100)">
    <circle r="28" fill="#e2e8f0">
      <animate attributeName="fill" from="#e2e8f0" to="#4f46e5" begin="2.6s" dur="0.3s" fill="freeze"/>
    </circle>
    <text font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800"
          fill="#94a3b8" text-anchor="middle" dy="6">
      <animate attributeName="opacity" values="1;0" begin="2.6s" dur="0.2s" fill="freeze"/>
      3
    </text>
    <path d="M -10 0 L -2 8 L 10 -8" fill="none" stroke="#ffffff"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.9s" dur="0.4s" fill="freeze"/>
    </path>
    <text y="60" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#0f172a" text-anchor="middle">PAID</text>
  </g>
</svg>
