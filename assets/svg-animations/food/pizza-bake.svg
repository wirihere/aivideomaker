<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pizza bake — pizza appears, toppings drop one at a time, "BAKING" timer counts up,
  steam rises when done.
  Total: 4.0s. Holds.
  Viewport: 480 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Pizza base -->
  <g transform="translate(240 260)">
    <circle r="0" fill="#fef3c7" stroke="#92400e" stroke-width="6">
      <animate attributeName="r" from="0" to="160" begin="0s" dur="0.5s" fill="freeze"
               calcMode="spline" keySplines="0.34 1.4 0.64 1"/>
    </circle>

    <!-- Sauce -->
    <circle r="140" fill="#dc2626" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
    </circle>

    <!-- Cheese -->
    <circle r="135" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" begin="0.95s" dur="0.4s" fill="freeze"/>
    </circle>

    <!-- Pepperoni toppings drop -->
    <g fill="#dc2626">
      <circle cx="-70" cy="-40" r="0">
        <animate attributeName="r" from="0" to="20" begin="1.4s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <circle cx="60"  cy="-50" r="0">
        <animate attributeName="r" from="0" to="20" begin="1.55s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <circle cx="-30" cy="40" r="0">
        <animate attributeName="r" from="0" to="20" begin="1.7s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <circle cx="80" cy="50" r="0">
        <animate attributeName="r" from="0" to="20" begin="1.85s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <circle cx="-80" cy="60" r="0">
        <animate attributeName="r" from="0" to="20" begin="2.0s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
      <circle cx="20" cy="-30" r="0">
        <animate attributeName="r" from="0" to="20" begin="2.15s" dur="0.2s" fill="freeze"
                 calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </circle>
    </g>

    <!-- Basil leaves -->
    <g fill="#16a34a">
      <ellipse cx="20" cy="80" rx="8" ry="14" transform="rotate(20 20 80)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.2s" fill="freeze"/>
      </ellipse>
      <ellipse cx="-50" cy="-80" rx="8" ry="14" transform="rotate(-30 -50 -80)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.2s" fill="freeze"/>
      </ellipse>
      <ellipse cx="100" cy="-10" rx="8" ry="14" transform="rotate(50 100 -10)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.2s" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <!-- Steam (after baking) -->
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
    <path d="M 220 80 Q 230 60 220 40 Q 210 20 220 0">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="3.0s" repeatCount="indefinite"/>
    </path>
    <path d="M 250 80 Q 260 60 250 40 Q 240 20 250 0">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="3.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 280 80 Q 290 60 280 40 Q 270 20 280 0">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Status banner at top -->
  <g transform="translate(240 40)">
    <rect x="-90" y="-14" width="180" height="32" rx="16" fill="#0f172a"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800"
          fill="#fbbf24" text-anchor="middle" dy="5" letter-spacing="3">
      <animate attributeName="textContent"
               values="BAKING…;BAKING…;BAKING…;READY!"
               keyTimes="0;0.5;0.95;1"
               begin="0s" dur="3s" fill="freeze"/>
      BAKING…
    </text>
  </g>

  <!-- Slice highlight -->
  <g transform="translate(240 260)" stroke="#92400e" stroke-width="3" stroke-dasharray="6 6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
    <line x1="0" y1="-160" x2="0" y2="160"/>
    <line x1="-160" y1="0" x2="160" y2="0"/>
  </g>
</svg>
