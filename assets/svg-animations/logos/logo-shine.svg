<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo with shine sweep — wordmark fades in, then a metallic shine bar sweeps across.
  Total: 3.0s. Holds.
  Viewport: 600 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <clipPath id="text-clip">
      <text x="300" y="120" font-family="Inter, system-ui, sans-serif"
            font-size="80" font-weight="900" text-anchor="middle">PREMIUM</text>
    </clipPath>
  </defs>

  <!-- Wordmark fill -->
  <text x="300" y="120" font-family="Inter, system-ui, sans-serif"
        font-size="80" font-weight="900" fill="url(#text-grad)" text-anchor="middle"
        stroke="#92400e" stroke-width="2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
    PREMIUM
  </text>

  <!-- Shine sweep clipped to the text shape -->
  <g clip-path="url(#text-clip)">
    <rect x="-220" y="50" width="160" height="120" fill="url(#shine-grad)"
          transform="skewX(-20)">
      <animate attributeName="x" from="-220" to="600" begin="0.7s" dur="1.0s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
    <!-- Second sweep -->
    <rect x="-220" y="50" width="100" height="120" fill="url(#shine-grad)"
          transform="skewX(-20)" opacity="0.7">
      <animate attributeName="x" from="-220" to="600" begin="1.9s" dur="0.8s" fill="freeze"/>
    </rect>
  </g>
</svg>
