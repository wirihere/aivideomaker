<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo stamp — large rotated stamp slams in with overshoot, ink rings settle.
  Total: 1.4s. Holds.
  Viewport: 480 × 480.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <g transform="translate(240 240) rotate(-12)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="3.6;0.85;1.05;1" keyTimes="0;0.5;0.75;1"
        begin="0s" dur="0.6s" fill="freeze"/>

      <!-- Outer ring -->
      <circle r="160" fill="none" stroke="#dc2626" stroke-width="10"/>
      <!-- Inner ring -->
      <circle r="120" fill="none" stroke="#dc2626" stroke-width="5"/>
      <!-- Top arc text guide (drawn invisibly, used by textPath) -->
      <path id="arc-top"    d="M -110 -20 A 110 110 0 0 1 110 -20" fill="none"/>
      <path id="arc-bottom" d="M -110 20  A 110 110 0 0 0 110 20"  fill="none"/>

      <text font-family="Inter, system-ui, sans-serif" font-size="22"
            font-weight="800" fill="#dc2626" letter-spacing="6">
        <textPath href="#arc-top" startOffset="50%" text-anchor="middle">APPROVED · APPROVED</textPath>
      </text>
      <text font-family="Inter, system-ui, sans-serif" font-size="18"
            font-weight="700" fill="#dc2626" letter-spacing="4">
        <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">SINCE 2026</textPath>
      </text>

      <!-- Center mark -->
      <text font-family="Inter, system-ui, sans-serif" font-size="48"
            font-weight="900" fill="#dc2626" text-anchor="middle" dy="16">★</text>
    </g>

    <!-- Ink-spatter ring after the slam -->
    <g fill="#dc2626" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" begin="0.3s" dur="0.5s" fill="freeze"/>
      <circle cx="-180" cy="-50"  r="3"/>
      <circle cx="170"  cy="60"   r="2"/>
      <circle cx="-60"  cy="-185" r="2"/>
      <circle cx="60"   cy="180"  r="3"/>
      <circle cx="-180" cy="80"   r="2"/>
      <circle cx="190"  cy="-30"  r="3"/>
    </g>
  </g>
</svg>
