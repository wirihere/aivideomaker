<?xml version="1.0" encoding="UTF-8"?>
<!--
  Generic logo build — geometric shapes fly in from corners, assemble,
  then a wordmark fades in below.
  Total: 2.6s. Holds.
  Viewport: 600 × 300.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <g transform="translate(300 130)">
    <!-- Center circle (final logo: stacked geometry) -->

    <!-- Square (from top-left) -->
    <rect x="-40" y="-40" width="80" height="80" fill="#4f46e5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="-300 -200" to="0 0" begin="0s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>

    <!-- Triangle (from top-right) -->
    <path d="M 0 -50 L 40 30 L -40 30 Z" fill="#06b6d4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="300 -200" to="0 0" begin="0.15s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </path>

    <!-- Circle accent (from bottom) -->
    <circle r="14" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 200" to="0 0" begin="0.3s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </circle>

    <!-- Frame outline drawn last -->
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#0f172a" stroke-width="3"
          stroke-dasharray="480" stroke-dashoffset="480">
      <animate attributeName="stroke-dashoffset" from="480" to="0" begin="1.0s" dur="0.6s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300 240)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="300 254" to="300 240" begin="1.7s" dur="0.5s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800"
          fill="#0f172a" text-anchor="middle" letter-spacing="6">YOUR · BRAND</text>
  </g>
</svg>
