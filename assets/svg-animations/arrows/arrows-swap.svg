<?xml version="1.0" encoding="UTF-8"?>
<!--
  Two arrows swapping (exchange / convert / swap symbol). Loops.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)" fill="none" stroke="#06b6d4" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(0 -32)">
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <path d="M 30 -20 L 60 0 L 30 20"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 -32;0 -50;0 -32" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.5;1"/>
    </g>
    <g transform="translate(0 32)">
      <line x1="60" y1="0" x2="-60" y2="0"/>
      <path d="M -30 20 L -60 0 L -30 -20"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 32;0 50;0 32" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.5;1"/>
    </g>
  </g>
</svg>
