<?xml version="1.0" encoding="UTF-8"?>
<!--
  Trend up — angled arrow drawn upward, then bobs once for emphasis.
  Total: 1.6s. Holds.
  Viewport: 280 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <g fill="none" stroke="#10b981" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 30 160 L 250 30"
          stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0"
               begin="0s" dur="0.8s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
    <g transform="translate(250 30)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        from="0.4" to="1" begin="0.75s" dur="0.3s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <path d="M -34 6 L 0 0 L -6 34"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.2s" fill="freeze"/>
      <text x="200" y="80" font-family="Inter, system-ui, sans-serif"
            font-size="28" font-weight="800" fill="#10b981" stroke="none"
            text-anchor="middle">+24%</text>
    </g>
  </g>
</svg>
