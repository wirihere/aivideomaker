<?xml version="1.0" encoding="UTF-8"?>
<!--
  Down arrow CTA — three chevrons cascade down, fading and falling. Loops.
  Viewport: 120 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 240" width="120" height="240">
  <g fill="none" stroke="#4f46e5" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 60 L 60 96 L 96 60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" keyTimes="0;0.2;0.7;1" repeatCount="indefinite"/>
      <animate attributeName="transform" attributeType="XML" type="translate" additive="sum"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 -20;0 0;0 40" dur="1.6s" keyTimes="0;0.2;1" repeatCount="indefinite"/>
    </path>
    <path d="M 24 60 L 60 96 L 96 60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.3s" keyTimes="0;0.2;0.7;1" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 20;0 60" dur="1.6s" begin="0.3s" keyTimes="0;0.2;1" repeatCount="indefinite"/>
    </path>
    <path d="M 24 60 L 60 96 L 96 60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.6s" keyTimes="0;0.2;0.7;1" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 20;0 40;0 80" dur="1.6s" begin="0.6s" keyTimes="0;0.2;1" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
