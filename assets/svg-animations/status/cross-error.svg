<?xml version="1.0" encoding="UTF-8"?>
<!--
  Error — red circle scales in, white X draws (two strokes).
  Total: 1.1s. Plays once and holds.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)">
    <circle r="0" fill="#ef4444">
      <animate attributeName="r" from="0" to="80" begin="0s" dur="0.5s" fill="freeze"
               calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    </circle>
    <line x1="-30" y1="-30" x2="30" y2="30"
          stroke="#ffffff" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0"
               begin="0.5s" dur="0.3s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>
    <line x1="30" y1="-30" x2="-30" y2="30"
          stroke="#ffffff" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0"
               begin="0.75s" dur="0.3s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>
  </g>
</svg>
