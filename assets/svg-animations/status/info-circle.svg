<?xml version="1.0" encoding="UTF-8"?>
<!--
  Info — cyan circle pops in, white "i" draws (dot + stem).
  Total: 1.0s. Plays once and holds.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)">
    <circle r="0" fill="#06b6d4">
      <animate attributeName="r" from="0" to="80" begin="0s" dur="0.45s" fill="freeze"
               calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    </circle>
    <circle cx="0" cy="-32" r="0" fill="#ffffff">
      <animate attributeName="r" from="0" to="9" begin="0.5s" dur="0.25s" fill="freeze"
               calcMode="spline" keySplines="0.4 1.6 0.6 1"/>
    </circle>
    <rect x="-9" y="-12" width="18" height="0" rx="6" fill="#ffffff">
      <animate attributeName="height" from="0" to="50" begin="0.65s" dur="0.3s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
</svg>
