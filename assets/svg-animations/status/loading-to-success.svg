<?xml version="1.0" encoding="UTF-8"?>
<!--
  Loading → success — spinner spins for 1.6s then morphs to a green check.
  Total: 2.6s. Holds.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)">

    <!-- Track ring (always visible) -->
    <circle r="80" fill="none" stroke="#e2e8f0" stroke-width="8">
      <animate attributeName="stroke" from="#e2e8f0" to="#10b981" begin="1.6s" dur="0.4s" fill="freeze"/>
    </circle>

    <!-- Spinning arc -->
    <g>
      <path d="M 80 0 A 80 80 0 0 1 -40 69.28" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.95;1" begin="0s" dur="1.6s" fill="freeze"/>
      </path>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="540" begin="0s" dur="1.6s" fill="freeze"/>
    </g>

    <!-- Fill circle (grows once spinner stops) -->
    <circle r="0" fill="#10b981">
      <animate attributeName="r" from="0" to="80" begin="1.6s" dur="0.4s" fill="freeze"
               calcMode="spline" keySplines="0.34 1.4 0.64 1"/>
    </circle>

    <!-- Tick draws -->
    <path d="M -32 4 L -8 30 L 36 -22"
          fill="none" stroke="#ffffff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" from="120" to="0"
               begin="2.0s" dur="0.5s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
  </g>
</svg>
