<?xml version="1.0" encoding="UTF-8"?>
<!--
  Success — green circle scales in, white tick draws.
  Total: 1.1s. Plays once and holds.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 100)">
    <circle r="0" fill="#10b981">
      <animate attributeName="r" from="0" to="80" begin="0s" dur="0.5s" fill="freeze"
               calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
    </circle>
    <path d="M -32 4 L -8 30 L 36 -22"
          fill="none" stroke="#ffffff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" from="120" to="0"
               begin="0.45s" dur="0.55s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
  </g>
</svg>
