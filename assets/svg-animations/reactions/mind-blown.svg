<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mind blown — head silhouette, top of head splits open, brain "explodes" up.
  Total: 2.4s. Holds.
  Viewport: 360 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- Head bottom (jaw + chin) -->
  <g transform="translate(180 240)">
    <path d="M -50 0
             Q -90 -20 -80 -60
             L -80 -10
             Q -80 80 0 80
             Q 80 80 80 -10
             L 80 -60
             Q 90 -20 50 0 Z"
          fill="#fbbf24" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Eyes -->
    <circle cx="-25" cy="20" r="6" fill="#0f172a"/>
    <circle cx="25"  cy="20" r="6" fill="#0f172a"/>
    <!-- Mouth (gaped O) -->
    <ellipse cx="0" cy="48" rx="14" ry="20" fill="#0f172a"/>
  </g>

  <!-- Top of head (lifts off) -->
  <g transform="translate(180 180)">
    <animateTransform attributeName="transform" type="translate"
      values="180 180;180 60;180 -90"
      keyTimes="0;0.4;1"
      begin="0.3s" dur="2.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      from="0" to="40" begin="0.3s" dur="2.0s" fill="freeze"/>
    <path d="M -80 0
             Q -80 -100 0 -100
             Q 80 -100 80 0
             L 80 10
             L -80 10 Z"
          fill="#fbbf24" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Brain bursting up -->
  <g transform="translate(180 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="180 200;180 100;180 50"
      keyTimes="0;0.5;1"
      begin="0.5s" dur="1.4s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.4 1; 0.6 0 0.4 1"/>

    <!-- Brain shape -->
    <g>
      <path d="M -50 20
               C -70 0, -70 -30, -45 -42
               C -40 -55, -20 -60, 0 -50
               C 20 -60, 40 -55, 45 -42
               C 70 -30, 70 0, 50 20
               C 50 35, 25 45, 0 38
               C -25 45, -50 35, -50 20 Z"
            fill="#f9a8d4" stroke="#9d174d" stroke-width="3" stroke-linejoin="round"/>
      <!-- Brain creases -->
      <g fill="none" stroke="#9d174d" stroke-width="2" stroke-linecap="round">
        <path d="M -30 -20 Q -20 -10 -30 0"/>
        <path d="M 0 -30 Q 0 -10 0 10"/>
        <path d="M 30 -20 Q 20 -10 30 0"/>
        <path d="M -25 15 Q 0 25 25 15"/>
      </g>
    </g>
  </g>

  <!-- Explosion bursts -->
  <g transform="translate(180 80)" stroke="#ef4444" stroke-width="4" fill="none" opacity="0" stroke-linecap="round">
    <animate attributeName="opacity" values="0;1;0" begin="1.4s" dur="0.8s" fill="freeze"/>
    <line x1="0" y1="0" x2="-60"  y2="-50"/>
    <line x1="0" y1="0" x2="60"   y2="-50"/>
    <line x1="0" y1="0" x2="-90"  y2="0"/>
    <line x1="0" y1="0" x2="90"   y2="0"/>
    <line x1="0" y1="0" x2="-50"  y2="-80"/>
    <line x1="0" y1="0" x2="50"   y2="-80"/>
  </g>
</svg>
