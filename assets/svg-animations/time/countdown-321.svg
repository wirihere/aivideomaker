<?xml version="1.0" encoding="UTF-8"?>
<!--
  Countdown 3-2-1-GO — each number scales in and out, final GO pops and stays.
  Total: 4.2s. Holds on GO.
  Viewport: 400 × 400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g transform="translate(200 200)">
    <!-- Ring behind numbers -->
    <circle r="150" fill="none" stroke="#e2e8f0" stroke-width="8"/>

    <!-- Sweep indicator (runs 3 sec) -->
    <g transform="rotate(-90)">
      <circle r="150" fill="none" stroke="#4f46e5" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="942">
        <animate attributeName="stroke-dashoffset" from="942" to="0"
                 begin="0s" dur="3s" fill="freeze"/>
      </circle>
    </g>

    <!-- "3" -->
    <text font-family="Inter, system-ui, sans-serif" font-size="180" font-weight="800"
          fill="#0f172a" text-anchor="middle" dy="60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1"
               begin="0s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.5;1;1;1.2" keyTimes="0;0.2;0.8;1"
        begin="0s" dur="1s" fill="freeze"/>
      3
    </text>

    <!-- "2" -->
    <text font-family="Inter, system-ui, sans-serif" font-size="180" font-weight="800"
          fill="#0f172a" text-anchor="middle" dy="60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1"
               begin="1s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.5;1;1;1.2" keyTimes="0;0.2;0.8;1"
        begin="1s" dur="1s" fill="freeze"/>
      2
    </text>

    <!-- "1" -->
    <text font-family="Inter, system-ui, sans-serif" font-size="180" font-weight="800"
          fill="#0f172a" text-anchor="middle" dy="60" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1"
               begin="2s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.5;1;1;1.2" keyTimes="0;0.2;0.8;1"
        begin="2s" dur="1s" fill="freeze"/>
      1
    </text>

    <!-- "GO!" -->
    <text font-family="Inter, system-ui, sans-serif" font-size="130" font-weight="900"
          fill="#10b981" text-anchor="middle" dy="44" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        values="0;1.4;1" keyTimes="0;0.5;1" begin="3s" dur="0.7s" fill="freeze"/>
      GO!
    </text>
  </g>
</svg>
