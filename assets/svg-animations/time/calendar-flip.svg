<?xml version="1.0" encoding="UTF-8"?>
<!--
  Calendar — desk calendar with dates flipping in sequence (textContent keyframes).
  Total: 4s. Loops.
  Viewport: 280 × 300.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <!-- Binder rings -->
  <g fill="#475569">
    <rect x="80"  y="30" width="10" height="30" rx="4"/>
    <rect x="190" y="30" width="10" height="30" rx="4"/>
  </g>

  <!-- Red top strip -->
  <rect x="40" y="50" width="200" height="50" rx="6" fill="#dc2626"/>
  <text x="140" y="84" font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">APRIL</text>

  <!-- Main body -->
  <rect x="40" y="100" width="200" height="160" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- Fold shadow (simulated page flip via scaleY twitch) -->
  <g transform="translate(140 180)">
    <text font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="800"
          fill="#0f172a" text-anchor="middle" dy="32"
          font-variant-numeric="tabular-nums">
      <animateTransform attributeName="transform" type="scale"
        values="1 1;1 0.05;1 1;1 0.05;1 1;1 0.05;1 1"
        keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="textContent"
        values="11;12;13;14;15;16;17"
        keyTimes="0;0.14;0.29;0.43;0.57;0.71;0.86"
        dur="4s" repeatCount="indefinite"/>
      11
    </text>
  </g>
</svg>
