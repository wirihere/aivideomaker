<?xml version="1.0" encoding="UTF-8"?>
<!--
  Clock — minute hand & hour hand sweep, fast-forward spin (as if time races).
  Total: 4s. Loops.
  Viewport: 240 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <g transform="translate(120 120)">
    <!-- Face -->
    <circle r="100" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>

    <!-- Ticks at 12, 3, 6, 9 -->
    <g stroke="#0f172a" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-88" x2="0" y2="-72"/>
      <line x1="72" y1="0" x2="88" y2="0"/>
      <line x1="0" y1="88" x2="0" y2="72"/>
      <line x1="-72" y1="0" x2="-88" y2="0"/>
    </g>

    <!-- Minute ticks -->
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(30)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(60)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(120)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(150)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(210)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(240)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(300)"/>
      <line x1="0" y1="-84" x2="0" y2="-78" transform="rotate(330)"/>
    </g>

    <!-- Minute hand (spins fast) -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#0f172a" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Hour hand (spins slower) -->
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#4f46e5" stroke-width="7" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- Center pin -->
    <circle r="5" fill="#0f172a"/>
  </g>
</svg>
