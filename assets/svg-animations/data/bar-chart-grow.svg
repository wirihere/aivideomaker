<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bar chart — five bars grow up from baseline, then a target line draws across.
  Total: 2.4s. Holds.
  Viewport: 480 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Axes -->
  <line x1="48" y1="40"  x2="48"  y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="48" y1="280" x2="448" y2="280" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Gridlines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="48" y1="220" x2="448" y2="220"/>
    <line x1="48" y1="160" x2="448" y2="160"/>
    <line x1="48" y1="100" x2="448" y2="100"/>
  </g>

  <!-- Bars (grow upward by animating y and height together) -->
  <g fill="#4f46e5">
    <rect x="80"  y="280" width="48" height="0">
      <animate attributeName="y"      from="280" to="200" begin="0.1s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
      <animate attributeName="height" from="0"   to="80"  begin="0.1s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
    </rect>
    <rect x="152" y="280" width="48" height="0">
      <animate attributeName="y"      from="280" to="140" begin="0.25s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
      <animate attributeName="height" from="0"   to="140" begin="0.25s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
    </rect>
    <rect x="224" y="280" width="48" height="0">
      <animate attributeName="y"      from="280" to="180" begin="0.4s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
      <animate attributeName="height" from="0"   to="100" begin="0.4s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
    </rect>
    <rect x="296" y="280" width="48" height="0">
      <animate attributeName="y"      from="280" to="80" begin="0.55s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
      <animate attributeName="height" from="0"   to="200" begin="0.55s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
    </rect>
    <rect x="368" y="280" width="48" height="0">
      <animate attributeName="y"      from="280" to="120" begin="0.7s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
      <animate attributeName="height" from="0"   to="160" begin="0.7s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.4 1"/>
    </rect>
  </g>

  <!-- Target line draws across -->
  <g>
    <line x1="48" y1="100" x2="48" y2="100"
          stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4">
      <animate attributeName="x2" from="48" to="448" begin="1.5s" dur="0.6s" fill="freeze"/>
    </line>
    <text x="448" y="92" font-family="Inter, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.3s" fill="freeze"/>
      TARGET
    </text>
  </g>

  <!-- Axis labels -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="104" y="300">Q1</text>
    <text x="176" y="300">Q2</text>
    <text x="248" y="300">Q3</text>
    <text x="320" y="300">Q4</text>
    <text x="392" y="300">Q5</text>
  </g>
</svg>
