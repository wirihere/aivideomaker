<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stat card — card slides up, big number flips in, sparkline draws, badge pops.
  Total: 2.6s. Holds.
  Viewport: 480 × 280.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <g transform="translate(40 240)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="40 240" to="40 30" begin="0s" dur="0.55s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <!-- Card -->
    <rect width="400" height="220" rx="16" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="2"/>

    <!-- Label -->
    <text x="28" y="48" font-family="Inter, system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">
      MONTHLY REVENUE
    </text>

    <!-- Big number -->
    <text x="28" y="120" font-family="Inter, system-ui, sans-serif"
          font-size="56" font-weight="800" fill="#0f172a"
          font-variant-numeric="tabular-nums" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 16" to="0 0" begin="0.7s" dur="0.5s" fill="freeze"
        calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
      $48,200
    </text>

    <!-- Trend badge -->
    <g transform="translate(280 96)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        from="0.6" to="1" begin="1.2s" dur="0.4s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <rect x="-2" y="-18" width="92" height="28" rx="14" fill="#dcfce7"/>
      <path d="M 8 0 L 14 -8 L 20 0" fill="none" stroke="#16a34a" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="4" font-family="Inter, system-ui, sans-serif"
            font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">+12.4%</text>
    </g>

    <!-- Sparkline draws -->
    <path d="M 28 180 L 70 168 L 110 174 L 152 156 L 196 162 L 240 138 L 284 144 L 328 122 L 372 110"
          fill="none" stroke="#4f46e5" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0"
               begin="1.5s" dur="1.0s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
    <circle cx="372" cy="110" r="0" fill="#4f46e5">
      <animate attributeName="r" from="0" to="5" begin="2.45s" dur="0.2s" fill="freeze"/>
    </circle>
  </g>
</svg>
