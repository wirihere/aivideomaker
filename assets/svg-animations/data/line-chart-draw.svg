<?xml version="1.0" encoding="UTF-8"?>
<!--
  Line chart — line draws left-to-right, area fills below, dots pop on points.
  Total: 2.6s. Holds.
  Viewport: 480 × 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="48" y="40" width="0" height="240">
        <animate attributeName="width" from="0" to="400"
                 begin="0s" dur="1.6s" fill="freeze"
                 calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Axes -->
  <line x1="48" y1="40"  x2="48"  y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="48" y1="280" x2="448" y2="280" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Gridlines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="48" y1="220" x2="448" y2="220"/>
    <line x1="48" y1="160" x2="448" y2="160"/>
    <line x1="48" y1="100" x2="448" y2="100"/>
  </g>

  <!-- Area + line clipped by reveal rect -->
  <g clip-path="url(#reveal)">
    <path d="M 48 240 L 120 200 L 192 220 L 264 140 L 336 160 L 408 80 L 408 280 L 48 280 Z"
          fill="url(#area-fill)"/>
    <path d="M 48 240 L 120 200 L 192 220 L 264 140 L 336 160 L 408 80"
          fill="none" stroke="#06b6d4" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Data point dots -->
  <g fill="#ffffff" stroke="#06b6d4" stroke-width="3">
    <circle cx="48"  cy="240" r="0"><animate attributeName="r" from="0" to="6" begin="0.10s" dur="0.25s" fill="freeze"/></circle>
    <circle cx="120" cy="200" r="0"><animate attributeName="r" from="0" to="6" begin="0.40s" dur="0.25s" fill="freeze"/></circle>
    <circle cx="192" cy="220" r="0"><animate attributeName="r" from="0" to="6" begin="0.70s" dur="0.25s" fill="freeze"/></circle>
    <circle cx="264" cy="140" r="0"><animate attributeName="r" from="0" to="6" begin="1.00s" dur="0.25s" fill="freeze"/></circle>
    <circle cx="336" cy="160" r="0"><animate attributeName="r" from="0" to="6" begin="1.30s" dur="0.25s" fill="freeze"/></circle>
    <circle cx="408" cy="80"  r="0"><animate attributeName="r" from="0" to="8" begin="1.60s" dur="0.3s"  fill="freeze"/></circle>
  </g>

  <!-- Final-point callout -->
  <g opacity="0" transform="translate(408 80)">
    <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.3s" fill="freeze"/>
    <rect x="-58" y="-44" width="56" height="28" rx="6" fill="#0f172a"/>
    <text x="-30" y="-25" font-family="Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">$48.2k</text>
  </g>
</svg>
