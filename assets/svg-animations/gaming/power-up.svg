<?xml version="1.0" encoding="UTF-8"?>
<!--
  Power-up — glowing power-up orb with 8-pointed star rises, pulses, then "POWER UP!" pops.
  Total: 2.8s. Holds.
  Viewport: 360 × 360.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <radialGradient id="pup-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1"   stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="pup-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo ring pulses -->
  <circle cx="180" cy="180" r="0" fill="url(#pup-halo)">
    <animate attributeName="r" from="0" to="160" begin="0s" dur="0.8s" fill="freeze"/>
  </circle>

  <!-- Core orb rises -->
  <g transform="translate(180 360)">
    <animateTransform attributeName="transform" type="translate"
      from="180 360" to="180 180" begin="0s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <!-- Spinning ring of sparkle rays -->
    <g transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" begin="0.4s" dur="6s" repeatCount="indefinite"/>
      <g stroke="#fef3c7" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-80" x2="0" y2="-100"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(45)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(90)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(135)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(180)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(225)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(270)"/>
        <line x1="0" y1="-80" x2="0" y2="-100" transform="rotate(315)"/>
      </g>
    </g>

    <!-- 8-point star -->
    <g>
      <path d="M 0 -60 L 14 -14 L 60 0 L 14 14 L 0 60 L -14 14 L -60 0 L -14 -14 Z"
            fill="url(#pup-core)" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round"/>
      <circle r="10" fill="#ffffff"/>

      <!-- Continuous pulse -->
      <animateTransform attributeName="transform" type="scale"
        values="1;1.1;1" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- POWER UP! banner -->
  <g transform="translate(180 80)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0;1.3;1" keyTimes="0;0.6;1" begin="1.0s" dur="0.6s" fill="freeze"/>
    <rect x="-100" y="-22" width="200" height="44" rx="22" fill="#dc2626" stroke="#fbbf24" stroke-width="4"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="900"
          fill="#fbbf24" text-anchor="middle" dy="6" letter-spacing="3">POWER UP!</text>
  </g>
</svg>
