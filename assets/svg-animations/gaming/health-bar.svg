<?xml version="1.0" encoding="UTF-8"?>
<!--
  Health bar — HP fills, then takes two hits (red flash) dropping from 100% → 60% → 20%.
  Total: 3.2s. Holds.
  Viewport: 480 × 120.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <!-- Heart icon -->
  <g transform="translate(40 60)">
    <path d="M 0 16
             C -16 4, -24 -8, -16 -18
             C -8 -24, 0 -18, 0 -12
             C 0 -18, 8 -24, 16 -18
             C 24 -8, 16 4, 0 16 Z"
          fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate"
      values="40 60;40 60;40 60;36 58;40 60;40 60;36 58;40 60"
      keyTimes="0;0.55;0.62;0.66;0.70;0.85;0.90;1"
      begin="0s" dur="3.2s" fill="freeze"/>
  </g>

  <!-- HP track -->
  <g transform="translate(80 44)">
    <rect width="360" height="32" rx="6" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>

    <!-- Fill -->
    <rect width="0" height="32" rx="6" fill="#22c55e">
      <animate attributeName="width"
               values="0;360;360;216;216;72;72"
               keyTimes="0;0.16;0.55;0.65;0.85;0.95;1"
               begin="0s" dur="3.2s" fill="freeze"/>
      <animate attributeName="fill"
               values="#22c55e;#22c55e;#eab308;#eab308;#ef4444;#ef4444"
               keyTimes="0;0.6;0.65;0.85;0.95;1"
               begin="0s" dur="3.2s" fill="freeze"/>
    </rect>

    <!-- HP number -->
    <text x="180" y="22" font-family="'JetBrains Mono', monospace" font-size="14"
          font-weight="800" fill="#ffffff" text-anchor="middle">
      <animate attributeName="textContent"
               values="100 / 100;100 / 100;60 / 100;60 / 100;20 / 100"
               keyTimes="0;0.55;0.65;0.85;0.95"
               begin="0s" dur="3.2s" fill="freeze"/>
      100 / 100
    </text>

    <!-- Damage flashes -->
    <rect width="360" height="32" rx="6" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1"
               begin="2.05s" dur="0.25s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1"
               begin="2.75s" dur="0.25s" fill="freeze"/>
    </rect>

    <!-- "-40" and "-40" damage numbers pop above -->
    <g transform="translate(180 -16)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="2.05s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="180 -16;180 -40" begin="2.05s" dur="0.7s" fill="freeze"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="900"
            fill="#dc2626" text-anchor="middle">-40</text>
    </g>
    <g transform="translate(100 -16)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="2.75s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="100 -16;100 -40" begin="2.75s" dur="0.7s" fill="freeze"/>
      <text font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="900"
            fill="#dc2626" text-anchor="middle">-40</text>
    </g>
  </g>
</svg>
