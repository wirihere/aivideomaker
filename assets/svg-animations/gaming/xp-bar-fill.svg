<?xml version="1.0" encoding="UTF-8"?>
<!--
  XP bar fill — RPG-style experience bar fills, level-up flash, LV+1 pops.
  Total: 2.8s. Holds.
  Viewport: 720 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="xp-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="xp-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Level badge -->
  <g transform="translate(80 100)">
    <circle r="48" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800"
          fill="#fbbf24" text-anchor="middle" dy="-8" letter-spacing="2">LV</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900"
          fill="#ffffff" text-anchor="middle" dy="16">
      <animate attributeName="textContent" values="11;12" begin="2.0s" dur="0.1s" fill="freeze"/>
      11
    </text>
    <!-- Flash on level up -->
    <circle r="48" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" begin="1.95s" dur="0.6s" fill="freeze"/>
      <animate attributeName="r" values="48;80" begin="1.95s" dur="0.6s" fill="freeze"/>
    </circle>
  </g>

  <!-- XP track -->
  <g transform="translate(160 84)">
    <rect width="480" height="32" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Fill -->
    <rect width="0" height="32" rx="16" fill="url(#xp-grad)">
      <animate attributeName="width" from="0"   to="480" begin="0.2s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.4 1"/>
      <animate attributeName="fill" from="url(#xp-grad)" to="#fbbf24" begin="1.95s" dur="0.6s" fill="freeze"/>
    </rect>
    <!-- Glow sweep -->
    <rect x="-80" y="0" width="80" height="32" fill="url(#xp-glow)">
      <animate attributeName="x" from="-80" to="480" begin="0.4s" dur="1.3s" fill="freeze"/>
    </rect>
    <!-- Label above -->
    <text x="0" y="-12" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700"
          fill="#94a3b8" letter-spacing="3">EXPERIENCE</text>
    <text x="480" y="-12" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700"
          fill="#94a3b8" letter-spacing="3" text-anchor="end">
      <animate attributeName="textContent"
               values="0/480 XP;120/480;240/480;360/480;480/480 XP"
               begin="0.2s" dur="1.6s" fill="freeze"/>
      0/480 XP
    </text>
  </g>

  <!-- LEVEL UP! badge pop -->
  <g transform="translate(400 170)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0;1.2;1" keyTimes="0;0.6;1" begin="2.0s" dur="0.5s" fill="freeze"/>
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#fbbf24"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900"
          fill="#92400e" text-anchor="middle" dy="6" letter-spacing="3">LEVEL UP!</text>
  </g>
</svg>
