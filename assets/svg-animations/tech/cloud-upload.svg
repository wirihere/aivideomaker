<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cloud upload — cloud fades in, arrow shoots up repeatedly, progress bar fills,
  then a tick confirms.
  Total: 3.6s. Holds.
  Viewport: 280 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <!-- Cloud (composed of overlapping circles + a base rect) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 30" to="0 0" begin="0s" dur="0.6s" fill="freeze"
      calcMode="spline" keySplines="0.2 0.8 0.3 1"/>

    <g fill="#cbd5e1">
      <circle cx="100" cy="100" r="34"/>
      <circle cx="140" cy="80"  r="42"/>
      <circle cx="186" cy="100" r="34"/>
      <rect   x="100" y="106" width="86" height="36" rx="18"/>
    </g>
    <g fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round">
      <path d="M 70 124
               Q 60 130 60 110
               Q 60 84 92 78
               Q 100 50 140 50
               Q 174 50 184 80
               Q 220 80 220 110
               Q 220 130 210 124"/>
    </g>
  </g>

  <!-- Upload arrow shoots up repeatedly -->
  <g transform="translate(140 175)" stroke="#0f172a" stroke-width="6"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-30" x2="0" y2="20" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.7s" repeatCount="3"/>
      <animate attributeName="y1" from="-10" to="-40" dur="1.2s" begin="0.7s" repeatCount="3"/>
    </line>
    <path d="M -16 -14 L 0 -30 L 16 -14" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.7s" repeatCount="3"/>
      <animate attributeName="transform" attributeType="XML" type="translate" additive="sum"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 6" to="0 -24" dur="1.2s" begin="0.7s" repeatCount="3"/>
    </path>
  </g>

  <!-- Progress fills along the bottom -->
  <rect x="50" y="208" width="180" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="50" y="208" width="0"   height="8" rx="4" fill="#10b981">
    <animate attributeName="width" from="0" to="180" begin="0.5s" dur="2.6s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.4 1"/>
  </rect>

  <!-- Done tick at the end -->
  <g transform="translate(140 175)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.3s" fill="freeze"/>
    <circle r="20" fill="#10b981"/>
    <path d="M -10 0 L -2 8 L 10 -8" fill="none" stroke="#ffffff" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
