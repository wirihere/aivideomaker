<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wifi — three arcs ripple out one at a time. Loops.
  Viewport: 200 × 200.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100 150)" fill="none" stroke="#06b6d4" stroke-linecap="round">
    <path d="M -90 0 Q 0 -110 90 0" stroke-width="14" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M -60 0 Q 0 -75 60 0" stroke-width="14" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M -30 0 Q 0 -38 30 0" stroke-width="14" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.0s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="8" fill="#06b6d4" stroke="none"/>
  </g>
</svg>
