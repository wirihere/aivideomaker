<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lock unlocking — shackle lifts and tilts open, body unlocks (color shifts to green).
  Total: 1.8s. Holds.
  Viewport: 200 × 240.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Body -->
  <g transform="translate(100 150)">
    <rect x="-50" y="-30" width="100" height="80" rx="10" fill="#475569">
      <animate attributeName="fill" from="#475569" to="#10b981" begin="1.0s" dur="0.5s" fill="freeze"/>
    </rect>
    <circle r="10" fill="#0f172a"/>
    <rect x="-3" y="0" width="6" height="22" fill="#0f172a"/>
  </g>

  <!-- Shackle (pivots from right peg, lifts and rotates open) -->
  <g transform="translate(120 110)">
    <animateTransform attributeName="transform" type="translate"
      values="120 110;120 100;120 100"
      keyTimes="0;0.4;1"
      begin="0.3s" dur="1.0s" fill="freeze"/>
    <g transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-30" begin="0.7s" dur="0.6s" fill="freeze"
        calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <path d="M 0 0 L 0 -34 A 30 30 0 0 1 -60 -34 L -60 0"
            fill="none" stroke="#475569" stroke-width="14"
            stroke-linecap="round"/>
    </g>
  </g>
</svg>
