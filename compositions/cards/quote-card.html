<template id="quote-card-tpl">
  <div data-composition-id="quote-card" data-width="1080" data-height="1920">
    <div class="qc-wrap">
      <div class="qc-card card card--quote card--dark-glass card--radius-lg card--pad-luxe card--w-wide">
        <div class="qc-mark card__quote-mark">&ldquo;</div>
        <div class="qc-text card__quote-text"></div>
        <div class="qc-by card__quote-by"></div>
      </div>
    </div>

    <style>
      [data-composition-id="quote-card"] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      [data-composition-id="quote-card"] .qc-wrap {
        will-change: transform, opacity;
        max-width: 920px;
      }

      [data-composition-id="quote-card"] .card { position: relative; display: flex; flex-direction: column; gap: 32px; box-sizing: border-box; will-change: transform, opacity; font-family: "Inter", system-ui, sans-serif; color: #eef1f5; }
      [data-composition-id="quote-card"] .card--dark-glass { background: rgba(13,24,38,0.92); backdrop-filter: blur(12px); border: 1.5px solid rgba(238,241,245,0.22); box-shadow: 0 24px 80px rgba(0,0,0,0.50); color: #eef1f5; }
      [data-composition-id="quote-card"] .card--radius-lg { border-radius: 28px; }
      [data-composition-id="quote-card"] .card--pad-luxe { padding: 72px 96px; }
      [data-composition-id="quote-card"] .card__quote-mark { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-style: italic; font-size: 180px; line-height: 0.6; color: #7aa0d4; opacity: 0.45; align-self: flex-start; }
      [data-composition-id="quote-card"] .card__quote-text { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-style: italic; font-size: 58px; line-height: 1.25; color: inherit; letter-spacing: -0.01em; }
      [data-composition-id="quote-card"] .card__quote-by { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; color: #7aa0d4; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="quote-card"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");

        root.querySelector(".qc-text").textContent = vars.text || "";
        root.querySelector(".qc-by").textContent   = vars.by   || "";

        const duration = Number(vars.duration || 4);
        const exitAt = Math.max(0.4, duration - 0.35);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Entrance
        tl.fromTo(root.querySelector(".qc-card"),
          { y: 30, scale: 0.94, opacity: 0 },
          { y: 0,  scale: 1,    opacity: 1, duration: 0.42, ease: "back.out(1.4)" }, 0);
        tl.fromTo(root.querySelector(".qc-mark"),
          { scale: 0.6, opacity: 0 },
          { scale: 1,   opacity: 0.45, duration: 0.30, ease: "back.out(2.2)" }, 0.10);
        tl.fromTo(root.querySelector(".qc-text"),
          { y: 16, opacity: 0 },
          { y: 0,  opacity: 1, duration: 0.45, ease: "power3.out" }, 0.20);
        tl.fromTo(root.querySelector(".qc-by"),
          { x: -14, opacity: 0 },
          { x: 0,   opacity: 1, duration: 0.32, ease: "power2.out" }, 0.40);

        // Exit — slide up + fade (upward dismissal for quotes)
        tl.to(root.querySelector(".qc-card"),
          { y: -40, opacity: 0, duration: 0.32, ease: "power3.in" }, exitAt);

        window.__timelines["quote-card"] = tl;
      })();
    </script>
  </div>
</template>
