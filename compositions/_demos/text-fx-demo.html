<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-fx demo</title>

<!-- 1. Structural base -->
<link rel="stylesheet" href="../design/cards.css">
<!-- 2. Vibe template (pick ONE) -->
<link rel="stylesheet" href="../design/templates/kinetic-pop.css">
<!-- 3. Brand tokens (pick ONE) -->
<link rel="stylesheet" href="../design/tokens-kindred.css">
<!-- 4. Effects + module bundle -->
<link rel="stylesheet" href="../design/effects-batch-08.css">
<link rel="stylesheet" href="../design/modules/all.css">

<script src="../design/vendor/gsap.min.js"></script>
<script src="../design/modules/all.js"></script>

<style>
  body { margin: 0; background: #0E0E12; color: #FBF9F6; font-family: var(--card-font-ui); }
  .demo { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
  .demo .scene-row {
    position: absolute; left: 80px; right: 80px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--card-font-display);
    font-weight: var(--card-title-weight);
    font-size: 64px;
    letter-spacing: var(--card-title-track);
    line-height: 1;
  }
  .demo .row-label {
    position: absolute; left: 80px; top: -28px;
    font-family: var(--card-font-mono, monospace);
    font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(251, 249, 246, 0.5);
  }
  .row-1 { top: 100px; }
  .row-2 { top: 260px; }
  .row-3 { top: 420px; }
  .row-4 { top: 580px; }
  .row-5 { top: 740px; }
  .row-6 { top: 900px; }
  .stat-num { color: #1A9E8F; font-weight: 800; }
</style>
</head>
<body>
<div id="demo" class="demo clip"
     data-composition-id="text-fx-demo"
     data-width="1920" data-height="1080"
     data-start="0" data-duration="6" data-track-index="0">

  <div class="scene-row row-1">
    <span class="row-label">explode</span>
    <span id="t-explode">EXPLODE</span>
  </div>
  <div class="scene-row row-2">
    <span class="row-label">stamp</span>
    <span id="t-stamp">STAMP</span>
  </div>
  <div class="scene-row row-3">
    <span class="row-label">cascade</span>
    <span id="t-cascade">words drop in sequence</span>
  </div>
  <div class="scene-row row-4">
    <span class="row-label">stagger</span>
    <span id="t-stagger">STAGGER</span>
  </div>
  <div class="scene-row row-5">
    <span class="row-label">type-on</span>
    <span id="t-typeon" class="fx-typeon-cursor">typewriter reveal</span>
  </div>
  <div class="scene-row row-6">
    <span class="row-label">counter</span>
    <span id="t-counter" class="stat-num fx-counter">12,500</span>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["text-fx-demo"] = tl;

  textFx.explode (tl, "#t-explode",  { at: 0.4,  duration: 0.8, seed: 7 });
  textFx.stamp   (tl, "#t-stamp",    { at: 1.4,  duration: 0.5 });
  textFx.cascade (tl, "#t-cascade",  { at: 2.2,  duration: 0.6, stagger: 0.08 });
  textFx.stagger (tl, "#t-stagger",  { at: 3.2,  duration: 0.6, stagger: 0.05 });
  textFx.typeOn  (tl, "#t-typeon",   { at: 4.0,  duration: 1.2 });
  textFx.counter (tl, "#t-counter",  { at: 4.8,  duration: 1.2, from: 0 });


  // Standalone autoplay — only when loaded directly in a top-level browser tab.
  // Studio + renderer wrap us in an iframe and drive seek themselves; we stay paused.
  if (window === window.top) {
    setTimeout(() => tl.play(0), 250);
  }
</script>
</body>
</html>
