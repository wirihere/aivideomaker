<template id="crossfade-two-tpl">
  <div data-composition-id="crossfade-two" data-width="1080" data-height="1920">
    <img class="cf-img cf-a grade" alt="" />
    <img class="cf-img cf-b grade" alt="" />

    <style>
      [data-composition-id="crossfade-two"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #0d1826;
      }
      [data-composition-id="crossfade-two"] .cf-img {
        position: absolute;
        inset: -6%;
        width: 112%;
        height: 112%;
        object-fit: cover;
        transform-origin: center;
        will-change: transform, opacity;
      }
      [data-composition-id="crossfade-two"] .cf-b { opacity: 0; }
      [data-composition-id="crossfade-two"] .grade {
        filter: grayscale(0.45) sepia(0.22) contrast(1.08) brightness(0.88);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="crossfade-two"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const srcA = vars.srcA || "";
        const srcB = vars.srcB || "";
        const duration = Number(vars.duration || 6);
        const crossfadeAt = Number(vars.crossfadeAt || duration * 0.45);
        const crossfadeLen = Number(vars.crossfadeLen || 0.8);

        const a = root.querySelector(".cf-a");
        const b = root.querySelector(".cf-b");
        a.src = srcA;
        b.src = srcB;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // A pushes through whole time
        tl.fromTo(a, { scale: 1.0 }, { scale: 1.07, duration: duration, ease: "none" }, 0);
        // B pushes too, but only after crossfade
        tl.fromTo(b, { scale: 1.02 }, { scale: 1.08, duration: duration - crossfadeAt, ease: "none" }, crossfadeAt);
        // Crossfade
        tl.to(a, { opacity: 0, duration: crossfadeLen, ease: "power1.inOut" }, crossfadeAt);
        tl.to(b, { opacity: 1, duration: crossfadeLen, ease: "power1.inOut" }, crossfadeAt);
        window.__timelines["crossfade-two"] = tl;
      })();
    </script>
  </div>
</template>
