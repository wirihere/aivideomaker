<template id="word-reveal-tpl">
  <div data-composition-id="word-reveal" data-width="1080" data-height="1920">
    <div class="wr-stage">
      <div class="wr-text"></div>
    </div>

    <style>
      [data-composition-id="word-reveal"] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      [data-composition-id="word-reveal"] .wr-stage {
        width: 100%;
        padding: 0 120px;
        box-sizing: border-box;
      }
      [data-composition-id="word-reveal"] .wr-text {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 800;
        font-size: 140px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: #eef1f5;
        text-shadow: 0 6px 24px rgba(0,0,0,0.55);
        display: flex;
        flex-wrap: wrap;
        gap: 0.24em 0.28em;
      }
      [data-composition-id="word-reveal"] .wr-word {
        display: inline-block;
        will-change: transform, opacity;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.currentScript.closest('[data-composition-id="word-reveal"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const text = String(vars.text || "");
        // words is [ { word: "ACC", start: 0.0, duration: 0.35 }, ... ] — times RELATIVE to this composition's start
        const words = Array.isArray(vars.words) ? vars.words : null;
        const color = vars.color || "#eef1f5";
        const fontSize = vars.fontSize || "140px";
        const fontWeight = vars.fontWeight || 800;
        const fontStyle = vars.fontStyle || "normal";
        const italic = vars.italic || [];  // array of word indices to italicise
        const highlight = vars.highlight || {}; // { index: "#hex" }
        const align = vars.align || "center"; // left | center
        const defaultDuration = Number(vars.wordDuration || 0.35);
        const defaultStagger = Number(vars.stagger || 0.12);
        const totalDuration = Number(vars.duration || 3.0);

        const textEl = root.querySelector(".wr-text");
        textEl.style.color = color;
        textEl.style.fontSize = fontSize;
        textEl.style.fontWeight = fontWeight;
        textEl.style.fontStyle = fontStyle;
        textEl.style.justifyContent = align === "center" ? "center" : "flex-start";
        textEl.style.textAlign = align;

        // Build words from either the timed array or a plain string
        const tokens = words
          ? words.map((w, i) => ({ word: w.word, start: Number(w.start), duration: Number(w.duration || defaultDuration), i }))
          : text.split(/\s+/).filter(Boolean).map((w, i) => ({ word: w, start: i * defaultStagger, duration: defaultDuration, i }));

        textEl.innerHTML = "";
        for (const t of tokens) {
          const span = document.createElement("span");
          span.className = "wr-word";
          span.textContent = t.word;
          if (italic.includes(t.i)) span.style.fontStyle = "italic";
          if (highlight[t.i]) span.style.color = highlight[t.i];
          textEl.appendChild(span);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const wordEls = root.querySelectorAll(".wr-word");
        wordEls.forEach((el, i) => {
          const t = tokens[i];
          tl.fromTo(el,
            { yPercent: 40, opacity: 0, filter: "blur(6px)" },
            { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: t.duration, ease: "power3.out" },
            t.start
          );
        });
        // Hold; composition duration is driven by data-duration, not this tl
        window.__timelines["word-reveal"] = tl;
      })();
    </script>
  </div>
</template>
