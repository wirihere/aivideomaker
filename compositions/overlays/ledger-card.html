<template id="ledger-card-tpl">
  <div data-composition-id="ledger-card" data-width="1080" data-height="1920">
    <div class="lc-stage">
      <div class="lc-fig">
        <span class="lc-currency"></span><span class="lc-amount"></span>
      </div>
      <div class="lc-rule"></div>
      <div class="lc-label"></div>
    </div>

    <style>
      [data-composition-id="ledger-card"] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      [data-composition-id="ledger-card"] .lc-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 60px 80px;
        min-width: 520px;
        background: rgba(238, 241, 245, 0.94);
        border-radius: 24px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        will-change: transform, opacity;
      }
      [data-composition-id="ledger-card"] .lc-fig {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 220px;
        line-height: 1;
        color: #0d1826;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      [data-composition-id="ledger-card"] .lc-currency {
        font-size: 110px;
        line-height: 1.1;
        padding-top: 22px;
        color: #1f3a68;
        font-weight: 700;
      }
      [data-composition-id="ledger-card"] .lc-rule {
        width: 140px;
        height: 3px;
        background: #1f3a68;
        transform-origin: center;
        will-change: transform, opacity;
      }
      [data-composition-id="ledger-card"] .lc-label {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 0.2em;
        color: #4b5a6d;
        text-transform: uppercase;
        text-align: center;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.currentScript.closest('[data-composition-id="ledger-card"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const currency = String(vars.currency || "$");
        const amount = String(vars.amount || "0");
        const label = String(vars.label || "TO YOU, ALWAYS");

        root.querySelector(".lc-currency").textContent = currency;
        root.querySelector(".lc-amount").textContent = amount;
        root.querySelector(".lc-label").textContent = label;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".lc-stage",
          { y: 30, scale: 0.9, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        // The amount slams — smash zoom settle
        tl.fromTo(".lc-fig",
          { scale: 1.35, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.15);
        tl.fromTo(".lc-rule",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.4);
        tl.fromTo(".lc-label",
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
        window.__timelines["ledger-card"] = tl;
      })();
    </script>
  </div>
</template>
