<template id="step-badge-tpl">
  <div data-composition-id="step-badge" data-width="1080" data-height="1920">
    <div class="sb-stage">
      <div class="sb-num"></div>
      <div class="sb-text">
        <div class="sb-kicker">STEP</div>
        <div class="sb-label"></div>
      </div>
    </div>

    <style>
      [data-composition-id="step-badge"] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      [data-composition-id="step-badge"] .sb-stage {
        display: flex;
        gap: 32px;
        align-items: center;
        padding: 36px 52px;
        background: rgba(13, 24, 38, 0.85);
        backdrop-filter: blur(8px);
        border: 1.5px solid rgba(238, 241, 245, 0.18);
        border-radius: 22px;
        will-change: transform, opacity;
      }
      [data-composition-id="step-badge"] .sb-num {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 120px;
        line-height: 1;
        color: #eef1f5;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id="step-badge"] .sb-text {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      [data-composition-id="step-badge"] .sb-kicker {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.3em;
        color: #7a93b8;
      }
      [data-composition-id="step-badge"] .sb-label {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 46px;
        color: #eef1f5;
        letter-spacing: -0.01em;
        max-width: 520px;
        line-height: 1.15;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.currentScript.closest('[data-composition-id="step-badge"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const number = String(vars.number || "01");
        const label = String(vars.label || "");
        const kicker = String(vars.kicker || "STEP");

        root.querySelector(".sb-num").textContent = number;
        root.querySelector(".sb-label").textContent = label;
        root.querySelector(".sb-kicker").textContent = kicker;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".sb-stage",
          { y: 40, scale: 0.92, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo(".sb-num",
          { scale: 1.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.1);
        tl.fromTo(".sb-kicker",
          { x: -12, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.25);
        tl.fromTo(".sb-label",
          { x: -12, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.35);
        window.__timelines["step-badge"] = tl;
      })();
    </script>
  </div>
</template>
