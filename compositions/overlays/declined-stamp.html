<template id="declined-stamp-tpl">
  <div data-composition-id="declined-stamp" data-width="1080" data-height="1920">
    <div class="ds-stage">
      <div class="ds-rule"></div>
      <div class="ds-word">DECLINED</div>
      <div class="ds-strike"></div>
    </div>

    <style>
      [data-composition-id="declined-stamp"] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      [data-composition-id="declined-stamp"] .ds-stage {
        position: relative;
        padding: 36px 70px;
      }
      [data-composition-id="declined-stamp"] .ds-rule {
        position: absolute;
        inset: 0;
        border: 6px solid #9a3a3a;
        border-radius: 18px;
        transform-origin: center;
        will-change: transform, opacity;
      }
      [data-composition-id="declined-stamp"] .ds-word {
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-weight: 700;
        font-size: 120px;
        letter-spacing: 0.08em;
        color: #9a3a3a;
        text-shadow: 0 4px 14px rgba(0,0,0,0.3);
        will-change: transform, opacity;
      }
      [data-composition-id="declined-stamp"] .ds-strike {
        position: absolute;
        left: 50px;
        right: 50px;
        top: 50%;
        height: 8px;
        background: #9a3a3a;
        transform-origin: left center;
        transform: scaleX(0);
        will-change: transform;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="declined-stamp"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const word = String(vars.word || "DECLINED");
        const color = vars.color || "#9a3a3a";
        const fontSize = vars.fontSize || "120px";
        const showStrike = vars.strike !== false;

        root.querySelector(".ds-word").textContent = word;
        root.querySelector(".ds-word").style.color = color;
        root.querySelector(".ds-word").style.fontSize = fontSize;
        root.querySelector(".ds-rule").style.borderColor = color;
        root.querySelector(".ds-strike").style.background = color;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // The stamp slams in
        tl.fromTo(".ds-rule", { scale: 1.5, rotation: -8, opacity: 0 },
                              { scale: 1, rotation: -4, opacity: 0.95, duration: 0.35, ease: "power4.out" }, 0);
        tl.fromTo(".ds-word", { scale: 1.5, rotation: -8, opacity: 0 },
                              { scale: 1, rotation: -4, opacity: 1, duration: 0.35, ease: "power4.out" }, 0);
        // Small settle
        tl.to([".ds-rule", ".ds-word"], { rotation: -3, duration: 0.4, ease: "elastic.out(1, 0.5)" }, 0.35);
        if (showStrike) {
          tl.to(".ds-strike", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.65);
        }
        window.__timelines["declined-stamp"] = tl;
      })();
    </script>
  </div>
</template>
