<template id="lower-third-tpl">
  <div data-composition-id="lower-third" data-width="1080" data-height="1920">
    <div class="lt-wrap">
      <div class="lt-bar"></div>
      <div class="lt-text"></div>
    </div>

    <style>
      [data-composition-id="lower-third"] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      [data-composition-id="lower-third"] .lt-wrap {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 220px;
        display: flex;
        gap: 28px;
        align-items: flex-start;
      }
      [data-composition-id="lower-third"] .lt-bar {
        width: 6px;
        min-height: 56px;
        align-self: stretch;
        background: #1f3a68;
        flex: 0 0 auto;
        will-change: transform, opacity;
      }
      [data-composition-id="lower-third"] .lt-text {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 500;
        font-size: 44px;
        line-height: 1.3;
        color: #eef1f5;
        letter-spacing: 0.005em;
        text-shadow: 0 4px 18px rgba(0,0,0,0.55);
        will-change: transform, opacity;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.currentScript.closest('[data-composition-id="lower-third"]');
        const vars = JSON.parse(root.getAttribute("data-variable-values") || "{}");
        const text = String(vars.text || "");
        const barColor = vars.barColor || "#1f3a68";
        const textColor = vars.textColor || "#eef1f5";
        const fontSize = vars.fontSize || "44px";
        const fontWeight = vars.fontWeight || 500;

        const bar = root.querySelector(".lt-bar");
        const txt = root.querySelector(".lt-text");
        bar.style.background = barColor;
        txt.style.color = textColor;
        txt.style.fontSize = fontSize;
        txt.style.fontWeight = fontWeight;
        txt.textContent = text;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(bar, { scaleY: 0, transformOrigin: "bottom center", opacity: 0 },
                       { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
        tl.fromTo(txt, { y: 18, opacity: 0 },
                       { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.12);
        window.__timelines["lower-third"] = tl;
      })();
    </script>
  </div>
</template>
