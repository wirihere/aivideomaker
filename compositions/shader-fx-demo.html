<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shader-fx demo · Phase 1 (DOF bokeh)</title>

<link rel="stylesheet" href="../design/cards.css">
<link rel="stylesheet" href="../design/templates/documentary.css">
<link rel="stylesheet" href="../design/tokens-kindred.css">
<link rel="stylesheet" href="../design/effects-batch-08.css">
<link rel="stylesheet" href="../design/modules/all.css">

<script src="../design/vendor/gsap.min.js"></script>
<script src="../design/vendor/twgl.min.js"></script>
<script src="../design/modules/all.js"></script>
<!-- shader-fx is opt-in; not in the auto-bundle (saves parse cost on
     non-shader comps + breaks layout in some hosts). -->
<script src="../design/modules/shader-fx.js"></script>

<!-- HEAD-INCLUDE -->

<style>
  body { margin: 0; background: #0E0E12; color: #FBF9F6; font-family: var(--card-font-ui); }
  .demo {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: #0E0E12;
  }

  /* Each scene clip — framework hides inactive ones via class="clip". */
  .scene {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  /* Label chip — identifies the scene on every panel. */
  .label-chip {
    position: absolute; top: 60px; left: 80px;
    font-family: var(--card-font-mono);
    font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(251, 249, 246, 0.85);
    border: 1px solid rgba(251, 249, 246, 0.32);
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(13, 24, 38, 0.55);
    backdrop-filter: blur(8px);
    z-index: 1500;
  }

  /* Common typography for each scene's hero text. */
  .hero {
    font-family: var(--card-font-display);
    font-weight: 600;
    font-size: 220px;
    color: var(--card-paper, #FBF9F6);
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .hero-sub {
    font-family: var(--card-font-mono);
    font-size: 32px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(251, 249, 246, 0.66);
    margin-top: 28px;
  }

  /* Scene 1 — control / no shader (baseline) */
  .scene-1 .ctl-text { font-family: var(--card-font-display); font-weight: 600; font-size: 200px; color: rgba(251, 249, 246, 0.92); letter-spacing: -0.025em; }

  /* Scene 2 — DOF bokeh active. Stage uses dark teal so the warm-gold ring
     reads cinematically. */
  .scene-2 {
    background: radial-gradient(ellipse at center, #15324a 0%, #0a1a26 70%, #050a10 100%);
  }
  .scene-2 .dof-stage { display: flex; flex-direction: column; align-items: center; gap: 32px; z-index: 1; }
  .scene-2 .dof-text {
    font-family: var(--card-font-display);
    font-weight: 600;
    font-size: 220px;
    color: #FBF9F6;
    letter-spacing: -0.03em;
    text-shadow: 0 8px 30px rgba(0,0,0,0.55);
  }
  .scene-2 .dof-sub {
    font-family: var(--card-font-mono);
    font-size: 28px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255, 215, 130, 0.85);
  }

  /* Scene 3 — control / no shader (still no canvas, baseline B) */
  .scene-3 .ctl-text { font-family: var(--card-font-display); font-weight: 600; font-size: 200px; color: rgba(251, 249, 246, 0.92); letter-spacing: -0.025em; }

  /* Scene 4 — DOF active again, lower intensity. Lets the QA reviewer see
     that the same effect adapts to a different scene with different copy. */
  .scene-4 {
    background: radial-gradient(ellipse at center, #281a3d 0%, #0e0820 70%, #050310 100%);
  }
  .scene-4 .dof-stage { display: flex; flex-direction: column; align-items: center; gap: 32px; z-index: 1; }
  .scene-4 .dof-text {
    font-family: var(--card-font-display);
    font-weight: 500;
    font-size: 180px;
    color: #FBF9F6;
    letter-spacing: -0.02em;
  }

  /* Scene 5 — control / no shader (final baseline) */
  .scene-5 .ctl-text { font-family: var(--card-font-display); font-weight: 600; font-size: 200px; color: rgba(251, 249, 246, 0.92); letter-spacing: -0.025em; }

  /* Scene 6 — outro / wrap with logo lockup. */
  .scene-6 .outro-stack { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .scene-6 .outro-mark { font-family: var(--card-font-display); font-weight: 700; font-size: 180px; color: #FBF9F6; letter-spacing: -0.03em; }
  .scene-6 .outro-tag { font-family: var(--card-font-mono); font-size: 30px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(251, 249, 246, 0.6); }
</style>
</head>
<body>
<div id="demo" class="demo clip"
     data-composition-id="shader-fx-demo"
     data-width="1920" data-height="1080"
     data-start="0" data-duration="18" data-track-index="0">

  <!-- ===== Scene 1 — control / baseline A (0–3s) ===== -->
  <div id="scene-1" class="scene scene-1 clip"
       data-start="0" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 1 · control · no shader</div>
    <div id="s1-text" class="ctl-text">No DOF</div>
  </div>

  <!-- ===== Scene 2 — DOF bokeh active (3–6s) ===== -->
  <div id="scene-2" class="scene scene-2 clip"
       data-start="3" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 2 · shaderFx.dof · ACTIVE</div>
    <div id="s2-stage" class="dof-stage">
      <div id="s2-text" class="dof-text">Bokeh</div>
      <div id="s2-sub" class="dof-sub">depth of field · phase 1</div>
    </div>
  </div>

  <!-- ===== Scene 3 — control / baseline B (6–9s) ===== -->
  <div id="scene-3" class="scene scene-3 clip"
       data-start="6" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 3 · control · no shader</div>
    <div id="s3-text" class="ctl-text">Plain text</div>
  </div>

  <!-- ===== Scene 4 — DOF bokeh active again (9–12s) ===== -->
  <div id="scene-4" class="scene scene-4 clip"
       data-start="9" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 4 · shaderFx.dof · low intensity</div>
    <div id="s4-stage" class="dof-stage">
      <div id="s4-text" class="dof-text">Cinematic</div>
    </div>
  </div>

  <!-- ===== Scene 5 — control / baseline C (12–15s) ===== -->
  <div id="scene-5" class="scene scene-5 clip"
       data-start="12" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 5 · control · no shader</div>
    <div id="s5-text" class="ctl-text">Just CSS</div>
  </div>

  <!-- ===== Scene 6 — outro (15–18s) ===== -->
  <div id="scene-6" class="scene scene-6 clip"
       data-start="15" data-duration="3" data-track-index="1">
    <div class="label-chip">scene 6 · outro</div>
    <div id="s6-stack" class="outro-stack">
      <div id="s6-mark" class="outro-mark">shaderFx</div>
      <div id="s6-tag" class="outro-tag">phase 1 · dof bokeh</div>
    </div>
  </div>

</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["shader-fx-demo"] = tl;

  // Scene 1 — control: simple text fade so the scene isn't empty visually.
  // Uses fromTo per LEARNINGS §3 (never bare .from on a paused timeline).
  tl.fromTo("#s1-text",
    { y: 30, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
    0.2);

  // Scene 2 — DOF bokeh, peak intensity 1.0. The aperture ramps 0 → 1 → 0
  // across 1.6s, with a brief plateau at peak. The shader paints a warm-gold
  // ring of 12 hexagonal-ish points pulsing on the procedural canvas.
  shaderFx.dof(tl, "#scene-2", {
    at: 3.4,
    duration: 1.8,
    intensity: 1.0,
    seed: 11,
  });
  // Headline drop-in to give the bokeh something to sit behind.
  tl.fromTo("#s2-text",
    { y: 50, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
    3.2);
  tl.fromTo("#s2-sub",
    { letterSpacing: "0.6em", opacity: 0 },
    { letterSpacing: "0.32em", opacity: 1, duration: 0.6, ease: "power2.out" },
    3.6);

  // Scene 3 — control again.
  tl.fromTo("#s3-text",
    { y: 30, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
    6.2);

  // Scene 4 — DOF at 0.7 intensity, different seed so the ring rotates
  // visibly differently from scene 2 (but deterministically across renders).
  shaderFx.dof(tl, "#scene-4", {
    at: 9.4,
    duration: 1.6,
    intensity: 0.7,
    seed: 23,
  });
  tl.fromTo("#s4-text",
    { y: 40, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
    9.2);

  // Scene 5 — control C.
  tl.fromTo("#s5-text",
    { y: 30, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
    12.2);

  // Scene 6 — outro stack. No shader — just clean cascade so the wrap reads
  // calm after the bokeh moments.
  tl.fromTo("#s6-mark",
    { y: 60, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
    15.2);
  tl.fromTo("#s6-tag",
    { letterSpacing: "0.6em", opacity: 0 },
    { letterSpacing: "0.32em", opacity: 1, duration: 0.7, ease: "power2.out" },
    15.7);

  // Standalone autoplay guard — only when loaded directly in a top-level
  // browser tab. Studio + renderer wrap us in an iframe and drive seek
  // themselves; in those contexts we stay paused so they own the clock.
  if (window === window.top) {
    setTimeout(() => tl.play(0), 250);
  }
</script>
</body>
</html>
