<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claim Mate — primary lockup, REVERSE (cream on navy)
  Use this variant on dark backgrounds (the video, dark site header, etc.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- CLAIM wordmark, cream -->
  <text x="300" y="140"
        font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-weight="900"
        font-size="140"
        fill="#F5F1E8"
        text-anchor="middle"
        letter-spacing="-4">CLAIM</text>

  <!-- MATE stamp box, tilted 2° -->
  <g transform="rotate(2 300 300)">
    <rect x="105" y="210" width="390" height="170" rx="24" ry="24" fill="#FFB84D" />

    <text x="285" y="338"
          font-family="Inter, -apple-system, Segoe UI, sans-serif"
          font-weight="900"
          font-size="130"
          fill="#F5F1E8"
          text-anchor="middle"
          letter-spacing="-4">MATE</text>

    <g transform="translate(430 330)">
      <circle cx="16" cy="16" r="22" fill="#0B1F3F" />
      <path d="M 6 17 L 14 25 L 27 10"
            stroke="#F5F1E8"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />
    </g>
  </g>
</svg>
